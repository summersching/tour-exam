const DATA = [
 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`q`,no:1,type:`字彙`,topic:`觀光`,star:2,

 {kind:`q`,no:5,type:`字彙`,topic:`住宿`,star:3,

  vocab:[[`complimentary (adj.)`,`ˌkɑmpləˈmɛntərɪ`,`免費招待的`],[`provide (v.)`,`prəˈvaɪd`,`提供`],[`fridge (n.)`,`frɪdʒ`,`冰箱`]]},

 {kind:`q`,no:6,type:`字彙`,topic:`住宿`,star:3,
  stem:`A __BLANK__ room is a room in a hotel made available to guests for a short period of time at no additional charge.`,
  zh:`<b>禮遇</b>房是飯店免費提供給客人短時間使用的房間。`,
  opts:[`banquet 宴會`,`courtesy 禮遇的`,`safety 安全`,`rest 休息`],ans:1,

 {kind:`q`,no:7,type:`對話`,topic:`觀光`,star:2,

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:永續發展與認證森林`,
  text:[`Today, Earth's population stands at around seven billion, and it is still growing faster. As a result, the imbalance between what nature replenishes and humans consume will probably continue to grow. So how will so many people live on Earth without exhausting the planet? The key is sustainability—finding new and efficient ways of conserving more and consuming less—so that we do not ultimately exhaust our most valuable resources.`,`Sustainable communities are cities and towns that encourage residents to protect their local environment in ways that also reduce their impact on the larger global environment. Residents in Mbam, Senegal, for example, use solar ovens to cook food. By using solar energy instead of cutting down trees, people are saving forests for future generations. Communities in other places are using improved public transportation systems to reduce the need for cars. In Curitiba, Brazil, city buses are frequent, convenient, and efficient—so 70 percent of Curitiba's commuters use them. As a result, the city has little traffic jam and cleaner air.`,`Another way to prevent depletion of natural resources is through proper forest management. Forest logging—the cutting down of trees—can contribute to water pollution, lead to the destruction of animal habitats, and have other negative effects. In an effort to preserve forests, several countries have begun creating certified forests. When a forest is certified, the logging is regulated and carried out in a sustainable way. In West Virginia (USA), for example, loggers in certified forests must receive special training to avoid causing soil erosion. Roughly seven percent of the world's forests are certified. Canada has the largest areas, with almost 300 million acres of certified forests.`],
  real:`永續發展(sustainability)是環境類熱門題,帶生態團宣導用得到。三個「永續社區」實例好記:<b>①塞內加爾用太陽能爐煮飯(省樹)②巴西庫里奇巴公車系統高效,70% 通勤者搭 → 少塞車、空氣好 ③認證森林(certified forest)——伐木受規範、伐木工受訓避免土壤流失,加拿大認證林最大</b>。口試被問如何永續,可用「再生能源 + 大眾運輸 + 森林管理」三招。`,
  vocab:[[`sustainability (n.)`,`səˌstenəˈbɪlətɪ`,`永續性`],[`replenish (v.)`,`rɪˈplɛnɪʃ`,`補充`],[`conserve (v.)`,`kənˈsɝv`,`保育`],[`depletion (n.)`,`dɪˈpliʃən`,`枯竭`],[`certified (adj.)`,`ˈsɝtəˌfaɪd`,`認證的`],[`erosion (n.)`,`ɪˈroʒən`,`侵蝕`]]},

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:噁心食物博物館`,
  text:[`There is a museum for everything these days. The latest museum to open may turn you off your dinner. It is the Disgusting Food Museum, which opened at the end of last year in Malmo, Sweden. Curious foods from exotic cultures have always fascinated people. Unfamiliar foods can be delicious, or they can be more of an acquired taste. The new exhibition allows people to analyze why they love and hate certain foods. The museum's founder, Dr. Samuel West, a psychologist by day and a museum curator by night, explained why he created the project. He said he was researching the effect of meat consumption on the environment. This made him think about alternative sources of protein, like insects. Although most people would think eating bugs is gross, Dr. West wanted to make them reconsider the idea. While many food-related museums of late have mostly just been opportunities for novel selfies, West is adamant that the Disgusting Food Museum is there to help people learn and think critically, not just to pose for photos.`,`The museum is a 400-square-meter space that will challenge four of our five senses - smell, touch, sight and taste. The displays include food from around the world that some people might think is disgusting. However, people in other parts of the world think this food is totally normal and is a regular part of their diet. The food exhibits include American favorites such as Jell-O salad and world food like fried tarantula, fermented shark, roasted guinea pigs and sheep eyeball juice. Dr. West said that we could all eat any food, but our culture tells us what is tasty and what is not. According to him, what we find disgusting has to be learned—it's purely cultural.`],
  real:`「噁心食物博物館(瑞典 Malmo)」是趣味文化題。重點:創辦人 West 研究「肉食對環境的影響」→ 想推廣昆蟲等替代蛋白質 → 用博物館讓人反思「什麼可吃」;館內挑戰嗅/觸/視/味四感,展出炸狼蛛、發酵鯊魚、烤天竺鼠等——這些在某些文化是日常。核心觀點:<b>「覺得噁心是後天學來的,純粹是文化」</b>。帶團介紹異國飲食、破除偏見時很好用。`,
  vocab:[[`disgusting (adj.)`,`dɪsˈɡʌstɪŋ`,`噁心的`],[`acquired taste`,``,`後天養成的口味`],[`curator (n.)`,`ˈkjʊretɚ`,`館長、策展人`],[`adamant (adj.)`,`ˈædəmənt`,`堅決的`],[`fermented (adj.)`,`fɚˈmɛntɪd`,`發酵的`],[`edible (adj.)`,`ˈɛdəbl̩`,`可食的`]]},

      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
</body>
</html>
