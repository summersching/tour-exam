<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>模擬測驗</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;
    --ok:#15904a;--okbg:#e5f6ec;--no:#c62a2a;--nobg:#fbe9e9;--sel:#7c3aed;--selbg:#f1eafd;
    --chipv:#eef2ff;--chipvk:#3b4fd6;--chipd:#e8f7ee;--chipdk:#1f8a4c;--chipr:#f4ecfb;--chiprk:#7a3fc0;
    --chipt:#eef1f5;--chiptk:#55647a;--blank:#fff4cc;--blankk:#8a6d1a;--star:#e8a72b;
    --skillbg:#eaf1ff;--skillk:#1d4ed8;--skillbd:#93b4f7;--notebg:#fff3e6;--notek:#b5560c;--notebd:#f3bd7e;
    --grambg:#f0ecfb;--gramk:#6b34c9;--grambd:#c2a8ef;--kk:#0e7c86;--hd1:#6d28d9;--hd2:#7c3aed;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --ok:#5ad48a;--okbg:#173023;--no:#ff8080;--nobg:#331a1a;--sel:#a78bfa;--selbg:#2a1f3f;
    --chipv:#22284a;--chipvk:#9db0ff;--chipd:#16301f;--chipdk:#6fe0a0;--chipr:#2a1f3a;--chiprk:#c79bff;
    --chipt:#242b36;--chiptk:#9fb0c6;--blank:#3d3413;--blankk:#f2d778;--star:#f0b840;
    --skillbg:#182741;--skillk:#9db8ff;--skillbd:#2f4a80;--notebg:#3a2a17;--notek:#f4b877;--notebd:#6a4a24;
    --grambg:#241a3a;--gramk:#c9adff;--grambd:#4a3670;--kk:#57cdd8;--hd1:#4c1d95;--hd2:#6d28d9;
  }}
  :root[data-theme="dark"]{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --ok:#5ad48a;--okbg:#173023;--no:#ff8080;--nobg:#331a1a;--sel:#a78bfa;--selbg:#2a1f3f;
    --chipv:#22284a;--chipvk:#9db0ff;--chipd:#16301f;--chipdk:#6fe0a0;--chipr:#2a1f3a;--chiprk:#c79bff;
    --chipt:#242b36;--chiptk:#9fb0c6;--blank:#3d3413;--blankk:#f2d778;--star:#f0b840;
    --skillbg:#182741;--skillk:#9db8ff;--skillbd:#2f4a80;--notebg:#3a2a17;--notek:#f4b877;--notebd:#6a4a24;
    --grambg:#241a3a;--gramk:#c9adff;--grambd:#4a3670;--kk:#57cdd8;--hd1:#4c1d95;--hd2:#6d28d9;
  }
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 90px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.3rem} header p{margin:2px 0;opacity:.92;font-size:.83rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05)}
  .row{margin:14px 0} .row:first-child{margin-top:0}
  .row>.lb{font-weight:700;font-size:.86rem;margin-bottom:7px;color:var(--ink)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip2{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.86rem;font-family:inherit}
  .chip2:hover{border-color:var(--sub)}
  .chip2.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:700}
  .start{display:block;width:100%;margin-top:20px;background:var(--sel);color:#fff;border:none;padding:14px;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
  .start:hover{filter:brightness(1.06)}
  .avail{font-size:.8rem;color:var(--sub);margin-top:8px;text-align:center}
  /* 作答列 */
  .bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 0}
  .bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prog{font-size:.9rem;font-weight:700} .prog b{color:var(--sel)}
  .timer{font-size:.95rem;font-weight:700;color:var(--accent);background:var(--chipv);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
  .timer.warn{color:var(--no);background:var(--nobg)}
  .submit{margin-left:auto;background:var(--sel);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer;font-size:.88rem;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  /* B3 答題卡題號導覽 */
  .navbtn{padding:7px 12px;font-size:.84rem}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:10px 0 2px}
  .navcell{border:1.4px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;
    padding:6px 0;text-align:center;cursor:pointer;font-size:.82rem;font-weight:700;font-family:inherit}
  .navcell.done{background:var(--selbg);color:var(--sel);border-color:var(--sel)}
  /* B2 續答列 */
  .resume{background:var(--chipv);border:1.5px solid var(--sel);border-radius:14px;padding:14px 16px;margin:18px 0 0;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .resume .rt{font-weight:700;font-size:.92rem;flex:1;min-width:180px}
  .resume .rt small{display:block;color:var(--sub);font-weight:400;font-size:.8rem;margin-top:2px}
  .resume button{border:none;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem}
  .resume .go{background:var(--sel);color:#fff} .resume .drop{background:var(--card);color:var(--sub);border:1px solid var(--line)}
  /* B6 提示 toast */
  .qtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:20;
    background:var(--sel);color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;font-size:.9rem;
    box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s}
  .qtoast.on{opacity:1}
  .card.flash{animation:cardflash 1.2s ease}
  @keyframes cardflash{0%,100%{box-shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05)}30%{box-shadow:0 0 0 3px var(--sel)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;margin:16px 0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05);scroll-margin-top:70px}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .qno{background:var(--sel);color:#fff;font-weight:700;border-radius:8px;padding:2px 11px;font-size:.85rem}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600}
  .c-v{background:var(--chipv);color:var(--chipvk)} .c-d{background:var(--chipd);color:var(--chipdk)} .c-r{background:var(--chipr);color:var(--chiprk)} .c-t{background:var(--chipt);color:var(--chiptk)}
  .c-jl{background:#4f46e5;color:#fff;letter-spacing:.5px}
  .src{font-size:.72rem;border-radius:6px;padding:1px 7px;font-weight:700;text-decoration:none}
  .src.leader{background:var(--chipv);color:var(--chipvk)} .src.guide{background:var(--okbg);color:var(--ok)}
  .stars{color:var(--star);font-size:.85rem;margin-left:auto} .stars .dim{opacity:.28}
  .stem{font-size:1.04rem;margin:6px 0 12px}
  .blank{background:var(--blank);color:var(--blankk);border-radius:5px;padding:0 22px;margin:0 3px;font-weight:700}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 13px;border-radius:10px;cursor:pointer;font-size:.97rem;font-family:inherit;transition:.12s}
  .opt:hover{border-color:var(--sel)} .opt .lab{font-weight:700;color:var(--sub);min-width:18px}
  .opt.sel{border-color:var(--sel);background:var(--selbg)} .opt.sel .lab{color:var(--sel)}
  .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .lab{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--nobg)} .opt.no .lab{color:var(--no)}
  .opt .mk{margin-left:auto;font-weight:700} .oen{} .ozh{color:var(--sub);margin-left:4px}
  .reveal{display:none;margin:12px 0 6px;border-top:1px dashed var(--line);padding-top:10px}
  .card.done .reveal{display:block}
  .lbl{font-weight:700;font-size:.8rem;color:var(--accent);margin:10px 0 4px} .lbl:first-child{margin-top:0}
  .zh{color:var(--sub);font-size:.94rem} .ana{font-size:.94rem}
  .ana b.ac,.box b.ac{color:var(--ok)} .ana b.wr,.box b.wr{color:var(--no)}
  .box{border-left:4px solid;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.9rem}
  .box .h{display:block;margin-bottom:2px;font-size:.82rem}
  .box.skill{background:var(--skillbg);border-color:var(--skillbd)} .box.skill .h{color:var(--skillk)}
  .box.note{background:var(--notebg);border-color:var(--notebd)} .box.note .h{color:var(--notek)}
  .box.gram{background:var(--grambg);border-color:var(--grambd)} .box.gram .h{color:var(--gramk)}
  .revlink{display:inline-block;margin:6px 0;font-size:.82rem;color:var(--accent);text-decoration:none;font-weight:700}
  .say{cursor:pointer;color:var(--ok);font-size:.92em;margin-left:5px;user-select:none}
  table.vocab{border-collapse:collapse;width:100%;font-size:.9rem;margin:2px 0}
  table.vocab td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
  table.vocab td:first-child{font-weight:700;white-space:nowrap} table.vocab td:nth-child(2){color:var(--sub);white-space:nowrap}
  .acc{display:inline-block;min-width:15px;text-align:center;font-size:.7rem;font-weight:700;color:#fff;background:var(--no);border-radius:9px;padding:0 5px;vertical-align:middle}
  /* 結果 */
  .score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .score .big{font-size:2.7rem;font-weight:800;color:var(--sel);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score .sub{color:var(--sub);font-size:.9rem;margin-top:6px}
  .score .wb{margin-top:10px;font-size:.86rem;color:var(--no)}
  .score .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .filt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  .fchip{font-size:.78rem;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .fchip:hover{border-color:var(--sub)}
  .fchip.on{background:var(--chipr);color:var(--chiprk);border-color:var(--chiprk);font-weight:700}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--sub);font-size:.74rem;margin-top:20px}
</style>

<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>📝 模擬測驗</h1>
  <p>英語 · 日語 · 觀光 · 執業實務 · 執業法規 · 隨機組卷 · 交卷計分 · 官方答案</p>
</div></header>

<!-- 設定 -->
<main class="wrap" id="setup">
  <div id="resumeBar"></div>
  <div class="panel">
    <div class="row"><div class="lb">出題方式</div><div class="chips" id="sMode"></div></div>
    <div class="row"><div class="lb">科目</div><div class="chips" id="sSubj"></div></div>
    <div class="row"><div class="lb">證照</div><div class="chips" id="sCert"></div></div>
    <div class="row" id="rowType"><div class="lb">題型</div><div class="chips" id="sType"></div></div>
    <div class="row hidden" id="rowTopic"><div class="lb">考點</div><div class="chips" id="sTopic"></div></div>
    <div class="row"><div class="lb">年份</div><div class="chips" id="sYear"></div></div>
    <div class="row"><div class="lb">題數</div><div class="chips" id="sNum"></div></div>
    <div class="row"><div class="lb">限時</div><div class="chips" id="sTime"></div></div>
    <button class="start" id="startBtn">開始測驗</button>
    <div class="avail" id="avail"></div>
  </div>
  <footer id="setupFoot">字彙 · 對話 · 文法題(閱讀題需搭配文章,請至各年詳解練習)</footer>
</main>

<!-- 作答 -->
<div id="quiz" class="hidden">
  <div class="bar"><div class="wrap">
    <span class="prog" id="prog"></span>
    <button class="btn navbtn" id="navBtn">📋 題號</button>
    <span class="timer hidden" id="timer"></span>
    <button class="submit" id="submitBtn">交卷</button>
  </div>
  <div class="wrap"><div class="navgrid hidden" id="navGrid"></div></div>
  </div>
  <main class="wrap" id="qlist"></main>
  <div class="wrap"><button class="start" id="submitBtn2">交卷計分</button></div>
</div>

<!-- 結果 -->
<div id="result" class="hidden">
  <main class="wrap">
    <div class="score">
      <div class="big" id="scNum"></div>
      <div class="sub" id="scSub"></div>
      <div class="wb" id="scWb"></div>
      <div class="acts">
        <button class="btn" id="againBtn">🔁 再測一組</button>
        <button class="btn" id="reviewWrong">📌 只看答錯</button>
        <button class="btn" id="reviewAll">看全部</button>
        <a class="btn" id="wbLink" href="錯題本.html">前往錯題本</a>
      </div>
    </div>
    <main class="wrap" id="rlist" style="padding:0"></main>
  </main>
</div>

<script>
const LAB=['A','B','C','D'];
const CNAME={leader:'領隊',guide:'導遊'};
const WB_KEY='wrongbook_en';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return{};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(q,picked){var o=wbLoad(),id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={cert:q.c,y:q.y,no:q.no,type:q.type,topic:q.topic,star:q.star,stem:q.stem,opts:q.opts,ans:q.ans,zh:q.zh,ana:q.ana,skill:q.skill||'',note:q.note||'',gram:q.gram||'',real:q.real||'',vocab:q.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  wbSave(o);}
function wbRemove(q){var o=wbLoad();delete o[q.c+'-'+q.y+'-'+q.no];wbSave(o);}
/* 觀光錯題本(獨立命名空間,只存 id+作答,渲染時由 gh.js/gh_ana.js 補齊,避免與英文題庫衝突) */
const WBGH_KEY='wrongbook_gh';
function wbghLoad(){try{return JSON.parse(localStorage.getItem(WBGH_KEY)||'{}');}catch(e){return{};}}
function wbghSave(o){try{localStorage.setItem(WBGH_KEY,JSON.stringify(o));}catch(e){}}
function wbghAdd(q,picked){var o=wbghLoad(),id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={c:q.c,y:q.y,no:q.no,picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  wbghSave(o);}
/* 執業實務錯題本(獨立命名空間 wrongbook_pr) */
const WBPR_KEY='wrongbook_pr';
function wbprAdd(q,picked){var o;try{o=JSON.parse(localStorage.getItem(WBPR_KEY)||'{}');}catch(e){o={};}
  var id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={c:q.c,y:q.y,no:q.no,picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  try{localStorage.setItem(WBPR_KEY,JSON.stringify(o));}catch(e){}}
/* 執業法規錯題本(獨立命名空間 wrongbook_pr2) */
const WBPR2_KEY='wrongbook_pr2';
function wbpr2Add(q,picked){var o;try{o=JSON.parse(localStorage.getItem(WBPR2_KEY)||'{}');}catch(e){o={};}
  var id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={c:q.c,y:q.y,no:q.no,picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  try{localStorage.setItem(WBPR2_KEY,JSON.stringify(o));}catch(e){}}
/* 外語日語錯題本(獨立命名空間 wrongbook_jp,只存 id+作答,渲染由 jp.js/jp_ana.js 補齊) */
const WBJP_KEY='wrongbook_jp';
function wbjpAdd(q,picked){var o;try{o=JSON.parse(localStorage.getItem(WBJP_KEY)||'{}');}catch(e){o={};}
  var id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={c:q.c,y:q.y,no:q.no,picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  try{localStorage.setItem(WBJP_KEY,JSON.stringify(o));}catch(e){}}

function splitOpt(o){const m=o.match(/^(.*?)([（(]?[一-鿿].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function sayBtn(t){return `<span class="say" data-say="${String(t).replace(/"/g,'&quot;').replace(/</g,'')}" title="點我朗讀(日語)">🔊</span>`;}
function enPhrase(o){var m=String(o).match(/^[^一-鿿（(]+/);return m?m[0].trim():'';}
/* 檢討畫面逐選項朗讀:日文唸整個選項(ja)、英文唸英文部分(en);中文科不加 */
function saySpan(text,lang){return `<span class="say" data-lang="${lang}" data-say="${String(text).replace(/"/g,'&quot;').replace(/</g,'')}" title="點我朗讀">🔊</span>`;}
function optSay(q,o){ if(isJp())return saySpan(o,'ja');
  if(cfg.subj==='en'){const en=enPhrase(o);return en?saySpan(en,'en'):'';} return ''; }
function stemSay(q){ if(isJp())return saySpan(String(q.stem).replace('__BLANK__',' '),'ja');
  if(cfg.subj==='en')return saySpan(String(q.stem).replace('__BLANK__',' '),'en'); return ''; }
function hlAna(ana,opts,ans){
  if(!ana||!opts)return ana||'';
  var A=Array.isArray(ans)?ans:[ans];if(!A.length||A[0]<0)return ana;
  var marks=[];for(var i=0;i<opts.length;i++){var ph=enPhrase(opts[i]);if(ph&&ph.length>=3)marks.push({ph:ph,cls:(A.indexOf(i)>=0?'ac':'wr')});}
  if(!marks.length)return ana;
  marks.sort(function(a,b){return b.ph.length-a.ph.length;});
  var map={};marks.forEach(function(m){if(!(m.ph in map))map[m.ph]=m.cls;});
  var alt=marks.map(function(m){return m.ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  var re;try{re=new RegExp('('+alt+')','g');}catch(e){return ana;}
  return ana.replace(re,function(mt){return '<b class="'+(map[mt]||'ac')+'">'+mt+'</b>';});
}
const stars=n=>[0,1,2].map(i=>i<(n||0)?'★':'<span class="dim">☆</span>').join('');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== 設定狀態 ===== */
let cfg={subj:'en',cert:'all',type:'all',gtopic:'all',year:'all',num:20,time:0,mode:'random'};
function curBank(){return cfg.subj==='gh'?GHBANK:cfg.subj==='pr'?PRBANK:cfg.subj==='pr2'?PR2BANK:cfg.subj==='jp'?JPBANK:BANK;}
function isGh(){return cfg.subj==='gh';}
function isCn(){return cfg.subj==='gh'||cfg.subj==='pr'||cfg.subj==='pr2';}   // 中文科(觀光/執業實務/執業法規):純中文選項、解析結構相同
function isJp(){return cfg.subj==='jp';}   // 外語日語:自有題庫+ana(zh/a/v),TTS 日語
const SUBJNAME={en:'外語英語',jp:'外語日語',gh:'觀光資源概要',pr:'執業實務',pr2:'執業法規'};
function ansOk(q,p){return SCORE.ok(q,p);}   // 送分題一律算對
function optInner(o){return (isCn()||isJp())?o:splitOpt(o);}       // 中文科/日語:純選項不切英/中
function ozHtml(q,i){if(!isJp())return'';const d=ghData(q);return (d&&d.oz&&d.oz[i])?`<span class="ozh">${d.oz[i]}</span>`:'';}  // 日語:每選項中文(檢討時顯示)
const GT={'史':'🏛 臺灣歷史','地':'🗺 臺灣地理','維護':'🛡 資源維護'};
function ghData(q){const k=q.c+'-'+q.y+'-'+q.no;
  if(cfg.subj==='jp')return (typeof JPANA!=='undefined'&&JPANA[k])||null;
  if(cfg.subj==='pr')return (typeof PRANA!=='undefined'&&PRANA[k])||null;
  if(cfg.subj==='pr2')return (typeof PR2ANA!=='undefined'&&PR2ANA[k])||null;
  return (typeof GHANA!=='undefined'&&GHANA[k])||null;}
function qChips(q){
  if(isJp()){const d=ghData(q);return (d&&d.tt?`<span class="chip c-r">${d.t||'日語'}</span><span class="chip c-t">${d.tt}</span>`:'<span class="chip c-r">外語日語</span>')+(d&&d.jl?`<span class="chip c-jl">${d.jl}</span>`:'');}
  if(isCn()){const d=ghData(q);
    if(cfg.subj==='gh')return d?`<span class="chip c-r">${GT[d.t]||'觀光'}</span><span class="chip c-t">${d.tt}</span>`:'<span class="chip c-r">觀光資源概要</span>';
    return d?`<span class="chip c-r">${d.t}</span>${d.tt?`<span class="chip c-t">${d.tt}</span>`:''}`:`<span class="chip c-r">${cfg.subj==='pr2'?'執業法規':'執業實務'}</span>`;}
  const cls=q.type==='字彙'?'c-v':q.type==='對話'?'c-d':'c-r';
  return `<span class="chip ${cls}">${q.type}</span><span class="chip c-t">${q.topic}</span>`;
}
function starsHtml(q){return (isCn()||isJp())?'':`<span class="stars">${stars(q.star)}</span>`;}
function revealHtml(q){
  if(isJp()){
    const d=ghData(q);
    let h=SCORE.banner(q)+(SCORE.free(q)?'':`<div class="lbl">正解</div><div class="ana">${SCORE.acc(q).map(k=>`<b style="color:var(--ok);font-weight:700">${"ABCD"[k]}. ${q.opts[k]}</b> ${sayBtn(q.opts[k])}`).join('<br>')}</div>`);
    if(d){
      if(d.zh)h+=`<div class="lbl">整句中譯</div><div class="zh">${d.zh}</div>`;
      if(d.a)h+=`<div class="lbl">解析</div><div class="ana">${d.a}</div>`;
      if(d.g)h+=`<div class="box gram"><b class="h">📝 文法 / 句型</b>${d.g}</div>`;
      if(d.v&&d.v.length)h+=`<div class="lbl">難字 / 語彙</div><table class="vocab">${d.v.map(v=>`<tr><td>${v[0]} ${sayBtn(v[0])}</td><td>${v[1]||''}${(v[3]!=null&&v[3]!=='')?' <span class="acc">'+v[3]+'</span>':''}</td><td>${v[2]||''}</td></tr>`).join('')}</table>`;
      if(d.s)h+=`<div class="box skill"><b class="h">💡 解題技巧</b>${d.s}</div>`;
      if(d.n)h+=`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${d.n}</div>`;
    }
    h+=`<a class="revlink" href="日文詳解.html?cert=${q.c}&year=${q.y}">🔍 看原卷詳解</a>`;
    return h;
  }
  if(isCn()){
    const d=ghData(q);
    let h=SCORE.banner(q)+STALE.box(cfg.subj,q);
    if(d){
      h+=`<div class="lbl">解析 <span style="font-weight:400;color:var(--sub)">(AI 輔助,以官方答案為準)</span></div><div class="ana">${d.a}</div>`;
      if(d.s)h+=`<div class="box skill"><b class="h">💡 解題技巧</b>${d.s}</div>`;
      if(d.n)h+=`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${d.n}</div>`;
    }
    const rev=cfg.subj==='pr'?'執業實務複習.html':cfg.subj==='pr2'?'執業法規複習.html':'觀光複習.html';
    h+=`<a class="revlink" href="${rev}?cert=${q.c}&year=${q.y}">🔍 看原卷複習</a>`;
    return h;
  }
  return `<div class="lbl">整句中譯</div><div class="zh">${q.zh}</div>
        ${SCORE.banner(q)}${SCORE.free(q)?'':`<div class="lbl">正解</div><div class="ana"><b style="color:var(--ok);font-weight:700">${SCORE.acc(q).map(k=>"ABCD"[k]+". "+q.opts[k]).join('<br>')}</b></div>`}
        <div class="lbl">解析</div><div class="ana">${hlAna(q.ana,q.opts,SCORE.acc(q))}</div>
        ${q.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${q.skill}</div>`:''}
        ${q.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${q.note}</div>`:''}
        ${q.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${q.gram}</div>`:''}
        <a class="revlink" href="英語詳解.html?cert=${q.c}&year=${q.y}#q${q.no}">🔍 看原題詳解</a>`;
}
function optMark(q,i,p){
  return SCORE.mark(q,i,p);
}
function mkChips(id,items,key){
  document.getElementById(id).innerHTML=items.map(it=>
    `<span class="chip2 ${cfg[key]===it.v?'on':''}" data-v="${it.v}">${it.t}</span>`).join('');
  document.getElementById(id).onclick=e=>{const c=e.target.closest('[data-v]');if(!c)return;
    let v=c.dataset.v; if(key==='num'||key==='time')v=+v; cfg[key]=v;
    document.getElementById(id).querySelectorAll('.chip2').forEach(x=>x.classList.toggle('on',x===c));
    if(key==='subj')syncSubjectUI();
    if(key==='mode'||key==='subj')updateModeUI();
    updAvail();};
}
/* C5 整卷模擬:切到整卷時鎖單一證照+單一年份,隱藏題型/考點/題數(=整份卷) */
function updateModeUI(){
  const whole=cfg.mode==='whole';
  const numRow=document.getElementById('sNum').closest('.row');
  numRow.classList.toggle('hidden',whole);
  document.getElementById('rowType').classList.toggle('hidden',whole||isCn()||isJp());
  document.getElementById('rowTopic').classList.toggle('hidden',whole||cfg.subj!=='gh');
  const YEARS=[...new Set(curBank().map(q=>q.y))].sort();
  if(whole){
    if(cfg.cert==='all')cfg.cert='leader';
    if(cfg.year==='all'||!YEARS.includes(cfg.year))cfg.year=YEARS[YEARS.length-1];
    mkChips('sCert',[{v:'leader',t:'領隊'},{v:'guide',t:'導遊'}],'cert');
    mkChips('sYear',YEARS.map(y=>({v:y,t:y+'年'})),'year');
  }else{
    mkChips('sCert',[{v:'all',t:'全部'},{v:'leader',t:'領隊'},{v:'guide',t:'導遊'}],'cert');
    mkChips('sYear',[{v:'all',t:'全部'}].concat(YEARS.map(y=>({v:y,t:y+'年'}))),'year');
  }
}
function syncSubjectUI(){
  const cn=isCn();
  document.getElementById('rowType').classList.toggle('hidden',cn||isJp());
  document.getElementById('rowTopic').classList.toggle('hidden',cfg.subj!=='gh');  // 考點僅觀光有
  document.getElementById('setupFoot').textContent = cfg.subj==='gh'
    ? '觀光資源概要 · 臺灣歷史/地理/觀光資源維護 · 官方標準答案(含送分題)'
    : cfg.subj==='pr'
    ? '執業實務 · 領隊技巧/航空票務/急救/旅遊安全/國際禮儀 · 官方標準答案'
    : cfg.subj==='pr2'
    ? '執業法規 · 觀光法規/入出境/外匯/民法債編旅遊/兩岸關係 · 官方標準答案(含更正)'
    : cfg.subj==='jp'
    ? '外語日語 · 讀音/文法/敬語/觀光接待/讀解 · 官方標準答案 · 🔊 發音'
    : '字彙 · 對話 · 文法題(閱讀題需搭配文章,請至各年詳解練習)';
  const YEARS=[...new Set(curBank().map(q=>q.y))].sort();
  if(cfg.year!=='all'&&!YEARS.includes(cfg.year))cfg.year='all';
  mkChips('sYear',[{v:'all',t:'全部'}].concat(YEARS.map(y=>({v:y,t:y+'年'}))),'year');
}
function buildSetup(){
  mkChips('sMode',[{v:'random',t:'🎲 隨機組卷'},{v:'whole',t:'📄 整卷模擬'}],'mode');
  mkChips('sSubj',[{v:'en',t:'外語英語'},{v:'jp',t:'外語日語'},{v:'gh',t:'觀光資源概要'},{v:'pr',t:'執業實務'},{v:'pr2',t:'執業法規'}],'subj');
  mkChips('sCert',[{v:'all',t:'全部'},{v:'leader',t:'領隊'},{v:'guide',t:'導遊'}],'cert');
  mkChips('sType',[{v:'all',t:'全部'},{v:'字彙',t:'字彙'},{v:'對話',t:'對話'},{v:'文法',t:'文法'}],'type');
  mkChips('sTopic',[{v:'all',t:'全部'},{v:'史',t:'🏛 歷史'},{v:'地',t:'🗺 地理'},{v:'維護',t:'🛡 資源維護'}],'gtopic');
  mkChips('sNum',[{v:10,t:'10 題'},{v:20,t:'20 題'},{v:30,t:'30 題'},{v:50,t:'50 題'}],'num');
  mkChips('sTime',[{v:0,t:'不限時'},{v:15,t:'15 分'},{v:25,t:'25 分'},{v:40,t:'40 分'}],'time');
  syncSubjectUI();
  updateModeUI();
  updAvail();
}
function pool(){
  if(isCn()||isJp())return curBank().filter(q=>(cfg.cert==='all'||q.c===cfg.cert)&&(cfg.year==='all'||q.y===cfg.year)
    &&(cfg.gtopic==='all'||(ghData(q)&&ghData(q).t===cfg.gtopic)));
  return BANK.filter(q=>(cfg.cert==='all'||q.c===cfg.cert)&&(cfg.type==='all'||q.type===cfg.type)&&(cfg.year==='all'||q.y===cfg.year));
}
function updAvail(){const n=pool().length;
  document.getElementById('avail').textContent = cfg.mode==='whole'
    ? '整卷:'+CNAME[cfg.cert]+' '+cfg.year+' 年共 '+n+' 題 · 依題號順序作答 · 交卷後看及格判定(60%)'
    : '符合條件題數:'+n+' 題,將隨機抽 '+Math.min(cfg.num,n)+' 題';}

/* ===== 作答 ===== */
let paper=[],picks={},timerId=null,remain=0,warned5=false;
/* B2 續答:作答中把進度存 localStorage;交卷/放棄時清除 */
const DRAFT_KEY='quiz_draft';
function saveDraft(){ if(!paper.length||document.getElementById('quiz').dataset.done)return;
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({
    cfg:cfg, refs:paper.map(q=>({c:q.c,y:q.y,no:q.no})), picks:picks,
    remain:(cfg.time>0?remain:0), ts:Date.now()
  }));}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');}catch(e){return null;}}
/* B6 小提示 */
function qtoast(msg){var t=document.createElement('div');t.className='qtoast';t.textContent=msg;
  document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),300);},2600);}
function startQuiz(){
  const qz=document.getElementById('quiz');qz.removeAttribute('data-done');qz.removeAttribute('data-forced');
  let p=pool().slice();
  if(!p.length){alert('這個條件下沒有題目,換個條件試試');return;}
  if(cfg.mode==='whole'){ p.sort((a,b)=>a.no-b.no); paper=p; }        // 整卷:全份、依題號順序
  else { p=shuffle(p); paper=p.slice(0,Math.min(cfg.num,p.length)); }  // 隨機組卷
  picks={}; warned5=false; clearDraft();
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderPaper(); updProg(); buildNav(); window.scrollTo(0,0);
  if(cfg.time>0){remain=cfg.time*60;startTimer();}else{document.getElementById('timer').classList.add('hidden');}
}
/* B2 從草稿接續作答 */
function resumeQuiz(d){
  cfg=d.cfg||cfg; warned5=false;
  const bank=curBank();
  paper=(d.refs||[]).map(r=>bank.find(q=>q.c===r.c&&q.y===r.y&&q.no===r.no)).filter(Boolean);
  if(!paper.length||paper.length!==(d.refs||[]).length){clearDraft();document.getElementById('resumeBar').innerHTML='';alert('題庫已更新,無法接續上次測驗,已清除草稿。');return;}
  picks=d.picks||{};
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  const qz=document.getElementById('quiz');qz.classList.remove('hidden');qz.removeAttribute('data-done');
  renderPaper(); updProg(); buildNav();
  Object.keys(picks).forEach(qi=>{const b=document.querySelector('.opt[data-qi="'+qi+'"][data-i="'+picks[qi]+'"]');if(b)b.classList.add('sel');});
  updNav();
  if(cfg.time>0){remain=d.remain||cfg.time*60;startTimer();}else{document.getElementById('timer').classList.add('hidden');}
  window.scrollTo(0,0);
}
/* B3 題號答題卡 */
function buildNav(){
  document.getElementById('navGrid').innerHTML=paper.map((q,qi)=>
    `<button class="navcell" data-navqi="${qi}">${qi+1}</button>`).join('');
  updNav();
}
function updNav(){
  document.querySelectorAll('.navcell').forEach(c=>{
    c.classList.toggle('done',picks[+c.dataset.navqi]!=null);});
}
function renderPaper(){
  document.getElementById('qlist').innerHTML=paper.map((q,qi)=>{
    const stem=q.stem.replace('__BLANK__','<span class="blank"></span>');
    return `<div class="card" id="qc${qi}" data-qi="${qi}">
      <div class="qhead"><span class="qno">第 ${qi+1} 題</span>
        ${qChips(q)}
        <span class="src ${q.c}">${CNAME[q.c]}${q.y}-${q.no}</span>
        ${starsHtml(q)}</div>
      <div class="stem">${stem}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-qi="${qi}" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${optInner(o)}</span><span class="mk"></span></button>`).join('')}</div>
      <div class="reveal">${revealHtml(q)}</div></div>`;
  }).join('');
  document.getElementById('qlist').onclick=e=>{const s=e.target.closest('.say');if(s){speak(s.dataset.say);return;}
    const b=e.target.closest('.opt');if(!b||document.getElementById('quiz').dataset.done)return;
    const qi=+b.dataset.qi,i=+b.dataset.i; picks[qi]=i;
    document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(x=>x.classList.toggle('sel',x===b));
    updProg(); updNav(); saveDraft();};
}
function updProg(){const done=Object.keys(picks).length;document.getElementById('prog').innerHTML=`已答 <b>${done}</b> / ${paper.length}`;}
function startTimer(){const t=document.getElementById('timer');t.classList.remove('hidden');
  function tick(){const m=Math.floor(remain/60),s=remain%60;t.textContent='⏱ '+m+':'+(s<10?'0':'')+s;t.classList.toggle('warn',remain<=60);
    if(cfg.time>5 && !warned5 && remain<=300 && remain>0){warned5=true;qtoast('⏰ 剩 5 分鐘,把握時間');}   // B6 五分鐘提醒
    if(remain%10===0)saveDraft();   // B2 定時保存進度
    if(remain<=0){clearInterval(timerId);submit(true);return;}remain--;}
  tick();timerId=setInterval(tick,1000);}

/* ===== 交卷 ===== */
let submitArm=false;
function submit(forced){
  const un=paper.length-Object.keys(picks).length;
  if(un>0 && !forced && !submitArm){
    submitArm=true;
    var b=document.getElementById('submitBtn'),b2=document.getElementById('submitBtn2');
    if(b)b.textContent='還有 '+un+' 題未答,再按交卷';
    if(b2)b2.textContent='還有 '+un+' 題未作答,再按一次交卷計分';
    // B6 跳到第一題未答並閃爍提示
    var firstUn=-1;for(var k=0;k<paper.length;k++){if(picks[k]==null){firstUn=k;break;}}
    if(firstUn>=0){var card=document.getElementById('qc'+firstUn);
      if(card){card.scrollIntoView({behavior:'smooth',block:'start'});card.classList.add('flash');setTimeout(function(){card.classList.remove('flash');},1300);}
      qtoast('還有 '+un+' 題未答,已跳到第 '+(firstUn+1)+' 題');}
    setTimeout(function(){submitArm=false;if(b)b.textContent='交卷';if(b2)b2.textContent='交卷計分';},4000);
    return;
  }
  if(timerId){clearInterval(timerId);timerId=null;}
  document.getElementById('quiz').dataset.done='1'; clearDraft();
  let correct=0,wrong=[];
  const byTopic={},byType={};
  const GTN={'史':'觀光·臺灣歷史','地':'觀光·臺灣地理','維護':'觀光·資源維護'};
  paper.forEach((q,qi)=>{const p=picks[qi];const ok=ansOk(q,p);
    let tp,ty;
    if(cfg.subj==='gh'){const gd=ghData(q);tp=gd?GTN[gd.t]:'觀光資源概要';ty='觀光資源概要';}
    else if(cfg.subj==='pr'){const gd=ghData(q);tp=gd&&gd.t?('執業實務·'+gd.t):'執業實務';ty='執業實務';}
    else if(cfg.subj==='pr2'){const gd=ghData(q);tp=gd&&gd.t?('執業法規·'+gd.t):'執業法規';ty='執業法規';}
    else if(cfg.subj==='jp'){const gd=ghData(q);tp=gd&&gd.t?('外語日語·'+gd.t):'外語日語';ty='外語日語';}
    else{tp=q.topic;ty=q.type;}
    (byTopic[tp]=byTopic[tp]||{ok:0,n:0}).n++;if(ok)byTopic[tp].ok++;
    (byType[ty]=byType[ty]||{ok:0,n:0}).n++;if(ok)byType[ty].ok++;
    if(ok)correct++;else{wrong.push(qi);if(p!=null){cfg.subj==='gh'?wbghAdd(q,p):cfg.subj==='pr'?wbprAdd(q,p):cfg.subj==='pr2'?wbpr2Add(q,p):cfg.subj==='jp'?wbjpAdd(q,p):wbAdd(q,p);}}  // 有作答且答錯 → 進對應科目錯題本
  });
  try{let hist=JSON.parse(localStorage.getItem('quiz_history')||'[]');
    hist.push({ts:Date.now(),subj:cfg.subj,cert:cfg.cert,qtype:cfg.type,year:cfg.year,correct:correct,total:paper.length,byTopic:byTopic,byType:byType});
    if(hist.length>300)hist=hist.slice(-300);
    localStorage.setItem('quiz_history',JSON.stringify(hist));}catch(e){}
  showResult(correct,wrong);
}
function showResult(correct,wrong){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const n=paper.length,pct=Math.round(correct/n*100);
  document.getElementById('scNum').textContent=correct+' / '+n;
  document.getElementById('scSub').textContent = cfg.mode==='whole'
    ? '答對率 '+pct+'%　'+(pct>=60?'✅ 達及格標準(60%)':'❌ 未達 60%,再加強')
    : '答對率 '+pct+'%　'+(pct>=80?'🎉 很棒!':pct>=60?'👍 再加強':'💪 多練幾組');
  const wbn=wrong.filter(qi=>picks[qi]!=null).length;
  var wbName=cfg.subj==='gh'?'觀光':cfg.subj==='pr'?'執業實務':cfg.subj==='pr2'?'執業法規':cfg.subj==='jp'?'日語':'';
  var wbFile=cfg.subj==='gh'?'觀光錯題本.html':cfg.subj==='pr'?'執業實務錯題本.html':cfg.subj==='pr2'?'執業法規錯題本.html':cfg.subj==='jp'?'日文錯題本.html':'錯題本.html';
  document.getElementById('scWb').textContent=wbn?('答錯 '+wbn+' 題已收入'+wbName+'錯題本,可前往複習'):'';
  var wl=document.getElementById('wbLink');if(wl){wl.setAttribute('href',wbFile);wl.textContent='前往'+wbName+'錯題本';}
  renderResult('all',wrong);
  window.scrollTo(0,0);
}
function renderResult(mode,wrong){
  const list=paper.map((q,qi)=>({q,qi})).filter(({q,qi})=>mode==='wrong'?!ansOk(q,picks[qi]):true);
  document.getElementById('rlist').innerHTML=list.map(({q,qi})=>{
    const stem=q.stem.replace('__BLANK__','<span class="blank"></span>');
    const p=picks[qi];
    return `<div class="card done">
      <div class="qhead"><span class="qno">第 ${qi+1} 題</span>
        ${qChips(q)}
        <span class="src ${q.c}">${CNAME[q.c]}${q.y}-${q.no}</span>
        ${starsHtml(q)}</div>
      <div class="stem">${stem} ${stemSay(q)}</div>
      <div class="opts">${q.opts.map((o,i)=>{const[c,mk]=optMark(q,i,p);
        return `<div class="opt ${c}"><span class="lab">${LAB[i]}</span><span>${optInner(o)}${ozHtml(q,i)}</span>${optSay(q,o)}<span class="mk">${mk}</span></div>`;}).join('')}</div>
      <div class="reveal">
        ${p==null?'<div class="lbl" style="color:var(--no)">⚠️ 這題未作答</div>':''}
        ${revealHtml(q)}
      </div></div>`;
  }).join('')||'<p style="text-align:center;color:var(--sub);padding:30px">🎉 這組全對,沒有答錯的題!</p>';
}

/* ===== 事件 ===== */
/* 檢討畫面朗讀(逐選項 / 題幹 / 正解 / 難字):依 data-lang 選語言 */
document.getElementById('rlist').addEventListener('click',e=>{
  const s=e.target.closest('.say'); if(!s)return;
  const lang=s.dataset.lang==='en'?'en-US':'ja-JP';
  try{const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang=lang;
    u.rate=lang==='ja-JP'?(+(localStorage.getItem('pref_jp_rate'))||0.9):0.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(err){}
});
document.getElementById('startBtn').onclick=startQuiz;
document.getElementById('submitBtn').onclick=()=>submit();
document.getElementById('submitBtn2').onclick=()=>submit();
document.getElementById('againBtn').onclick=()=>{document.getElementById('quiz').removeAttribute('data-done');document.getElementById('result').classList.add('hidden');document.getElementById('setup').classList.remove('hidden');window.scrollTo(0,0);updAvail();};
let curWrong=[];
document.getElementById('reviewWrong').onclick=()=>{renderResult('wrong');};
document.getElementById('reviewAll').onclick=()=>{renderResult('all');};
/* B3 題號答題卡:開關 + 跳題 */
document.getElementById('navBtn').onclick=()=>{const g=document.getElementById('navGrid');g.classList.toggle('hidden');updNav();};
document.getElementById('navGrid').onclick=e=>{const c=e.target.closest('[data-navqi]');if(!c)return;
  const card=document.getElementById('qc'+c.dataset.navqi);if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
  document.getElementById('navGrid').classList.add('hidden');};
/* B2 續答列:載入時若有未完成測驗草稿就提示 */
function initResume(){
  const d=loadDraft(),bar=document.getElementById('resumeBar');if(!bar)return;
  if(!d||!d.refs||!d.refs.length){bar.innerHTML='';return;}
  const done=Object.keys(d.picks||{}).length,tot=d.refs.length;
  const sname=(SUBJNAME[d.cfg&&d.cfg.subj]||'測驗');
  bar.innerHTML=`<div class="resume"><div class="rt">📝 有一份未完成的測驗<small>${sname} · 已答 ${done}/${tot} 題</small></div>
    <button class="go" id="rsGo">▶️ 繼續作答</button><button class="drop" id="rsDrop">🗑️ 放棄</button></div>`;
  document.getElementById('rsGo').onclick=()=>{const dd=loadDraft();bar.innerHTML='';if(dd)resumeQuiz(dd);};
  document.getElementById('rsDrop').onclick=()=>{clearDraft();bar.innerHTML='';};
}

/* C3 弱點一鍵組卷:可由儀表板帶參數預選(subj/cert/topic/num/time,auto=1 直接開始) */
function applyQueryPreset(){
  const qp=new URLSearchParams(location.search);
  const subj=qp.get('subj'); if(subj&&SUBJNAME[subj])cfg.subj=subj;
  const cert=qp.get('cert'); if(cert==='leader'||cert==='guide'||cert==='all')cfg.cert=cert;
  const topic=qp.get('topic'); if(topic&&cfg.subj==='gh'&&['史','地','維護'].includes(topic))cfg.gtopic=topic;
  const num=+qp.get('num'); if([10,20,30,50].indexOf(num)>=0)cfg.num=num;
  const time=+qp.get('time'); if([0,15,25,40].indexOf(time)>=0)cfg.time=time;
  return qp.get('auto')==='1';
}
buildSetup();
const _auto=applyQueryPreset();
buildSetup();   // 依帶入的 cfg 重建晶片選取狀態
initResume();
if(_auto)startQuiz();
