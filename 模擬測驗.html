<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>模擬測驗</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;
    --ok:#15904a;--okbg:#e5f6ec;--no:#c62a2a;--nobg:#fbe9e9;--sel:#7c3aed;--selbg:#f1eafd;
    --chipv:#eef2ff;--chipvk:#3b4fd6;--chipd:#e8f7ee;--chipdk:#1f8a4c;--chipr:#f4ecfb;--chiprk:#7a3fc0;
    --chipt:#eef1f5;--chiptk:#55647a;--blank:#fff4cc;--blankk:#8a6d1a;--star:#e8a72b;
    --skillbg:#eaf1ff;--skillk:#1d4ed8;--skillbd:#93b4f7;--notebg:#fff3e6;--notek:#b5560c;--notebd:#f3bd7e;
    --grambg:#f0ecfb;--gramk:#6b34c9;--grambd:#c2a8ef;--kk:#0e7c86;--hd1:#6d28d9;--hd2:#7c3aed;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --ok:#5ad48a;--okbg:#173023;--no:#ff8080;--nobg:#331a1a;--sel:#a78bfa;--selbg:#2a1f3f;
    --chipv:#22284a;--chipvk:#9db0ff;--chipd:#16301f;--chipdk:#6fe0a0;--chipr:#2a1f3a;--chiprk:#c79bff;
    --chipt:#242b36;--chiptk:#9fb0c6;--blank:#3d3413;--blankk:#f2d778;--star:#f0b840;
    --skillbg:#182741;--skillk:#9db8ff;--skillbd:#2f4a80;--notebg:#3a2a17;--notek:#f4b877;--notebd:#6a4a24;
    --grambg:#241a3a;--gramk:#c9adff;--grambd:#4a3670;--kk:#57cdd8;--hd1:#4c1d95;--hd2:#6d28d9;
  }}
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 90px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.3rem} header p{margin:2px 0;opacity:.92;font-size:.83rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .row{margin:14px 0} .row:first-child{margin-top:0}
  .row>.lb{font-weight:700;font-size:.86rem;margin-bottom:7px;color:var(--ink)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip2{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.86rem;font-family:inherit}
  .chip2.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:700}
  .start{display:block;width:100%;margin-top:20px;background:var(--sel);color:#fff;border:none;padding:14px;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
  .start:hover{filter:brightness(1.06)}
  .avail{font-size:.8rem;color:var(--sub);margin-top:8px;text-align:center}
  /* 作答列 */
  .bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 0}
  .bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prog{font-size:.9rem;font-weight:700} .prog b{color:var(--sel)}
  .timer{font-size:.95rem;font-weight:700;color:var(--accent);background:var(--chipv);padding:4px 12px;border-radius:16px}
  .timer.warn{color:var(--no);background:var(--nobg)}
  .submit{margin-left:auto;background:var(--sel);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer;font-size:.88rem;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px;margin:16px 0;box-shadow:0 1px 6px rgba(0,0,0,.04);scroll-margin-top:70px}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .qno{background:var(--sel);color:#fff;font-weight:700;border-radius:8px;padding:2px 11px;font-size:.85rem}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600}
  .c-v{background:var(--chipv);color:var(--chipvk)} .c-d{background:var(--chipd);color:var(--chipdk)} .c-r{background:var(--chipr);color:var(--chiprk)} .c-t{background:var(--chipt);color:var(--chiptk)}
  .src{font-size:.72rem;border-radius:6px;padding:1px 7px;font-weight:700;text-decoration:none}
  .src.leader{background:var(--chipv);color:var(--chipvk)} .src.guide{background:var(--okbg);color:var(--ok)}
  .stars{color:var(--star);font-size:.85rem;margin-left:auto} .stars .dim{opacity:.28}
  .stem{font-size:1.04rem;margin:6px 0 12px}
  .blank{background:var(--blank);color:var(--blankk);border-radius:5px;padding:0 22px;margin:0 3px;font-weight:700}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 13px;border-radius:10px;cursor:pointer;font-size:.97rem;font-family:inherit;transition:.12s}
  .opt:hover{border-color:var(--sel)} .opt .lab{font-weight:700;color:var(--sub);min-width:18px}
  .opt.sel{border-color:var(--sel);background:var(--selbg)} .opt.sel .lab{color:var(--sel)}
  .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .lab{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--nobg)} .opt.no .lab{color:var(--no)}
  .opt .mk{margin-left:auto;font-weight:700} .oen{} .ozh{color:var(--sub);margin-left:4px}
  .reveal{display:none;margin:12px 0 6px;border-top:1px dashed var(--line);padding-top:10px}
  .card.done .reveal{display:block}
  .lbl{font-weight:700;font-size:.8rem;color:var(--accent);margin:10px 0 4px} .lbl:first-child{margin-top:0}
  .zh{color:var(--sub);font-size:.94rem} .ana{font-size:.94rem}
  .box{border-left:4px solid;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.9rem}
  .box .h{display:block;margin-bottom:2px;font-size:.82rem}
  .box.skill{background:var(--skillbg);border-color:var(--skillbd)} .box.skill .h{color:var(--skillk)}
  .box.note{background:var(--notebg);border-color:var(--notebd)} .box.note .h{color:var(--notek)}
  .box.gram{background:var(--grambg);border-color:var(--grambd)} .box.gram .h{color:var(--gramk)}
  .revlink{display:inline-block;margin:6px 0;font-size:.82rem;color:var(--accent);text-decoration:none;font-weight:700}
  /* 結果 */
  .score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .score .big{font-size:2.6rem;font-weight:800;color:var(--sel);line-height:1.1}
  .score .sub{color:var(--sub);font-size:.9rem;margin-top:6px}
  .score .wb{margin-top:10px;font-size:.86rem;color:var(--no)}
  .score .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .filt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  .fchip{font-size:.78rem;padding:4px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .fchip.on{background:var(--chipr);color:var(--chiprk);border-color:var(--chiprk);font-weight:700}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--sub);font-size:.74rem;margin-top:20px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
<script src="bank.js"></script>
<script src="gh.js"></script>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>📝 模擬測驗</h1>
  <p>外語英語 + 觀光資源概要 · 隨機組卷 · 交卷計分 · 官方標準答案</p>
</div></header>

<!-- 設定 -->
<main class="wrap" id="setup">
  <div class="panel">
    <div class="row"><div class="lb">科目</div><div class="chips" id="sSubj"></div></div>
    <div class="row"><div class="lb">證照</div><div class="chips" id="sCert"></div></div>
    <div class="row" id="rowType"><div class="lb">題型</div><div class="chips" id="sType"></div></div>
    <div class="row"><div class="lb">年份</div><div class="chips" id="sYear"></div></div>
    <div class="row"><div class="lb">題數</div><div class="chips" id="sNum"></div></div>
    <div class="row"><div class="lb">限時</div><div class="chips" id="sTime"></div></div>
    <button class="start" id="startBtn">開始測驗</button>
    <div class="avail" id="avail"></div>
  </div>
  <footer id="setupFoot">字彙 · 對話 · 文法題(閱讀題需搭配文章,請至各年詳解練習)</footer>
</main>

<!-- 作答 -->
<div id="quiz" class="hidden">
  <div class="bar"><div class="wrap">
    <span class="prog" id="prog"></span>
    <span class="timer hidden" id="timer"></span>
    <button class="submit" id="submitBtn">交卷</button>
  </div></div>
  <main class="wrap" id="qlist"></main>
  <div class="wrap"><button class="start" id="submitBtn2">交卷計分</button></div>
</div>

<!-- 結果 -->
<div id="result" class="hidden">
  <main class="wrap">
    <div class="score">
      <div class="big" id="scNum"></div>
      <div class="sub" id="scSub"></div>
      <div class="wb" id="scWb"></div>
      <div class="acts">
        <button class="btn" id="againBtn">🔁 再測一組</button>
        <button class="btn" id="reviewWrong">📌 只看答錯</button>
        <button class="btn" id="reviewAll">看全部</button>
        <a class="btn" href="錯題本.html">前往錯題本</a>
      </div>
    </div>
    <main class="wrap" id="rlist" style="padding:0"></main>
  </main>
</div>

<script>
const LAB=['A','B','C','D'];
const CNAME={leader:'領隊',guide:'導遊'};
const WB_KEY='wrongbook_en';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return{};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(q,picked){var o=wbLoad(),id=q.c+'-'+q.y+'-'+q.no,e=o[id]||{};
  o[id]={cert:q.c,y:q.y,no:q.no,type:q.type,topic:q.topic,star:q.star,stem:q.stem,opts:q.opts,ans:q.ans,zh:q.zh,ana:q.ana,skill:q.skill||'',note:q.note||'',gram:q.gram||'',real:q.real||'',vocab:q.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};
  wbSave(o);}
function wbRemove(q){var o=wbLoad();delete o[q.c+'-'+q.y+'-'+q.no];wbSave(o);}

function splitOpt(o){const m=o.match(/^(.*?)([一-鿿].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const stars=n=>[0,1,2].map(i=>i<(n||0)?'★':'<span class="dim">☆</span>').join('');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== 設定狀態 ===== */
let cfg={subj:'en',cert:'all',type:'all',year:'all',num:20,time:0};
function curBank(){return cfg.subj==='gh'?GHBANK:BANK;}
function isGh(){return cfg.subj==='gh';}
function ansOk(q,p){return q.sungei?true:(p===q.ans);}   // 送分題一律算對
function optInner(o){return isGh()?o:splitOpt(o);}       // 觀光:純中文不切英/中
function qChips(q){
  if(isGh())return '<span class="chip c-r">觀光資源概要</span>';
  const cls=q.type==='字彙'?'c-v':q.type==='對話'?'c-d':'c-r';
  return `<span class="chip ${cls}">${q.type}</span><span class="chip c-t">${q.topic}</span>`;
}
function starsHtml(q){return isGh()?'':`<span class="stars">${stars(q.star)}</span>`;}
function revealHtml(q){
  if(isGh())return q.sungei?`<div class="lbl" style="color:var(--ok)">✓ 送分題</div><div class="zh">${q.note||'此題經評量單位公告一律給分'}</div>`:'';
  return `<div class="lbl">整句中譯</div><div class="zh">${q.zh}</div>
        <div class="lbl">解析</div><div class="ana">${q.ana}</div>
        ${q.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${q.skill}</div>`:''}
        ${q.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${q.note}</div>`:''}
        ${q.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${q.gram}</div>`:''}
        <a class="revlink" href="${q.y}_${q.c==='guide'?'導遊':'領隊'}英語_詳解.html#q${q.no}">🔍 看原題詳解</a>`;
}
function optMark(q,i,p){
  if(q.sungei)return p===i?['ok','✓']:['',''];   // 送分:選了的標對,其餘不標
  if(i===q.ans)return['ok','✓'];
  if(p===i)return['no','✗'];
  return['',''];
}
function mkChips(id,items,key){
  document.getElementById(id).innerHTML=items.map(it=>
    `<span class="chip2 ${cfg[key]===it.v?'on':''}" data-v="${it.v}">${it.t}</span>`).join('');
  document.getElementById(id).onclick=e=>{const c=e.target.closest('[data-v]');if(!c)return;
    let v=c.dataset.v; if(key==='num'||key==='time')v=+v; cfg[key]=v;
    document.getElementById(id).querySelectorAll('.chip2').forEach(x=>x.classList.toggle('on',x===c));
    if(key==='subj')syncSubjectUI();
    updAvail();};
}
function syncSubjectUI(){
  const gh=isGh();
  document.getElementById('rowType').classList.toggle('hidden',gh);
  document.getElementById('setupFoot').textContent=gh
    ? '觀光資源概要 · 臺灣歷史/地理/觀光資源維護 · 官方標準答案(含送分題)'
    : '字彙 · 對話 · 文法題(閱讀題需搭配文章,請至各年詳解練習)';
  const YEARS=[...new Set(curBank().map(q=>q.y))].sort();
  if(cfg.year!=='all'&&!YEARS.includes(cfg.year))cfg.year='all';
  mkChips('sYear',[{v:'all',t:'全部'}].concat(YEARS.map(y=>({v:y,t:y+'年'}))),'year');
}
function buildSetup(){
  mkChips('sSubj',[{v:'en',t:'外語英語'},{v:'gh',t:'觀光資源概要'}],'subj');
  mkChips('sCert',[{v:'all',t:'全部'},{v:'leader',t:'領隊'},{v:'guide',t:'導遊'}],'cert');
  mkChips('sType',[{v:'all',t:'全部'},{v:'字彙',t:'字彙'},{v:'對話',t:'對話'},{v:'文法',t:'文法'}],'type');
  mkChips('sNum',[{v:10,t:'10 題'},{v:20,t:'20 題'},{v:30,t:'30 題'},{v:50,t:'50 題'}],'num');
  mkChips('sTime',[{v:0,t:'不限時'},{v:15,t:'15 分'},{v:25,t:'25 分'},{v:40,t:'40 分'}],'time');
  syncSubjectUI();
  updAvail();
}
function pool(){
  if(isGh())return GHBANK.filter(q=>(cfg.cert==='all'||q.c===cfg.cert)&&(cfg.year==='all'||q.y===cfg.year));
  return BANK.filter(q=>(cfg.cert==='all'||q.c===cfg.cert)&&(cfg.type==='all'||q.type===cfg.type)&&(cfg.year==='all'||q.y===cfg.year));
}
function updAvail(){const n=pool().length;document.getElementById('avail').textContent='符合條件題數:'+n+' 題,將隨機抽 '+Math.min(cfg.num,n)+' 題';}

/* ===== 作答 ===== */
let paper=[],picks={},timerId=null,remain=0;
function startQuiz(){
  const qz=document.getElementById('quiz');qz.removeAttribute('data-done');qz.removeAttribute('data-forced');
  const p=shuffle(pool().slice());
  if(!p.length){alert('這個條件下沒有題目,換個條件試試');return;}
  paper=p.slice(0,Math.min(cfg.num,p.length)); picks={};
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderPaper(); updProg(); window.scrollTo(0,0);
  if(cfg.time>0){remain=cfg.time*60;startTimer();}else{document.getElementById('timer').classList.add('hidden');}
}
function renderPaper(){
  document.getElementById('qlist').innerHTML=paper.map((q,qi)=>{
    const stem=q.stem.replace('__BLANK__','<span class="blank"></span>');
    return `<div class="card" id="qc${qi}" data-qi="${qi}">
      <div class="qhead"><span class="qno">第 ${qi+1} 題</span>
        ${qChips(q)}
        <span class="src ${q.c}">${CNAME[q.c]}${q.y}-${q.no}</span>
        ${starsHtml(q)}</div>
      <div class="stem">${stem}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-qi="${qi}" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${optInner(o)}</span><span class="mk"></span></button>`).join('')}</div>
      <div class="reveal">${revealHtml(q)}</div></div>`;
  }).join('');
  document.getElementById('qlist').onclick=e=>{const b=e.target.closest('.opt');if(!b||document.getElementById('quiz').dataset.done)return;
    const qi=+b.dataset.qi,i=+b.dataset.i; picks[qi]=i;
    document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(x=>x.classList.toggle('sel',x===b));
    updProg();};
}
function updProg(){const done=Object.keys(picks).length;document.getElementById('prog').innerHTML=`已答 <b>${done}</b> / ${paper.length}`;}
function startTimer(){const t=document.getElementById('timer');t.classList.remove('hidden');
  function tick(){const m=Math.floor(remain/60),s=remain%60;t.textContent='⏱ '+m+':'+(s<10?'0':'')+s;t.classList.toggle('warn',remain<=60);
    if(remain<=0){clearInterval(timerId);submit(true);return;}remain--;}
  tick();timerId=setInterval(tick,1000);}

/* ===== 交卷 ===== */
let submitArm=false;
function submit(forced){
  const un=paper.length-Object.keys(picks).length;
  if(un>0 && !forced && !submitArm){
    submitArm=true;
    var b=document.getElementById('submitBtn'),b2=document.getElementById('submitBtn2');
    if(b)b.textContent='還有 '+un+' 題未答,再按交卷';
    if(b2)b2.textContent='還有 '+un+' 題未作答,再按一次交卷計分';
    setTimeout(function(){submitArm=false;if(b)b.textContent='交卷';if(b2)b2.textContent='交卷計分';},4000);
    return;
  }
  if(timerId){clearInterval(timerId);timerId=null;}
  document.getElementById('quiz').dataset.done='1';
  let correct=0,wrong=[];
  const byTopic={},byType={};
  paper.forEach((q,qi)=>{const p=picks[qi];const ok=ansOk(q,p);
    const tp=q.topic||'觀光資源概要',ty=q.type||'觀光資源概要';
    (byTopic[tp]=byTopic[tp]||{ok:0,n:0}).n++;if(ok)byTopic[tp].ok++;
    (byType[ty]=byType[ty]||{ok:0,n:0}).n++;if(ok)byType[ty].ok++;
    if(ok)correct++;else{wrong.push(qi);if(p!=null&&!isGh())wbAdd(q,p);}  // 英語:有作答且答錯 → 進錯題本
  });
  try{let hist=JSON.parse(localStorage.getItem('quiz_history')||'[]');
    hist.push({ts:Date.now(),cert:cfg.cert,qtype:cfg.type,year:cfg.year,correct:correct,total:paper.length,byTopic:byTopic,byType:byType});
    if(hist.length>300)hist=hist.slice(-300);
    localStorage.setItem('quiz_history',JSON.stringify(hist));}catch(e){}
  showResult(correct,wrong);
}
function showResult(correct,wrong){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const n=paper.length,pct=Math.round(correct/n*100);
  document.getElementById('scNum').textContent=correct+' / '+n;
  document.getElementById('scSub').textContent='答對率 '+pct+'%　'+(pct>=80?'🎉 很棒!':pct>=60?'👍 再加強':'💪 多練幾組');
  const wbn=wrong.filter(qi=>picks[qi]!=null).length;
  document.getElementById('scWb').textContent=wbn?(isGh()?('答錯 '+wbn+' 題,可於下方檢討'):('答錯 '+wbn+' 題已收入錯題本,可到錯題本複習')):'';
  renderResult('all',wrong);
  window.scrollTo(0,0);
}
function renderResult(mode,wrong){
  const list=paper.map((q,qi)=>({q,qi})).filter(({q,qi})=>mode==='wrong'?!ansOk(q,picks[qi]):true);
  document.getElementById('rlist').innerHTML=list.map(({q,qi})=>{
    const stem=q.stem.replace('__BLANK__','<span class="blank"></span>');
    const p=picks[qi];
    return `<div class="card done">
      <div class="qhead"><span class="qno">第 ${qi+1} 題</span>
        ${qChips(q)}
        <span class="src ${q.c}">${CNAME[q.c]}${q.y}-${q.no}</span>
        ${starsHtml(q)}</div>
      <div class="stem">${stem}</div>
      <div class="opts">${q.opts.map((o,i)=>{const[c,mk]=optMark(q,i,p);
        return `<button class="opt ${c}" disabled><span class="lab">${LAB[i]}</span><span>${optInner(o)}</span><span class="mk">${mk}</span></button>`;}).join('')}</div>
      <div class="reveal">
        ${p==null?'<div class="lbl" style="color:var(--no)">⚠️ 這題未作答</div>':''}
        ${revealHtml(q)}
      </div></div>`;
  }).join('')||'<p style="text-align:center;color:var(--sub);padding:30px">🎉 這組全對,沒有答錯的題!</p>';
}

/* ===== 事件 ===== */
document.getElementById('startBtn').onclick=startQuiz;
document.getElementById('submitBtn').onclick=()=>submit();
document.getElementById('submitBtn2').onclick=()=>submit();
document.getElementById('againBtn').onclick=()=>{document.getElementById('quiz').removeAttribute('data-done');document.getElementById('result').classList.add('hidden');document.getElementById('setup').classList.remove('hidden');window.scrollTo(0,0);updAvail();};
let curWrong=[];
document.getElementById('reviewWrong').onclick=()=>{renderResult('wrong');};
document.getElementById('reviewAll').onclick=()=>{renderResult('all');};

buildSetup();
</script>
