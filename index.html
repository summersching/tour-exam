<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script src="lock_config.js"></script>
<script src="lock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151613" media="(prefers-color-scheme: dark)">
<title>我的基地</title>
<!-- 我的基地(總入口頁)· v302(2026-11-19)
     全站最上層的入口:依類別(學習、工具…)放功能卡,一個功能一張卡、各有自己的顏色;點進去才是各功能自己的首頁
     (例如「領隊·導遊 考照中心」= 考照中心.html)。圖示畫在 icons.js,考試日期與提醒來自 examdates.js。
     要加新功能:在下面的 LINKS 陣列加一筆 { icon, color, name, desc, href };{ sec:'標題' } 是分類標題。
       icon  icons.js 的圖示名稱;color 是 ui.css 的分類色 teal / purple / coral / amber / gray
       desc  文字,或回傳文字陣列的函式(每個元素一行,顯示即時狀態)
     標題改 HUB 這個物件就好。
     變更履歷:v302 改名「我的基地」;暖米色 + 每個功能自己的顏色;拿掉考照的 4 格捷徑(首頁只放功能入口);
               考照卡顯示下一個考試日程(examdates.js)與今天還剩幾題
               v300 淺色、一張主卡加四格捷徑、線條圖示;拿掉「新功能準備中」空卡片
               v254 初版(原本的 index.html 改名為 考照中心.html) -->
<style>
  :root{--bg:#f6f3ec;--card:#fff;--ink:#2b2a27;--sub:#68645b;--line:#e8e3d8}
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
  .hub{max-width:560px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  .date{margin:0;font-size:.86rem;color:var(--sub)}
  h1{margin:2px 0 6px;font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.3}
  .sec{margin:22px 2px 10px;font-size:.8rem;font-weight:800;color:var(--sub);letter-spacing:.06em}
  .mods{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:520px){.mods{grid-template-columns:1fr 1fr}.mods .lk.wide{grid-column:1/-1}}
  .lk{display:flex;align-items:center;gap:13px;background:var(--cb);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);
    transition:transform .15s}
  a.lk:active{transform:scale(.99)}
  a.lk:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .lk .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--c);color:var(--cb);display:flex;align-items:center;justify-content:center}
  .lk .ic svg{width:27px;height:27px}
  .lk .tx{flex:1;min-width:0}
  .lk .nm{display:block;font-weight:800;font-size:1.08rem;line-height:1.35}
  .lk .ds{display:block;font-size:.84rem;color:var(--c);font-weight:700;margin-top:3px;line-height:1.45}
  .lk .ds+.ds{color:var(--sub);font-weight:600;margin-top:0}
  .lk .go{flex:none;color:var(--c);display:flex}
  .lk .go svg{width:22px;height:22px}
  .later{margin:14px 2px 0;font-size:.8rem;color:var(--sub)}
  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:.8rem}
  #lockNow{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--sub);font:inherit;font-weight:700;cursor:pointer;padding:6px 2px}
  #lockNow[hidden]{display:none}
  #lockNow svg{width:16px;height:16px}
  #lockNow:hover,#lockNow:focus-visible{color:var(--ink)}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="prefs.js"></script>
<script src="icons.js"></script>
<script src="examdates.js"></script>
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<main class="hub">
  <p class="date" id="hubDate"></p>
  <h1 id="hubName"></h1>
  <nav id="links" aria-label="功能入口"></nav>
  <p class="later">之後的新功能會依類別加在這裡</p>
  <footer>
    <span>離線可用 · 免費 · 無廣告 · 不需註冊</span>
    <button id="lockNow" type="button" hidden></button>
  </footer>
</main>
<script>
'use strict';
const IC = (n) => (window.ICONS ? ICONS.svg(n) : '');
function LSg(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* 今天已練幾題:算法和考照中心的「今日已練」相同(模擬測驗紀錄 quiz_history + 是非快問等的 practice_daily) */
function todayDone(){
  const k=dkey(new Date()); let n=0;
  try{JSON.parse(LSg('quiz_history')||'[]').forEach(x=>{if(x&&x.ts&&dkey(new Date(x.ts))===k)n+=(+x.total||0);});}catch(e){}
  try{n+=(+(JSON.parse(LSg('practice_daily')||'{}')[k])||0);}catch(e){}
  return n;
}
/* 考照卡的即時狀態:第一行是下一個考試日程(examdates.js),第二行是今天還剩幾題(每日目標沒設定時是 30 題) */
function examStatus(){
  const goal=Math.max(1,+(LSg('daily_goal')||30)), left=Math.max(0,goal-todayDone());
  const t=left?`今天還有 ${left} 題`:`今天的 ${goal} 題已完成`;
  return window.EXAMDATES?[EXAMDATES.line(new Date()),t]:[t];
}
/* ==== 我的基地設定:改這兩個就好 ==== */
const HUB = { name: '我的基地' };
const LINKS = [
  { sec: '學習' },
  { icon: 'school', color: 'teal', name: '領隊·導遊 考照中心', desc: examStatus, href: '考照中心.html', wide: true }
];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const D=new Date();
document.getElementById('hubDate').textContent=`${D.getMonth()+1} 月 ${D.getDate()} 日 週${'日一二三四五六'[D.getDay()]}`;
document.getElementById('hubName').textContent=HUB.name;
/* 分類標題後面的功能卡放進同一個 .mods 格線 */
let html='',open=false;
LINKS.forEach(l=>{
  if(l.sec){if(open)html+='</div>';html+=`<div class="sec">${esc(l.sec)}</div><div class="mods">`;open=true;return;}
  if(!open){html+='<div class="mods">';open=true;}
  let ds=[];try{ds=typeof l.desc==='function'?l.desc():[].concat(l.desc||[]);}catch(e){ds=[];}
  const c=/^(teal|purple|coral|amber|gray)$/.test(l.color||'')?l.color:'teal';
  html+=`<a class="lk${l.wide?' wide':''}" href="${esc(l.href)}" style="--c:var(--k-${c});--cb:var(--k-${c}-bg)"><span class="ic">${IC(l.icon)}</span><span class="tx"><span class="nm">${esc(l.name)}</span>${ds.map(x=>`<span class="ds">${esc(x)}</span>`).join('')}</span><span class="go">${IC('chevron')}</span></a>`;
});
if(open)html+='</div>';
document.getElementById('links').innerHTML=html;
/* 有設定進入密碼時才顯示「上鎖」(清除這台裝置的記住狀態) */
(function(){const b=document.getElementById('lockNow');if(b&&window.APPLOCK&&APPLOCK.enabled()){b.innerHTML=IC('lock')+'<span>上鎖</span>';b.hidden=false;b.onclick=()=>APPLOCK.lock();}})();
</script>
</body>
</html>
