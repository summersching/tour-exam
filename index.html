<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>領隊·導遊 考照中心</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2330; --sub:#5a6b82; --line:#e2e8f2;
    --accent:#2563eb; --accent2:#1e3a8a; --teal:#0d9488; --tealbg:#e7f6f4;
    --gold:#8a6d1a; --goldbg:#fff4cc; --grey:#94a3b8;
    --newbg:#e5f6ec; --newk:#15904a; --oldbg:#eef1f5; --oldk:#55647a;
    --shadow:0 2px 10px rgba(0,0,0,.06); --shadow2:0 4px 18px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12161c; --card:#1b2029; --ink:#e8edf5; --sub:#9aa8bd; --line:#2b333f;
      --accent:#5b8cff; --accent2:#31488f; --teal:#5eead4; --tealbg:#123230;
      --gold:#f2d778; --goldbg:#3d3413; --grey:#5a6577;
      --newbg:#173023; --newk:#5ad48a; --oldbg:#242b36; --oldk:#9fb0c6;
      --shadow:0 2px 10px rgba(0,0,0,.3); --shadow2:0 4px 18px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    line-height:1.6;padding:0 0 40px;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;
    padding:calc(22px + env(safe-area-inset-top)) 20px 20px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
  header h1{margin:0 0 4px;font-size:1.32rem;letter-spacing:.02em}
  header p{margin:0;opacity:.9;font-size:.82rem}
  .free{display:inline-flex;gap:5px;align-items:center;margin-top:10px;
    background:rgba(255,255,255,.16);padding:4px 11px;border-radius:20px;font-size:.74rem}

  /* 分類 / 科目 導覽 */
  .nav{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);
    box-shadow:var(--shadow)}
  .seg{display:flex;gap:8px;padding:10px 0 4px}
  .seg button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    padding:9px 8px;border-radius:12px;cursor:pointer;font-size:.92rem;font-weight:700;
    font-family:inherit;display:flex;gap:6px;align-items:center;justify-content:center;transition:.15s}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg button:disabled{color:var(--grey);cursor:not-allowed;background:var(--bg)}
  .seg .soon{font-size:.64rem;background:var(--grey);color:#fff;border-radius:10px;padding:1px 6px}
  .subs{display:flex;gap:8px;padding:2px 0 10px;flex-wrap:wrap}
  .subs button{border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:5px 14px;border-radius:18px;cursor:pointer;font-size:.82rem;font-family:inherit;transition:.15s}
  .subs button.on{background:var(--tealbg);color:var(--teal);border-color:var(--teal);font-weight:700}
  .subs button:disabled{color:var(--grey);cursor:not-allowed}

  .sect{margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
  .sect h2{margin:0;font-size:1.02rem}
  .sect .n{font-size:.76rem;color:var(--sub)}

  /* 年份卡 */
  .years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .yc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
    cursor:pointer;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;overflow:hidden}
  .yc:hover,.yc:active{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--accent)}
  .yc .yr{font-size:1.7rem;font-weight:800;color:var(--accent);line-height:1.1}
  .yc .yr small{font-size:.8rem;font-weight:700;color:var(--sub);margin-left:2px}
  .yc .sy{font-size:.82rem;color:var(--sub);margin:3px 0 9px}
  .yc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:12px}
  .b-new{background:var(--newbg);color:var(--newk)} .b-old{background:var(--oldbg);color:var(--oldk)}
  .code{font-size:.68rem;color:var(--sub)}
  .yc .done{position:absolute;top:10px;right:11px;font-size:.7rem;color:var(--teal);font-weight:700}

  /* 工具卡 */
  .tools{display:grid;grid-template-columns:1fr;gap:11px}
  @media(min-width:560px){.tools{grid-template-columns:1fr 1fr}}
  .tc{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;cursor:pointer;text-decoration:none;color:inherit;
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
  .tc:hover,.tc:active{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--teal)}
  .tc.dis{cursor:default;opacity:.6}
  .tc.dis:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
  .tc .ic{font-size:1.9rem;flex-shrink:0}
  .tc .tt{font-size:1.02rem;font-weight:700}
  .tc .dd{font-size:.76rem;color:var(--sub);margin-top:1px}
  .tc .soon{font-size:.64rem;background:var(--gold);color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:700}

  footer{text-align:center;color:var(--sub);font-size:.74rem;margin-top:26px;line-height:1.8}
  footer b{color:var(--teal)}
  .subjbar{margin:14px 0 4px}
  .wchips{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
  .wchip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:8px 14px;text-decoration:none;color:inherit;font-size:.88rem;font-weight:700;
    box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  .wchip:hover,.wchip:active{border-color:var(--teal);transform:translateY(-1px)}
  .wchip .wn{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:.72rem}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🧭 領隊·導遊 考照中心</h1>
    <p>英語 · 觀光 · 執業實務 · 執業法規 — 四科題庫 + 詳解 + 模擬測驗</p>
    <span class="free">🔒 100% 離線免費 · 無需連網</span>
  </div>
</header>

<div class="wrap" id="main"></div>

<footer>
  全部功能離線可用,免費、無廣告、不需註冊<br>
  四科 · <b>10 屆完整詳解 + 模擬測驗 + 錯題本</b>
</footer>

<script>
/* ==== 首頁 = 學習工具啟動頁(科目篩選 + 分區塊)==== */
const SUBJFILTERS=[['all','全部'],['en','英語'],['gh','觀光'],['pr','執業實務'],['pr2','執業法規']];
const CATS=[['do','🎯 做題'],['review','📖 複習 · 衝刺'],['wrong','📌 錯題本'],['tool','⚙️ 紀錄 · 工具']];
const TOOLS = [
  { id:'past',  name:'歷屆試題', icon:'📚', desc:'四科 10 屆 · 逐題官方答案 + 詳解', file:'歷屆試題.html', cat:'do', subj:'all' },
  { id:'quiz',  name:'模擬測驗', icon:'📝', desc:'四科隨機組卷 · 計分 · 限時', file:'模擬測驗.html', cat:'do', subj:'all' },
  { id:'wb',    name:'學習中心', icon:'📖', desc:'英語單字 · 文法 · 技巧 · 陷阱', file:'學習中心.html', cat:'review', subj:['en'] },
  { id:'sprint',name:'考前衝刺', icon:'🔥', desc:'英語高頻必背 · 片語 · 易混字', file:'考前衝刺.html', cat:'review', subj:['en'] },
  { id:'oral',  name:'口試練習', icon:'🎤', desc:'英語帶團實用句 · 跟讀', file:'口試練習.html', cat:'review', subj:['en'] },
  { id:'lawref',name:'法規速查', icon:'⚡', desc:'違約金公式 · 級距 · 期限 · 罰鍰', file:'法規速查.html', cat:'review', subj:['pr2','pr'] },
  { id:'sprintcn',name:'考點速記', icon:'🗂️', desc:'觀光 · 執業實務 高頻考點速背', file:'考點速記.html', cat:'review', subj:['gh','pr'] },
  { id:'dash',  name:'學習儀表板', icon:'📊', desc:'成績趨勢 · 弱點分析 · 及格率', file:'儀表板.html', cat:'tool', subj:'all' },
  { id:'backup',name:'資料備份', icon:'💾', desc:'錯題/成績 匯出還原 · 換手機不怕沒', file:'資料備份.html', cat:'tool', subj:'all' },
  { id:'wrong', name:'英語', icon:'📌', file:'錯題本.html', cat:'wrong', subj:['en'], wb:'wrongbook_en' },
  { id:'wronggh', name:'觀光', icon:'🛡', file:'觀光錯題本.html', cat:'wrong', subj:['gh'], wb:'wrongbook_gh' },
  { id:'wrongpr', name:'執業實務', icon:'📋', file:'執業實務錯題本.html', cat:'wrong', subj:['pr'], wb:'wrongbook_pr' },
  { id:'wrongpr2', name:'執業法規', icon:'⚖️', file:'執業法規錯題本.html', cat:'wrong', subj:['pr2'], wb:'wrongbook_pr2' }
];

let FILTER='all';
try{const s=localStorage.getItem('pref_subj'); if(s&&SUBJFILTERS.some(x=>x[0]===s))FILTER=s;}catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function wbCount(k){try{return Object.keys(JSON.parse(localStorage.getItem(k)||'{}')).length;}catch(e){return 0;}}
function match(t){return FILTER==='all'||t.subj==='all'||(Array.isArray(t.subj)&&t.subj.indexOf(FILTER)>=0);}
function toolCard(t){return `<a class="tc" href="${esc(t.file)}"><div class="ic">${t.icon}</div>
    <div><div class="tt">${esc(t.name)}</div>${t.desc?`<div class="dd">${esc(t.desc)}</div>`:''}</div></a>`;}
function wchip(t){const n=t.wb?wbCount(t.wb):0;return `<a class="wchip" href="${esc(t.file)}">${t.icon} ${esc(t.name)}${n?`<span class="wn">${n}</span>`:''}</a>`;}

function render(){
  let html=`<div class="subs subjbar">`+SUBJFILTERS.map(([k,n])=>
    `<button class="${k===FILTER?'on':''}" data-f="${k}">${n}</button>`).join('')+`</div>`;
  CATS.forEach(([cat,label])=>{
    const items=TOOLS.filter(t=>t.cat===cat&&match(t));
    if(!items.length)return;
    html+=`<div class="sect"><h2>${label}</h2></div>`;
    html+= cat==='wrong'
      ? `<div class="wchips">${items.map(wchip).join('')}</div>`
      : `<div class="tools">${items.map(toolCard).join('')}</div>`;
  });
  document.getElementById('main').innerHTML=html;
}

document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('.subjbar button'); if(!b)return;
  FILTER=b.dataset.f; try{localStorage.setItem('pref_subj',FILTER);}catch(e){}
  render(); window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
