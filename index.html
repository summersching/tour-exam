<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script src="lock_config.js"></script>
<script src="lock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>我的工作站</title>
<!-- 工作站首頁 · v254(2026-11-12)
     全站最上層的入口頁:一列一個功能,點進去才是各功能自己的首頁(例如「領隊·導遊 考照中心」= 考照中心.html)。
     要加新功能:在下面的 LINKS 陣列加一筆 { icon, bg, name, desc, href }(href 指到該功能的頁面);
     { sec:'標題' } 是分區小標;soon:true 是「準備中」(不能點);subs 是這一列下方的捷徑小按鈕。
     名稱、標語、頭像(emoji)改 HUB 這個物件就好。
     變更履歷:v254 初版(原本的 index.html 改名為 考照中心.html) -->
<style>
  :root{--bg:#0b0b0f;--card:#1b1b22;--card2:#26262f;--ink:#f5f5f7;--sub:#a1a1aa;--line:#2c2c36;--chip:#26262f}
  :root[data-theme="light"]{--bg:#f4f6f9;--card:#fff;--card2:#eef2f7;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--chip:#eef2f7}
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
  .hub{max-width:520px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 16px 44px;text-align:center}
  .av{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:3rem;
    background:linear-gradient(135deg,#facc15,#f97316);box-shadow:0 10px 34px rgba(250,204,21,.22)}
  h1{margin:0 0 6px;font-size:1.5rem;font-weight:900;letter-spacing:.02em}
  .tag{margin:0 0 20px;color:var(--sub);font-size:.9rem}
  .sec{margin:22px 4px 6px;font-size:.76rem;font-weight:800;color:var(--sub);letter-spacing:.1em;text-align:left}
  .lk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;margin:10px 0 0;
    text-decoration:none;color:var(--ink);text-align:left;transition:background .15s,transform .15s}
  a.lk:hover,a.lk:active{background:var(--card2);transform:translateY(-1px)}
  .lk .ic{flex:0 0 auto;width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.7rem}
  .lk .tx{flex:1;min-width:0}
  .lk .nm{display:block;font-weight:800;font-size:1.04rem}
  .lk .ds{display:block;font-size:.76rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lk .go{flex:0 0 auto;color:var(--sub);font-size:1.4rem;line-height:1}
  .lk.soon{border-style:dashed;opacity:.7}
  .subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 0} .subs::-webkit-scrollbar{display:none}
  .subs a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
  .subs a:hover,.subs a:active{border-color:var(--sub)}
  footer{margin-top:30px;color:var(--sub);font-size:.74rem;line-height:1.8}
  #lockNow{margin-top:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="prefs.js"></script>
<script src="pwa.js" defer></script>
</head>
<body>
<main class="hub">
  <div class="av" id="hubAv" aria-hidden="true"></div>
  <h1 id="hubName"></h1>
  <p class="tag" id="hubTag"></p>
  <nav id="links" aria-label="功能入口"></nav>
  <footer>
    全部功能離線可用,免費、無廣告、不需註冊
    <div><button id="lockNow" type="button" hidden>🔒 立即上鎖</button></div>
  </footer>
</main>
<script>
'use strict';
/* ==== 工作站設定:改這兩個就好 ==== */
const HUB = { av: '🧭', name: '我的工作站', tag: '學習 · 工具 · 資料,都從這裡進去' };
const LINKS = [
  { sec: '學習' },
  { icon: '🎓', bg: 'linear-gradient(135deg,#1e3a8a,#2563eb)', name: '領隊·導遊 考照中心', desc: '歷屆試題 · 模擬測驗 · 講義 · 錯題本 · 學習計畫', href: '考照中心.html',
    subs: [['📅 學習計畫', '學習計畫.html'], ['📘 講義', '講義.html'], ['📝 模擬測驗', '模擬測驗.html'], ['📌 錯題本', '錯題本.html']] },
  { sec: '其他功能' },
  { icon: '➕', bg: 'linear-gradient(135deg,#3f3f46,#52525b)', name: '新功能準備中', desc: '之後的功能會加在這裡', soon: true }
];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('hubAv').textContent = HUB.av;
document.getElementById('hubName').textContent = HUB.name;
document.getElementById('hubTag').textContent = HUB.tag;
document.getElementById('links').innerHTML = LINKS.map(l=>{
  if (l.sec) return `<div class="sec">${esc(l.sec)}</div>`;
  const inner = `<span class="ic" style="background:${esc(l.bg||'var(--card2)')}">${esc(l.icon)}</span><span class="tx"><span class="nm">${esc(l.name)}</span><span class="ds">${esc(l.desc||'')}</span></span>${l.soon?'':'<span class="go" aria-hidden="true">›</span>'}`;
  const row = l.soon ? `<div class="lk soon" aria-disabled="true">${inner}</div>` : `<a class="lk" href="${esc(l.href)}">${inner}</a>`;
  return row + (l.subs && !l.soon ? `<div class="subs">${l.subs.map(([n,h])=>`<a href="${esc(h)}">${esc(n)}</a>`).join('')}</div>` : '');
}).join('');
/* 有設定進入密碼時才顯示「立即上鎖」(清除這台裝置的記住狀態) */
(function(){const b=document.getElementById('lockNow');if(b&&window.APPLOCK&&APPLOCK.enabled()){b.hidden=false;b.onclick=()=>APPLOCK.lock();}})();
</script>
</body>
</html>
