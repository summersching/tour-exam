<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>領隊·導遊 考照中心</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1c2330; --sub:#5a6b82; --line:#e2e8f2;
    --accent:#2563eb; --accent2:#1e3a8a; --teal:#0d9488; --tealbg:#e7f6f4;
    --gold:#8a6d1a; --goldbg:#fff4cc; --grey:#94a3b8;
    --newbg:#e5f6ec; --newk:#15904a; --oldbg:#eef1f5; --oldk:#55647a;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05); --shadow2:0 8px 26px rgba(16,24,40,.13);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --bg:#12161c; --card:#1b2029; --ink:#e8edf5; --sub:#9aa8bd; --line:#2b333f;
      --accent:#5b8cff; --accent2:#31488f; --teal:#5eead4; --tealbg:#123230;
      --gold:#f2d778; --goldbg:#3d3413; --grey:#5a6577;
      --newbg:#173023; --newk:#5ad48a; --oldbg:#242b36; --oldk:#9fb0c6;
      --shadow:0 2px 10px rgba(0,0,0,.3); --shadow2:0 4px 18px rgba(0,0,0,.45);
    }}
  :root[data-theme="dark"]{
      --bg:#12161c; --card:#1b2029; --ink:#e8edf5; --sub:#9aa8bd; --line:#2b333f;
      --accent:#5b8cff; --accent2:#31488f; --teal:#5eead4; --tealbg:#123230;
      --gold:#f2d778; --goldbg:#3d3413; --grey:#5a6577;
      --newbg:#173023; --newk:#5ad48a; --oldbg:#242b36; --oldk:#9fb0c6;
      --shadow:0 2px 10px rgba(0,0,0,.3); --shadow2:0 4px 18px rgba(0,0,0,.45);
    }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    line-height:1.6;padding:0 0 40px;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;
    padding:calc(22px + env(safe-area-inset-top)) 20px 20px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
  header h1{margin:0 0 5px;font-size:1.44rem;font-weight:800;letter-spacing:-.01em}
  header p{margin:0;opacity:.92;font-size:.84rem;line-height:1.5}
  .free{display:inline-flex;gap:5px;align-items:center;margin-top:11px;
    background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:.74rem;font-weight:600}

  /* 分類 / 科目 導覽 */
  .nav{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);
    box-shadow:var(--shadow)}
  .seg{display:flex;gap:8px;padding:10px 0 4px}
  .seg button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    padding:9px 8px;border-radius:12px;cursor:pointer;font-size:.92rem;font-weight:700;
    font-family:inherit;display:flex;gap:6px;align-items:center;justify-content:center;transition:.15s}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg button:disabled{color:var(--grey);cursor:not-allowed;background:var(--bg)}
  .seg .soon{font-size:.64rem;background:var(--grey);color:#fff;border-radius:10px;padding:1px 6px}
  .subs{display:flex;gap:7px;padding:2px 0 10px;flex-wrap:wrap}
  .subs button{border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:6px 15px;border-radius:999px;cursor:pointer;font-size:.83rem;font-weight:600;font-family:inherit;transition:.15s}
  .subs button:hover{border-color:var(--sub);color:var(--ink)}
  .subs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .subs button:disabled{color:var(--grey);cursor:not-allowed}

  .sect{margin:26px 0 11px;display:flex;align-items:center;gap:9px}
  .sect h2{margin:0;font-size:1.1rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .sect h2::before{content:"";width:4px;height:17px;border-radius:3px;background:var(--accent)}
  .sect .n{font-size:.76rem;color:var(--sub)}

  /* 年份卡 */
  .years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .yc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
    cursor:pointer;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;overflow:hidden}
  .yc:hover,.yc:active{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--accent)}
  .yc .yr{font-size:1.7rem;font-weight:800;color:var(--accent);line-height:1.1}
  .yc .yr small{font-size:.8rem;font-weight:700;color:var(--sub);margin-left:2px}
  .yc .sy{font-size:.82rem;color:var(--sub);margin:3px 0 9px}
  .yc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:12px}
  .b-new{background:var(--newbg);color:var(--newk)} .b-old{background:var(--oldbg);color:var(--oldk)}
  .code{font-size:.68rem;color:var(--sub)}
  .yc .done{position:absolute;top:10px;right:11px;font-size:.7rem;color:var(--teal);font-weight:700}

  /* 工具卡 */
  .tools{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){.tools{grid-template-columns:1fr 1fr}}
  .tc{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;cursor:pointer;text-decoration:none;color:inherit;
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
  .tc:hover,.tc:active{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--accent)}
  .tc.dis{cursor:default;opacity:.6}
  .tc.dis:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
  .tc .ic{font-size:1.6rem;flex-shrink:0;width:46px;height:46px;border-radius:12px;
    background:var(--bg);display:flex;align-items:center;justify-content:center}
  .tc .tt{font-size:1.06rem;font-weight:800;letter-spacing:-.01em}
  .tc .dd{font-size:.78rem;color:var(--sub);margin-top:2px;line-height:1.45}
  .tc .soon{font-size:.64rem;background:var(--gold);color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:700}

  footer{text-align:center;color:var(--sub);font-size:.74rem;margin-top:26px;line-height:1.8}
  footer b{color:var(--teal)}
  .subjbar{margin:14px 0 4px}
  .wchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px;margin-top:2px}
  .wchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 8px;
    text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .12s,border-color .12s,box-shadow .12s}
  .wchip:hover,.wchip:active{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow2)}
  .wchip .wic{width:44px;height:44px;border-radius:13px;background:var(--bg);display:flex;
    align-items:center;justify-content:center;font-size:1.45rem}
  .wchip .wtxt{font-size:.86rem;font-weight:700;text-align:center;line-height:1.25}
  .wchip .wn{position:absolute;top:8px;right:8px;min-width:18px;text-align:center;background:var(--accent);color:#fff;
    border-radius:999px;padding:1px 6px;font-size:.7rem;font-weight:700;font-variant-numeric:tabular-nums}
  /* 展示型數字用等寬,對齊更穩 */
  .scard .dd,.rcard .due,.rcard .rchip .b,.scard .gpct,.scard .streak{font-variant-numeric:tabular-nums}
  /* C1 考試倒數 + C6 每日打卡 */
  #studyCard{margin-top:16px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
  .scard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .scard .dd{font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1}
  .scard .dd small{font-size:.8rem;font-weight:700;color:var(--sub);margin-left:3px}
  .scard .exdate{font-size:.76rem;color:var(--sub)}
  .scard .streak{margin-left:auto;font-size:.9rem;font-weight:800;color:var(--gold);background:var(--goldbg);
    border-radius:20px;padding:4px 12px;white-space:nowrap}
  .scard .goalrow{display:flex;align-items:center;gap:10px;margin-top:12px}
  .scard .glabel{font-size:.82rem;color:var(--sub);font-weight:700;white-space:nowrap}
  .scard .gtrack{flex:1;background:var(--oldbg);border-radius:8px;height:16px;overflow:hidden;min-width:80px}
  .scard .gfill{height:100%;background:var(--teal);border-radius:8px;transition:width .4s}
  .scard .gfill.done{background:var(--newk)}
  .scard .gpct{font-size:.82rem;font-weight:700;white-space:nowrap}
  .scard .setbtn{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:10px;
    padding:6px 12px;cursor:pointer;font-size:.82rem;font-weight:700;font-family:inherit}
  .scard .setwrap{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;
    border-top:1px dashed var(--line);padding-top:12px}
  .scard .setwrap.on{display:flex}
  .scard input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;
    padding:7px 10px;font-size:.88rem;font-family:inherit}
  .scard input[type=number]{width:74px}
  .scard .save{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:7px 15px;
    cursor:pointer;font-weight:700;font-family:inherit;font-size:.86rem}
  .scard .tip{font-size:.78rem;color:var(--sub);margin-top:8px}
  .scard .empty{font-size:.95rem;font-weight:700}
  /* C2 智慧複習 */
  #reviewCard{margin-top:12px}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
  .rcard .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .rcard h3{margin:0;font-size:1.02rem}
  .rcard .due{margin-left:auto;font-size:.86rem;font-weight:800;color:var(--newk);background:var(--newbg);border-radius:20px;padding:3px 12px}
  .rcard .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .rcard .rchip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:18px;padding:7px 13px;text-decoration:none;color:inherit;font-size:.86rem;font-weight:700}
  .rcard .rchip:hover{border-color:var(--accent)}
  .rcard .rchip .b{background:var(--newk);color:#fff;border-radius:10px;padding:0 7px;font-size:.74rem}
  .rcard .rchip.z{opacity:.55} .rcard .rchip.z .b{background:var(--grey)}
  .rcard .tip{font-size:.78rem;color:var(--sub);margin-top:10px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="prefs.js"></script>
<script src="subjects.js"></script>
<script src="pwa.js" defer></script>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🧭 領隊·導遊 考照中心</h1>
    <p>英語 · 日語 · 觀光 · 執業實務 · 執業法規 — 歷屆詳解 + 模擬測驗 + 錯題本</p>
    <span class="free">🔒 100% 離線免費 · 無需連網</span>
  </div>
</header>

<div class="wrap" id="studyCard"></div>

<div class="wrap" id="reviewCard"></div>

<div class="wrap" id="main"></div>

<footer>
  全部功能離線可用,免費、無廣告、不需註冊<br>
  外語(英語/日語)+ 觀光 + 執業實務 + 執業法規 · <b>10 屆完整詳解 + 模擬測驗 + 錯題本</b>
</footer>

<script>
/* ==== 首頁 = 學習工具啟動頁(科目篩選 + 分區塊)==== */
/* 科目清單一律取自 subjects.js(SSoT);未載入時給空陣列不致崩 */
const SUBJ = window.SUBJECTS || [];
const SUBJFILTERS = [['all','全部']].concat(SUBJ.map(s=>[s.k, s.name]));
const CATS=[['do','🎯 做題'],['review','📖 複習 · 衝刺'],['wrong','📌 錯題本'],['tool','⚙️ 紀錄 · 工具']];
const TOOLS = [
  { id:'past',  name:'歷屆試題', icon:'📚', desc:'五科 10 屆 · 逐題官方答案 + 詳解', file:'歷屆試題.html', cat:'do', subj:'all' },
  { id:'quiz',  name:'模擬測驗', icon:'📝', desc:'五科隨機組卷 / 整卷模擬 · 計分 · 限時', file:'模擬測驗.html', cat:'do', subj:'all' },
  { id:'search',name:'全站搜尋', icon:'🔎', desc:'跨五科搜題幹 / 關鍵字 · 直達詳解', file:'搜尋.html', cat:'do', subj:'all' },
  { id:'wb',    name:'學習中心', icon:'📖', desc:'英語單字 · 文法 · 技巧 · 陷阱', file:'學習中心.html', cat:'review', subj:['en'] },
  { id:'sprint',name:'考前衝刺', icon:'🔥', desc:'英語高頻必背 · 片語 · 易混字', file:'考前衝刺.html', cat:'review', subj:['en'] },
  { id:'oral',  name:'口試練習', icon:'🎤', desc:'英語帶團實用句 · 跟讀', file:'口試練習.html', cat:'review', subj:['en'] },
  { id:'lawref',name:'法規速查', icon:'⚡', desc:'違約金公式 · 級距 · 期限 · 罰鍰', file:'法規速查.html', cat:'review', subj:['pr2','pr'] },
  { id:'sprintcn',name:'考點速記', icon:'🗂️', desc:'觀光 · 執業實務 高頻考點速背', file:'考點速記.html', cat:'review', subj:['gh','pr'] },
  { id:'dash',  name:'學習儀表板', icon:'📊', desc:'成績趨勢 · 弱點分析 · 及格率', file:'儀表板.html', cat:'tool', subj:'all' },
  { id:'fav',   name:'我的收藏', icon:'⭐', desc:'手動收藏的重點題 · 跨科集中複習', file:'收藏.html', cat:'tool', subj:'all' },
  { id:'backup',name:'資料備份', icon:'💾', desc:'錯題/成績 匯出還原 · 換手機不怕沒', file:'資料備份.html', cat:'tool', subj:'all' }
].concat(SUBJ.map(s=>(
  { id:'wb_'+s.k, name:s.name, icon:s.icon, file:s.page, cat:'wrong', subj:[s.k], wb:s.wb }
)));

let FILTER='all';
try{const s=localStorage.getItem('pref_subj'); if(s&&SUBJFILTERS.some(x=>x[0]===s))FILTER=s;}catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function wbCount(k){try{return Object.keys(JSON.parse(localStorage.getItem(k)||'{}')).length;}catch(e){return 0;}}
function match(t){return FILTER==='all'||t.subj==='all'||(Array.isArray(t.subj)&&t.subj.indexOf(FILTER)>=0);}
function toolCard(t){return `<a class="tc" href="${esc(t.file)}"><div class="ic">${t.icon}</div>
    <div><div class="tt">${esc(t.name)}</div>${t.desc?`<div class="dd">${esc(t.desc)}</div>`:''}</div></a>`;}
function wchip(t){const n=t.wb?wbCount(t.wb):0;return `<a class="wchip" href="${esc(t.file)}"><span class="wic">${t.icon}</span><span class="wtxt">${esc(t.name)}</span>${n?`<span class="wn">${n}</span>`:''}</a>`;}

function render(){
  let html=`<div class="subs subjbar">`+SUBJFILTERS.map(([k,n])=>
    `<button class="${k===FILTER?'on':''}" data-f="${k}">${n}</button>`).join('')+`</div>`;
  CATS.forEach(([cat,label])=>{
    const items=TOOLS.filter(t=>t.cat===cat&&match(t));
    if(!items.length)return;
    html+=`<div class="sect"><h2>${label}</h2></div>`;
    html+= cat==='wrong'
      ? `<div class="wchips">${items.map(wchip).join('')}</div>`
      : `<div class="tools">${items.map(toolCard).join('')}</div>`;
  });
  document.getElementById('main').innerHTML=html;
}

document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('.subjbar button'); if(!b)return;
  FILTER=b.dataset.f; try{localStorage.setItem('pref_subj',FILTER);}catch(e){}
  render(); window.scrollTo(0,0);
});

/* ==== C1 考試倒數 + C6 每日打卡(以模擬測驗紀錄推算)==== */
function LSg(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function LSs(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntil(s){const t=new Date();t.setHours(0,0,0,0);const e=new Date(s+'T00:00:00');return Math.round((e-t)/86400000);}
function histByDay(){let h=[];try{h=JSON.parse(LSg('quiz_history')||'[]');}catch(e){}
  const m={};h.forEach(x=>{if(!x.ts)return;m[dkey(new Date(x.ts))]=(m[dkey(new Date(x.ts))]||0)+(x.total||0);});return m;}
function streakOf(m){let s=0,d=new Date();d.setHours(0,0,0,0);
  if(!m[dkey(d)])d.setDate(d.getDate()-1);           // 今天還沒練 → 從昨天起算(寬限一天)
  while(m[dkey(d)]){s++;d.setDate(d.getDate()-1);}return s;}
function renderStudyCard(){
  const box=document.getElementById('studyCard'); if(!box)return;
  const exam=LSg('exam_date')||'';
  const goal=Math.max(1,+(LSg('daily_goal')||30));
  const m=histByDay();
  const today=m[dkey(new Date())]||0;
  const streak=streakOf(m);
  const pct=Math.min(100,Math.round(today/goal*100));
  let head;
  if(exam){
    const dleft=daysUntil(exam);
    head = dleft>=0
      ? `<span class="dd">${dleft}<small>天後考試</small></span><span class="exdate">${exam}</span>`
      : `<span class="empty">🎓 考試日(${exam})已過,祝金榜題名!可設定下次目標</span>`;
  }else{
    head = `<span class="empty">🎯 設定考試日期,顯示倒數與每日目標</span>`;
  }
  box.innerHTML=`<div class="scard">
    <div class="top">${head}
      ${streak?`<span class="streak">🔥 連續 ${streak} 天</span>`:''}
      <button class="setbtn" id="scSet">${exam?'⚙️ 設定':'＋ 設定'}</button>
    </div>
    <div class="goalrow">
      <span class="glabel">今日已練</span>
      <div class="gtrack"><div class="gfill ${today>=goal?'done':''}" style="width:${pct}%"></div></div>
      <span class="gpct">${today}/${goal} 題</span>
    </div>
    ${exam&&daysUntil(exam)>0?`<div class="tip">💡 距考試 ${daysUntil(exam)} 天,建議每天至少 ${goal} 題,穩住手感。今日${today>=goal?'已達標 🎉':'再 '+(goal-today)+' 題達標'}</div>`:`<div class="tip">💡 每天做一點,靠「連續天數」養成手感。進度以模擬測驗題數計。</div>`}
    <div class="setwrap" id="scForm">
      <label class="glabel">考試日期 <input type="date" id="scDate" value="${exam}"></label>
      <label class="glabel">每日目標 <input type="number" id="scGoal" min="1" max="500" value="${goal}"> 題</label>
      <button class="save" id="scSave">儲存</button>
    </div>
  </div>`;
  document.getElementById('scSet').onclick=()=>document.getElementById('scForm').classList.toggle('on');
  document.getElementById('scSave').onclick=()=>{
    const dv=document.getElementById('scDate').value;
    const gv=Math.max(1,Math.min(500,+document.getElementById('scGoal').value||30));
    if(dv)LSs('exam_date',dv); else {try{localStorage.removeItem('exam_date');}catch(e){}}
    LSs('daily_goal',gv); renderStudyCard();
  };
}

/* ==== C2 智慧複習:彙整各科錯題本,算出「今天該複習」的題數 ==== */
/* 規則:錯題上次接觸(ts)在今天之前 → 今天該再看一次;今天已複習(ts=今天)或答對移除者不再列入 */
function renderReviewCard(){
  const box=document.getElementById('reviewCard'); if(!box)return;
  const t0=new Date(); t0.setHours(0,0,0,0); const todayStart=t0.getTime();
  let pool=0, due=0; const per={};
  SUBJ.forEach(s=>{
    let o={}; try{o=JSON.parse(LSg(s.wb)||'{}');}catch(e){}
    const ids=Object.keys(o); let d=0;
    ids.forEach(id=>{const ts=+(o[id]&&o[id].ts)||0; if(ts<todayStart)d++;});
    per[s.k]={total:ids.length,due:d}; pool+=ids.length; due+=d;
  });
  if(!pool){box.innerHTML=''; return; }   // 沒有任何錯題就不顯示
  const chips=SUBJ.filter(s=>per[s.k].total>0).map(s=>{
    const p=per[s.k];
    return `<a class="rchip ${p.due?'':'z'}" href="${s.page}">${s.icon} ${s.name}<span class="b">${p.due?p.due:'✓'}</span></a>`;
  }).join('');
  const tip = due
    ? `建議今天把這 <b>${due}</b> 題再做一次(答對即從錯題本移除),把記憶趁遺忘前補回來。`
    : (pool? '🎉 今天的複習都完成了!錯題本還有 '+pool+' 題,明天會再排進來。' : '');
  box.innerHTML=`<div class="rcard">
    <div class="top"><h3>🧠 今日複習</h3>${due?`<span class="due">待複習 ${due} 題</span>`:`<span class="due" style="color:var(--teal);background:var(--tealbg)">今日已完成</span>`}</div>
    <div class="chips">${chips}</div>
    <div class="tip">${tip}</div>
  </div>`;
}

render();
renderStudyCard();
renderReviewCard();
</script>
