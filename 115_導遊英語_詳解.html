  {kind:`passage`,
   label:`閱讀第 1 篇(第 71–75 題)· 主題:阿里山「栩悅號」森林火車`,
   text:[`To mark the beginning of a new chapter for the Alishan Forest Railway, modern designers teamed up with train manufacturers to refurbish its aging carriages. After two years and two months of work, the “Vivid Express” finally made its debut. In Chinese, its name conveys the sense of a cheerful and energetic train filled with joy. The renovation also symbolized the fusion of tradition and technology—old timber craftsmanship meeting digital design modeling—to ensure the forest railway continues to attract younger travelers while preserving its nostalgic charm.`,`The inspiration for the Vivid Express came from the collared bush robin. The male bird, with its deep blue feathers and scarf-like orange markings, inspired the exterior design, bringing vitality to the otherwise subdued color palette. Meanwhile, the female bird's soft yellow plumage was adopted for the interior, brightening the overall look and moving away from the old red-and-yellow scheme. Drawing on Alishan's ecological treasures, the train blends striking design with the experience of exploring Alishan's rich biodiversity, making the Vivid Express a truly unique journey. Rooted in Alishan's ecological richness, the concept also nods to the line's heritage as a historic narrow-gauge mountain railway dating back to the early 20th century. Designers even consulted local birdwatchers to capture the robin's authentic color balance, ensuring the tones felt organic under mountain sunlight. The choice of colors also represents ecological harmony, reminding visitors of Alishan's diverse wildlife and its protected habitats.`,`The Vivid Express has the following features. First, seating is arranged into compartments and observation areas. Compartments offer families or groups a cozy, semi-private space, while the observation section features rotatable seats that passengers can turn for the best view outside. Second, unlike traditional trains with closed cabs, the Vivid Express uses a wide glass partition at the front, which allows riders to take in the scenery ahead. Third, an eight-channel surround-sound system immerses travelers in the natural sounds of Alishan, enhancing the visual experience with an audio dimension. Additionally, the carriages are equipped with a wireless emergency call system that includes both voice and video, enabling the driver and train staff to respond quickly during unexpected events and ensure passenger safety. This transparent driver's-eye perspective is rare among mountain trains, giving tourists the sense of participating in the journey rather than just observing it. It also reflects the railway's philosophy of openness and connection between passengers and nature. The entire journey has thus become both a moving observatory and a cultural showcase, bridging the century-old heritage of the Alishan line with the aesthetic sensibilities of contemporary Taiwan.`],
   real:`🎧 <b>阿里山森鐵 + 栩悅號</b>是導遊超熱門考點。口試可準備:Alishan Forest Railway(阿里山森林鐵路)、narrow-gauge railway(窄軌鐵路)、biodiversity(生物多樣性)、collared bush robin(栗背林鴝/阿里山鴝)。`,
   vocab:[[`collared bush robin`,``,`栗背林鴝(阿里山鴝)`],[`refurbish (v.)`,`rɪˈfɝbɪʃ`,`翻新、整修`],[`carriage (n.)`,`ˈkærɪdʒ`,`車廂`],[`plumage (n.)`,`ˈplumɪdʒ`,`(鳥的)羽毛`],[`subdued (adj.)`,`səbˈdud`,`柔和的、素雅的`],[`nostalgic (adj.)`,`nɑˈstældʒɪk`,`懷舊的`],[`biodiversity (n.)`,``,`生物多樣性`],[`narrow-gauge`,``,`窄軌的`],[`partition (n.)`,`pɑrˈtɪʃən`,`隔板、隔間`]]},
  {kind:`q`,no:71,type:`閱讀`,topic:`細節 · TRUE`,star:3,
   stem:`According to the passage, which of the following statements is TRUE?`,
   zh:`根據本文,下列敘述何者「正確」?`,
   opts:[`After five years of work, the Vivid Express was finally completed. 歷經五年才完工`,`The female bird's dark blue plumage and scarf-like orange markings on the neck were incorporated into the exterior of the carriage. 母鳥的深藍羽毛與圍巾狀橙色頸紋被用於車廂外觀`,`The Alishan Forest Railway ride takes visitors on a train journey to explore the rich biodiversity of Alishan. 阿里山森鐵帶遊客搭火車探索阿里山豐富的生物多樣性`,`The Vivid Express uses a large piece of metal as a partition so that passengers can imagine what it is like to drive a train. 栩悅號用一大塊金屬當隔板,讓乘客想像開火車的感覺`],
   ans:2,
   ana:`<b>① 逐項回文核對(TRUE 題)</b><table class='opta'><tr><td>(A) 歷時五年完工</td><td><span class='no2'>✗</span> 原文是 <b>two years and two months</b>(兩年兩個月)</td></tr><tr><td>(B) <b>母鳥</b>深藍羽毛用於<b>外觀</b></td><td><span class='no2'>✗</span> 張冠李戴:深藍是<b>公鳥</b>、用於外觀;母鳥柔黃、用於<b>內裝</b></td></tr><tr><td>(C) 帶遊客探索阿里山生物多樣性</td><td><span class='ok2'>✓ 正解</span> = exploring Alishan's rich biodiversity</td></tr><tr><td>(D) 用<b>金屬</b>隔板</td><td><span class='no2'>✗</span> 原文是 <b>wide glass partition</b>(寬玻璃隔板)</td></tr></table>`,
   skill:`<b>TRUE 題逐項回文</b>:每個選項都回原文找依據。特別小心「公鳥/母鳥」「外觀/內裝」「玻璃/金屬」「五年/兩年」這種偷換對象與數字。`,
   note:`⚠️ 細節對象別搞混:公鳥(deep blue)→ 外觀;母鳥(soft yellow)→ 內裝。`,
   vocab:[[`incorporate (v.)`,`ɪnˈkɔrpəˌret`,`納入、融入`],[`exterior (n.)`,``,`外觀、外部`]]},

   text:[`New findings from Lux Research suggest that while autonomous robotaxis will further disrupt the conventional taxi and ride sharing spaces, car ownership will not be affected. Autonomous ride hailing is a major goal for many companies working in the field, including Waymo, Cruise, Argo and Zoox.`,`In their new report called “The Economics of Robotaxis,” Lux found that the average cost of operating a robotaxi could be enough to undercut human-driven taxis. But those costs aren't low enough, nor is the culture surrounding car ownership weak enough, to displace private cars.`,`While robotaxis are still limited by the scope of available technology, Lux research director and lead report author Christopher Robinson said that they took a huge leap last year.`,`“Robotaxi operations require SAE Level 4 autonomous vehicles capable of operating without a backup driver but constrained to specific operating conditions, such as geography or weather conditions,” Robinson said in a press release. “While many early operations feature safety drivers ready to take control of the vehicle at any time, 2020 saw the advent of the first truly driverless robotaxi operations, with reliance on a combination of teleoperators and trailing safety drivers in other vehicles.”`,`Lux argues that the elements required to implement geofenced SAE Level 4 autonomous robotaxis are within reach in the next decade. The firm looked at what it costs to operate a robotaxi in China, the United Kingdom and the United States, finding that it costs 28 cents per mile, 38 cents per mile and 42 cents per mile, respectively. That analysis factors in the cost of purchasing an electric car and outfitting it with autonomous technology, installing and using electric vehicle charging infrastructure, fleet maintenance, insurance, vehicle teleoperation and other costs.`,`In conventional taxis and ride hailing, one of the largest costs is the human driver. On average, today's ride hailing services charge $2 per mile in North America and $1 in China. Additionally, the cost of operating a conventional taxi includes having the license to do so. In major U.S. cities like New York City, Chicago and Boston, operators are required to purchase a “medallion,” a transferable permit that is often in limited supply.`,`Recently, in New York, medallions have sold for about $80,000. In 2014, the price for a medallion surpassed $1 million, but crashed as ride hailing permeated the marketplace. “With operating costs between $0.46 per mile and $0.29 per mile, robotaxi operators will likely be able to offer cheaper rides than incumbent ride-hailing services,” the report says. But that isn't enough to make a dent in car ownership, where Lux estimates the ownership of an electric car to be 10 cents per mile.`,`The report also argues that while car ownership won't be displaced by the developments in autonomous driving, automakers should not ignore the opportunity to jump in. No major operator working on autonomous cars is designing and building their own vehicles.`,`In a previous forecast, Lux projected that autonomous vehicle sales will be higher than robotaxi sales, another reason for OEMs to get into autonomous car development. The end goal is a better understanding of how consumers interact with this technology.`,`Ultimately, Lux says that how cities regulate autonomous vehicles, and possibly incorporate them into public transit solutions, will dictate how robotaxis are used.`],

{kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},
{kind:`strategy`,title:`📖 閱讀解題技巧總攻略`,html:`<h4>📖 閱讀口訣(先背這個)</h4><ul><li><b>選對答案</b>:「<b>回文定位,換句話說</b>」</li><li><b>八大陷阱</b>:「<b>反、沒、過、偏、換、張、絕、湊</b>」(相反/沒提/過度推論/以偏概全/偷換概念/張冠李戴/絕對化/硬湊因果)</li><li><b>推論題</b>:「<b>不找對的,先刪錯的</b>」</li></ul><h4>一、開考戰術(時間 &amp; 順序)</h4><ol><li><b>閱讀擺最後寫</b>:前 70 題字彙/對話先秒殺,留 15–20 分給 2 篇(每篇約 8 分)。</li><li><b>先讀題目、再讀文章</b>:帶問題找答案,別先逐字精讀。</li><li><b>細節題按文章順序出</b>:第 1 題答案多在前段、最後題在後段。</li><li><b>略讀骨架</b>:首段 + 每段第一句 + 結論 = 全文主旨。</li></ol>
<h4>二、六大題型速查</h4><table><tr><th>題型</th><th>題目長相</th><th>破解法</th></tr><tr><td><b>主旨/標題</b></td><td>title / mainly about</td><td>選涵蓋全文;太窄太寬都刪</td></tr><tr><td><b>細節</b></td><td>According to / Why / What</td><td>關鍵字回文;答案是原文換句話說</td></tr><tr><td><b>NOT 題</b></td><td>NOT true / EXCEPT</td><td>先圈 NOT!選與原文矛盾/沒出現的</td></tr><tr><td><b>推論</b></td><td>inferred / imply</td><td>刪 4 種雷;選溫和有依據的</td></tr><tr><td><b>字義</b></td><td>the word "X" means</td><td>代入原句 + 字根 + 上下文褒貶</td></tr><tr><td><b>目的/態度</b></td><td>purpose / tone</td><td>看作者立場;語氣太偏必錯</td></tr></table>
<h4>三、干擾選項 8 大陷阱</h4><ol><li><b>與原文相反</b>(回文一比就露餡)</li><li><b>文章沒提</b>(無中生有:政府、政策…)</li><li><b>過度推論</b>(outweigh/best/most 講太滿)</li><li><b>以偏概全</b>(只涵蓋一部分,主旨題最愛)</li><li><b>偷換概念</b>(local↔foreign)</li><li><b>張冠李戴</b>(對的資訊安到錯的題)</li><li><b>絕對化</b>(only/all/never/must/completely)</li><li><b>硬湊因果</b>(兩件無關的事說成因果)</li></ol>
<h4>四、這科(旅遊觀光閱讀)命題特點</h4><ul><li><b>常考主題</b>:觀光經濟影響、永續/淨零、過度觀光、文化遺產、旅遊安全、旅宿趨勢。</li><li><b>超愛正反並陳</b>:先好處再壞處 → <b>「說死一邊」的選項幾乎必錯</b>,答案通常兩面兼顧。</li><li><b>學術詞不用怕</b>:考的是主旨/細節/態度,抓大意就能答。</li></ul>
<h4>五、卡關搶救</h4><ol><li>字義題不會 → 看<b>字根</b> + 上下文褒貶。</li><li>細節找不到 → 用<b>關鍵字/專有名詞/數字</b>回文掃。</li><li>兩選項難選 → 找有原文依據的,避開「絕對化」「文章沒提」。</li><li>時間不夠 → 主旨、字義題最快先搶;推論題擺最後。</li></ol>`}

];

const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';el.id='q'+item.no;
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
(function(){function backBtn(){var ref=document.referrer||'';var label;if(/學習中心/.test(ref))label='← 回學習中心';else if(/錯題本/.test(ref))label='← 回錯題本';else return;var b=document.createElement('a');b.textContent=label;b.href='#';b.style.cssText='position:fixed;left:12px;bottom:16px;z-index:99;background:var(--accent);color:#fff;padding:9px 16px;border-radius:22px;font-size:.86rem;font-weight:700;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.28)';b.addEventListener('click',function(e){e.preventDefault();history.back();});document.body.appendChild(b);}function go(){var h=location.hash;if(!/^#q\d+$/.test(h))return;var c=document.getElementById(h.slice(1));if(!c)return;c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){c.classList.remove('hl');},2400);}window.addEventListener('hashchange',go);if(/^#q\d+$/.test(location.hash))backBtn();setTimeout(go,300);})();
</script>
</body>
</html>
