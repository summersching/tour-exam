 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

  skill:`💡 <b>情境鎖</b>:價格 + 快過通膨 → rising(上漲);刪相反字 stagnating。`,
  vocab:[[`rise (v.)`,`raɪz`,`上漲`],[`inflation (n.)`,`ɪnˈfleʃən`,`通貨膨脹`],[`net income`,``,`淨利`]]},

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:direct / non-stop / layover 三種航班差異`,
  text:[`Did you know there is a difference between a direct, non-stop and a layover flight? Booking the right flight guarantees that you have chosen a flight that is comfortable and convenient for your travel schedule.`,`Many people think a direct flight is the same as a non-stop flight. Though the term 'direct' is used interchangeably with 'non-stop', the two are different. In a direct flight, you do not change planes and you have only one flight number. Unlike the non-stop flight, the plane makes a stop en route to the final destination for refueling and picking up and dropping off passengers. If you are in a hurry, a direct flight may not be the right choice. The stops add up to an hour or two to your total flight time. If time is not an issue, direct flights are ideal since they are often less expensive than non-stop flights.`,`A non-stop flight is just as it sounds – a flight that goes from one point to another without making a stop. Just like direct flights, non-stop flights have a single flight number. Non-stop flights are mostly sought-after for business travelers who value time. They are usually the most expensive flights. Passengers on non-stop flights are not affected by unexpected delays at the airport after takeoff, including refueling.`,`You can never mention a direct and non-stop flight without a layover flight. A layover flight is also called a connecting flight. If you book a layover flight, it means the plane will make a stop en route, with passengers disembarking the flight and changing services. Long layovers approach stopover territory, which is, essentially, an even longer layover. Considering the high price range of both direct and non-stop flights, you may consider booking a layover flight since it is usually less expensive. Connecting flights have more than one flight number.`],
  real:`帶團訂機位常要跟團員解釋「直飛≠不停點」:<b>non-stop</b> 最快最貴(商務客最愛);<b>direct</b> 同班號但中途落地加油/上下客,會多 1–2 小時但較便宜;<b>layover / connecting</b> 要轉機換班號,最便宜但最花時間。口試被問「三者差別」時,抓「換不換飛機 / 幾個班號 / 停不停」三刀切最清楚。`,
  vocab:[[`interchangeably (adv.)`,`ˌɪntɚˈtʃendʒəblɪ`,`可互換地`],[`en route`,`ɑn ˈrut`,`途中`],[`sought-after (adj.)`,``,`搶手的`],[`disembark (v.)`,`ˌdɪsɪmˈbɑrk`,`下(飛)機、下船`],[`layover (n.)`,`ˈleˌovɚ`,`中途停留、轉機`],[`refuel (v.)`,`riˈfjuəl`,`加油`]]},

 {kind:`q`,no:71,type:`閱讀`,topic:`細節 · 是非判斷`,star:2,
  stem:`Which of the following statements is TRUE about a direct flight?`,
  zh:`關於直飛航班(direct flight),下列何者為真?`,
  opts:[`It may have a stop en route to the final destination. 途中可能停一站。`,`It involves changing planes. 需要換飛機。`,`It is ideal for travelers for whom time and the air ticket price are an issue. 適合在意時間與票價的旅客。`,`It is the same as a non-stop flight. 和不停點航班相同。`],ans:0,
  ana:`<b>① 定位原文</b>(第 2 段):direct flight「the plane makes a stop en route… for refueling and picking up… passengers」。<br><b>② 選項逐一辨析</b>:<table class="opta"><tr><td>(A) 途中可能停一站</td><td><span class="ok2">✓ 正解</span>　對應「makes a stop en route」</td></tr><tr><td>(B) 需要換飛機</td><td><span class="no2">✗</span>　原文「you do <b>not</b> change planes」,相反</td></tr><tr><td>(C) 適合在意時間又在意票價者</td><td><span class="no2">✗</span>　原文「If time is <b>not</b> an issue, direct flights are ideal」——只在<b>不</b>在意時間時才理想</td></tr><tr><td>(D) 和 non-stop 相同</td><td><span class="no2">✗</span>　原文「the two are <b>different</b>」,相反</td></tr></table>`,
  skill:`💡 <b>是非題三步</b>:①回原文定位 ②比對「有沒有 not / different」這種反轉字 ③B、D 都是「原文說相反」的經典陷阱。`,
  note:`⚠️ 這科最愛用「原文明講相反(not / different)」設錯項——回去找那個字就破解。`,
  vocab:[[`en route`,`ɑn ˈrut`,`途中`],[`final destination`,``,`最終目的地`],[`ideal (adj.)`,`aɪˈdiəl`,`理想的`]]},

  skill:`💡 <b>「半對半錯」陷阱(D)</b>:選項前半對(省錢)、後半錯(省時)——閱讀最愛這招。一個選項只要有<b>一半</b>與原文不符,整項就是錯。`,
  note:`⚠️ 遇到「又…又…(both / and)」的選項要<b>逐項驗證兩邊</b>,常一邊真一邊假。`,

 {kind:`q`,no:74,type:`閱讀`,topic:`細節 · 比較`,star:3,

 {kind:`q`,no:75,type:`閱讀`,topic:`細節 · EXCEPT 題`,star:3,

  note:`⚠️ 看到大寫 EXCEPT / NOT,先在題號旁畫個圈提醒自己「要選錯的/沒提到的」,避免慣性選對的。`,
  vocab:[[`disembark (v.)`,`ˌdɪsɪmˈbɑrk`,`下機、下船`],[`pick up`,``,`接載`],[`drop off`,``,`讓…下車/機`]]},

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:國際旅行前的準備(護照/簽證/當地差異)`,
  text:[`There are some simple tips for what to do before traveling internationally. First, the validity of your passport can be an easy oversight. A passport validity of 10 years can make people complacent, forgetting that it actually requires renewing. Many countries won't allow entry if your passport has less than 6 months remaining. A good rule of thumb is to ensure your passport is valid when booking your flight.`,`Additionally, check in advance if you need a visa. Arriving for your flight without the necessary visa can lead to being denied boarding, especially if you can't apply for one on arrival. US and UK passport holders can travel to many countries without a visa or receive one upon arrival. However, entry requirements vary, so thorough research is essential.`,`Investing time in researching your destination is also important to optimize your experience. While spontaneous travel seems fun, being aware of the nuances of your destination country can be more practical. This includes understanding differences in language, culture, and laws. For instance, chewing gum is illegal in Singapore, feeding pigeons is prohibited in Venice, and riding a cow while intoxicated is not allowed in Scotland. Knowing them ahead of time can keep you out of trouble.`],
  real:`帶團出國前置作業重點,考題也常考:<b>①護照效期</b>——多數國家要求「入境時仍有 6 個月以上效期」,10 年期護照最容易被忽略(oversight)忘了換;<b>②簽證</b>——出發前確認要不要簽,沒簽可能直接被拒絕登機(denied boarding);<b>③當地眉角</b>——新加坡禁口香糖、威尼斯禁餵鴿子、蘇格蘭禁醉後騎牛,這些「當地法規/文化差異」出發前先查好免惹麻煩。`,
  vocab:[[`validity (n.)`,`vəˈlɪdətɪ`,`(效期)有效性`],[`oversight (n.)`,`ˈovɚˌsaɪt`,`疏忽`],[`complacent (adj.)`,`kəmˈplesn̩t`,`自滿的、鬆懈的`],[`rule of thumb`,``,`經驗法則`],[`nuance (n.)`,`ˈnuɑns`,`細微差異`],[`intoxicated (adj.)`,`ɪnˈtɑksɪˌketɪd`,`喝醉的`]]},

 {kind:`q`,no:76,type:`閱讀`,topic:`主旨題`,star:2,

  opts:[`The process of obtaining a visa 取得簽證的流程`,`Preparing for international travel 國際旅行前的準備`,`The legal system in foreign countries 外國的法律制度`,`The importance of understanding cultural differences 了解文化差異的重要性`],ans:1,

  skill:`💡 <b>細節題只認原文</b>:A/B/C 聽起來都「像是護照問題」很合理,但<b>文章沒寫的就是錯</b>。閱讀不能靠常識腦補,只能回文找字。`,

  note:`⚠️ nuance = 細微差異(subtle)。看到「重大/明顯(major/obvious)」通常是反義陷阱。`,

 {kind:`q`,no:79,type:`閱讀`,topic:`指代題`,star:3,

 {kind:`q`,no:80,type:`閱讀`,topic:`細節 · 定位`,star:2,
  stem:`Which of the following is mentioned as an illegal activity in a foreign country?`,
  zh:`下列何者被提到是某外國的違法行為?`,
  opts:[`Feeding pigeons in Venice 在威尼斯餵鴿子`,`Riding a bicycle on sidewalks in Scotland 在蘇格蘭人行道騎腳踏車`,`Eating on the street in Singapore 在新加坡街上吃東西`,`Taking pictures of US government buildings 拍美國政府建築`],ans:0,
  ana:`<b>① 定位原文</b>(第 3 段):「chewing gum is illegal in Singapore, <b>feeding pigeons is prohibited in Venice</b>, and riding a cow while intoxicated is not allowed in Scotland」。<br><b>② 選項辨析(全是「偷換細節」陷阱)</b>:<table class="opta"><tr><td>(A) 威尼斯餵鴿子</td><td><span class="ok2">✓ 正解</span>　原文一字不差</td></tr><tr><td>(B) 蘇格蘭騎<b>腳踏車</b></td><td><span class="no2">✗</span>　原文是「醉後騎<b>牛</b>」,偷換</td></tr><tr><td>(C) 新加坡街上<b>吃東西</b></td><td><span class="no2">✗</span>　原文是「嚼<b>口香糖</b>」,偷換</td></tr><tr><td>(D) 拍美國政府建築</td><td><span class="no2">✗</span>　文章根本沒提美國</td></tr></table>`,
  skill:`💡 <b>「偷換細節」陷阱</b>:錯項把國家對、行為換掉(騎牛→騎腳踏車、口香糖→吃東西)。細節題要<b>地點+行為兩者都對</b>才算,錯一個就刪。`,
  note:`⚠️ 這題四個選項地點都出現過,但行為被動手腳——務必「地點配行為」逐字核對。`,
  vocab:[[`illegal (adj.)`,`ɪˈliɡl̩`,`違法的`],[`sidewalk (n.)`,`ˈsaɪdˌwɔk`,`人行道`],[`mention (v.)`,`ˈmɛnʃən`,`提及`]]}
];

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
</body>
</html>
