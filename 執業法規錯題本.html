<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<title>執業法規 · 錯題本</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;
    --ok:#15904a;--okbg:#e5f6ec;--no:#c62a2a;--nobg:#fbe9e9;--sel:#4f46e5;--selbg:#eef0fe;
    --hd1:#3730a3;--hd2:#4f46e5;
    --c-r:#f4ecfb;--c-rk:#7a3fc0;--c-t:#eef1f5;--c-tk:#55647a;
    --skillbg:#eaf1ff;--skillk:#1d4ed8;--skillbd:#93b4f7;--notebg:#fff3e6;--notek:#b5560c;--notebd:#f3bd7e;
    --chipv:#eef2ff;--chipvk:#3b4fd6;--dang:#c0392b;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --ok:#5ad48a;--okbg:#173023;--no:#ff8080;--nobg:#331a1a;--sel:#818cf8;--selbg:#1e1b4b;
    --hd1:#312e81;--hd2:#3730a3;
    --c-r:#2a1f3a;--c-rk:#c79bff;--c-t:#242b36;--c-tk:#9fb0c6;
    --skillbg:#182741;--skillk:#9db8ff;--skillbd:#2f4a80;--notebg:#3a2a17;--notek:#f4b877;--notebd:#6a4a24;
    --chipv:#22284a;--chipvk:#9db0ff;--dang:#e5736a;
  }}
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.28rem} header p{margin:2px 0;opacity:.92;font-size:.82rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .bar .wrap{padding:9px 16px}
  .rowf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}
  .rowf .lb{font-size:.76rem;color:var(--sub);font-weight:700;margin-right:2px;min-width:30px}
  .chip2{border:1.4px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:16px;cursor:pointer;font-size:.82rem;font-family:inherit;font-weight:600}
  .chip2.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  #q{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem;font-family:inherit;margin-top:4px}
  .cnt{font-size:.78rem;color:var(--sub);padding:10px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.04);transition:opacity .18s}
  .card.mastered{opacity:.5}
  .qhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .qno{background:var(--sel);color:#fff;font-weight:700;border-radius:8px;padding:2px 10px;font-size:.82rem}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600}
  .c-r{background:var(--c-r);color:var(--c-rk)} .c-t{background:var(--c-t);color:var(--c-tk)}
  .wrongn{font-size:.72rem;background:var(--nobg);color:var(--no);border-radius:20px;padding:2px 9px;font-weight:700}
  .src{font-size:.72rem;border-radius:6px;padding:1px 7px;font-weight:700}
  .src.leader{background:var(--chipv);color:var(--chipvk)} .src.guide{background:var(--okbg);color:var(--ok)}
  .del{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:14px;padding:3px 10px;font-size:.74rem;cursor:pointer;font-family:inherit}
  .del:hover{border-color:var(--no);color:var(--no)}
  .stem{font-size:1.03rem;margin:4px 0 11px}
  .opts{display:grid;gap:7px}
  .opt{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:.96rem}
  .opt .lab{font-weight:700;color:var(--sub);min-width:17px}
  .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .lab{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--nobg)} .opt.no .lab{color:var(--no)}
  .opt .mk{margin-left:auto;font-weight:700;color:var(--ok)} .opt .mk.x{color:var(--no)}
  .opt.clk{cursor:pointer;width:100%;text-align:left;font-family:inherit}
  .opt.clk:hover{border-color:var(--sel)}
  .fb{margin-top:8px;font-size:.86rem;font-weight:700;display:none} .fb.show{display:block}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
  .reveal{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
  .lbl{font-weight:700;font-size:.8rem;color:var(--accent);margin:9px 0 3px} .lbl:first-child{margin-top:0}
  .ana{font-size:.94rem} .ana b.ac,.box b.ac{color:var(--ok)} .ana b.wr,.box b.wr{color:var(--no)}
  .zh{color:var(--sub);font-size:.92rem}
  .box{border-left:4px solid;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.9rem}
  .box .h{display:block;margin-bottom:2px;font-size:.82rem}
  .box.skill{background:var(--skillbg);border-color:var(--skillbd)} .box.skill .h{color:var(--skillk)}
  .box.note{background:var(--notebg);border-color:var(--notebd)} .box.note .h{color:var(--notek)}
  .noana{font-size:.82rem;color:var(--sub);margin-top:8px;font-style:italic}
  .empty{text-align:center;color:var(--sub);padding:48px 10px;font-size:.95rem}
  .empty b{color:var(--ok);font-size:1.1rem;display:block;margin-bottom:6px}
  .tools2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 2px}
  .mbtn{border:1.4px solid var(--line);background:var(--card);color:var(--ink);padding:6px 15px;border-radius:16px;cursor:pointer;font-size:.86rem;font-weight:700;font-family:inherit}
  .mbtn.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .pbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:16px;cursor:pointer;font-size:.84rem;font-family:inherit}
  .pbtn.dang{color:var(--dang);border-color:var(--dang)}
  .score{font-size:.82rem;color:var(--sub);font-weight:700;margin-left:auto}
  @media print{header .home,.bar,.tools2,.del{display:none!important}.card{box-shadow:none;break-inside:avoid}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
<script src="pr2.js"></script>
<script src="pr2_ana.js" onerror="window.PR2ANA=window.PR2ANA||{}"></script>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>⚖️ 執業法規 · 錯題本</h1>
  <p>模擬測驗答錯的題目自動收錄,自測答對即自動移除</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="rowf"><span class="lb">證照</span><span id="fCert"></span></div>
  <div class="rowf"><span class="lb">年份</span><span id="fYear"></span></div>
  <div class="rowf"><span class="lb">考點</span><span id="fTopic"></span></div>
  <input id="q" placeholder="搜尋題幹 / 選項 / 解析關鍵字…">
  <div class="cnt" id="cnt"></div>
</div></div>

<div class="wrap">
  <div class="tools2">
    <button class="mbtn on" data-m="review">📖 複習模式</button>
    <button class="mbtn" data-m="test">✍️ 自測模式</button>
    <button class="pbtn" id="printBtn">🖨 匯出 PDF</button>
    <button class="pbtn dang" id="clearBtn">🗑 清空</button>
    <span class="score" id="score"></span>
  </div>
</div>

<main class="wrap" id="list"></main>

<script>
const LAB=['A','B','C','D'];
const CNAME={leader:'領隊',guide:'導遊'};
const GT={};
const WBGH_KEY='wrongbook_pr2';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WBGH_KEY)||'{}');}catch(e){return{};}}
function wbSave(o){try{localStorage.setItem(WBGH_KEY,JSON.stringify(o));}catch(e){}}
function ghData(q){return (typeof PR2ANA!=='undefined'&&PR2ANA[q.c+'-'+q.y+'-'+q.no])||null;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function findQ(id){return PR2BANK.find(x=>(x.c+'-'+x.y+'-'+x.no)===id)||null;}
function qid(q){return q.c+'-'+q.y+'-'+q.no;}
function ansOk(q,p){return q.sungei?true:(p===q.ans);}

let MODE='review', fc='all', fy='all', ft='all', clearArm=false;
const picks={};   // 自測作答:id → 選項index(僅本次 session)

/* 取出目前錯題(補齊題目與解析);略過題庫已不存在的 id */
function allEntries(){
  const o=wbLoad();
  return Object.keys(o).map(id=>{const q=findQ(id);return q?{id:id,q:q,wrong:o[id].wrong||1,picked:o[id].picked}:null;}).filter(Boolean);
}
function entries(){
  let arr=allEntries().filter(e=>{
    const d=ghData(e.q);
    return (fc==='all'||e.q.c===fc)&&(fy==='all'||String(e.q.y)===fy)&&(ft==='all'||(d&&d.t===ft));
  });
  const kw=document.getElementById('q').value.trim().toLowerCase();
  if(kw)arr=arr.filter(e=>{const d=ghData(e.q);const hay=(e.q.stem+' '+e.q.opts.join(' ')+' '+(d?d.a+' '+d.s+' '+(d.n||''):'')).toLowerCase();return hay.includes(kw);});
  arr.sort((a,b)=>(a.q.c<b.q.c?-1:a.q.c>b.q.c?1:0)||(a.q.y-b.q.y)||(a.q.no-b.q.no));
  return arr;
}

function chip(v,t,on,attr){return `<button class="chip2 ${on?'on':''}" data-${attr}="${v}">${t}</button>`;}
function buildFilters(){
  const all=allEntries();
  const certs=[...new Set(all.map(e=>e.q.c))].sort();
  document.getElementById('fCert').innerHTML = certs.length>1 ?
    chip('all','全部 ('+all.length+')',fc==='all','fc')+
    certs.map(c=>chip(c,CNAME[c]+' ('+all.filter(e=>e.q.c===c).length+')',fc===c,'fc')).join('') :
    chip('all','全部 ('+all.length+')',true,'fc');
  const scoped=all.filter(e=>fc==='all'||e.q.c===fc);
  const years=[...new Set(scoped.map(e=>String(e.q.y)))].sort((a,b)=>b-a);
  document.getElementById('fYear').innerHTML =
    chip('all','全部',fy==='all','fy')+years.map(y=>chip(y,y+'年 ('+scoped.filter(e=>String(e.q.y)===y).length+')',fy===y,'fy')).join('');
  const tps=[...new Set(scoped.map(e=>{const d=ghData(e.q);return d&&d.t;}).filter(Boolean))];
  document.getElementById('fTopic').innerHTML =
    chip('all','全部',ft==='all','ft')+tps.map(t=>chip(t,GT[t]+' ('+scoped.filter(e=>{const d=ghData(e.q);return d&&d.t===t;}).length+')',ft===t,'ft')).join('');
}

function optMarkReview(q,i,picked){
  if(i===q.ans||(q.sungei&&picked===i))return['ok','✓'];
  if(picked!=null&&picked===i)return['no','✗'];
  return['',''];
}
function optMarkTest(q,i,p){
  if(p==null)return['',''];
  if(q.sungei)return p===i?['ok','✓']:['',''];
  if(i===q.ans)return['ok','✓'];
  if(p===i)return['no','✗'];
  return['',''];
}
function optHtml(e,i,o){
  const q=e.q;
  if(MODE==='review'){const [c,mk]=optMarkReview(q,i,e.picked);
    return `<div class="opt ${c}"><span class="lab">${LAB[i]}</span><span>${esc(o)}</span>${mk?`<span class="mk ${mk==='✗'?'x':''}">${mk}</span>`:''}</div>`;}
  const p=picks[e.id], answered=(p!=null), [c,mk]=optMarkTest(q,i,p);
  return `<button class="opt clk ${c}" ${answered?'disabled':''} data-k="${e.id}" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${esc(o)}</span><span class="mk ${mk==='✗'?'x':''}">${mk}</span></button>`;
}
function revealHtml(q){
  const d=ghData(q);
  let h=q.sungei?`<div class="lbl" style="color:var(--ok)">✓ 送分題</div><div class="zh">${q.note||'此題經評量單位公告一律給分'}</div>`:'';
  if(d){
    h+=`<div class="lbl">解析 <span style="font-weight:400;color:var(--sub)">(AI 輔助,以官方答案為準)</span></div><div class="ana">${d.a}</div>`;
    if(d.s)h+=`<div class="box skill"><b class="h">💡 解題技巧</b>${d.s}</div>`;
    if(d.n)h+=`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${d.n}</div>`;
  }else if(!q.sungei){h+=`<div class="noana">此題解析整理中…(官方答案已標示)</div>`;}
  return h;
}
function render(){
  const arr=entries();
  const total=allEntries().length;
  document.getElementById('cnt').textContent = total? ('錯題 '+total+' 題'+(arr.length!==total?'(篩選後 '+arr.length+')':'')) : '';
  if(!total){
    document.getElementById('list').innerHTML='<div class="empty"><b>🎉 目前沒有錯題!</b>到「模擬測驗」選執業法規練習,答錯的題目會自動收錄到這裡。</div>';
    updScore(arr);return;
  }
  document.getElementById('list').innerHTML=arr.map(e=>{
    const q=e.q,d=ghData(q);
    const tags=d?`<span class="chip c-r">${d.t}</span><span class="chip c-t">${d.tt}</span>`:`<span class="chip c-r">執業法規</span>`;
    const show=(MODE==='review')||(picks[e.id]!=null);
    return `<div class="card" data-id="${e.id}">
      <div class="qhead"><span class="qno">第 ${q.no} 題</span>${tags}
        ${e.wrong>1?`<span class="wrongn">答錯 ${e.wrong} 次</span>`:''}
        <span class="src ${q.c}">${CNAME[q.c]}${q.y}</span>
        <button class="del" data-del="${e.id}">✕ 移除</button></div>
      <div class="stem">${esc(q.stem)}</div>
      <div class="opts">${q.opts.map((o,i)=>optHtml(e,i,o)).join('')}</div>
      <div class="fb" data-fb="${e.id}"></div>
      <div class="reveal">${show?revealHtml(q):''}</div></div>`;
  }).join('')||'<div class="empty">找不到符合的錯題</div>';
  updScore(arr);
}
function updScore(arr){
  const el=document.getElementById('score');
  if(MODE!=='test'){el.textContent='';return;}
  let done=0,ok=0;arr.forEach(e=>{const p=picks[e.id];if(p!=null){done++;if(ansOk(e.q,p))ok++;}});
  el.textContent=done?('作答 '+done+' · 答對 '+ok):'';
}

document.querySelector('.bar').addEventListener('click',e=>{
  const b=e.target.closest('.chip2');if(!b)return;
  if(b.dataset.fc!=null){fc=b.dataset.fc;fy='all';ft='all';}
  else if(b.dataset.fy!=null)fy=b.dataset.fy;
  else if(b.dataset.ft!=null)ft=b.dataset.ft;
  buildFilters();render();window.scrollTo(0,0);
});
document.getElementById('q').addEventListener('input',render);
document.querySelector('.tools2').addEventListener('click',e=>{
  const b=e.target.closest('.mbtn');if(!b)return;
  MODE=b.dataset.m;
  document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x===b));
  render();window.scrollTo(0,0);
});
document.getElementById('list').addEventListener('click',e=>{
  // 移除單題
  const del=e.target.closest('[data-del]');
  if(del){const o=wbLoad();delete o[del.dataset.del];wbSave(o);delete picks[del.dataset.del];
    const card=del.closest('.card');if(card){card.style.opacity='0';setTimeout(()=>{buildFilters();render();},180);}return;}
  // 自測作答
  if(MODE!=='test')return;
  const b=e.target.closest('.opt.clk');if(!b)return;
  const id=b.dataset.k;if(picks[id]!=null)return;
  const i=+b.dataset.i;picks[id]=i;
  const ent=allEntries().find(x=>x.id===id);if(!ent)return;
  const correct=ansOk(ent.q,i);
  render();
  const fb=document.querySelector(`[data-fb="${id}"]`);
  if(fb){fb.classList.add('show');
    if(correct){fb.classList.add('ok');fb.textContent='✅ 答對了!已從錯題本移除';
      const o=wbLoad();delete o[id];wbSave(o);
      const card=document.querySelector(`.card[data-id="${id}"]`);if(card)card.classList.add('mastered');
      buildFilters();
    }else{fb.classList.add('no');fb.textContent='✗ 又錯了,正解是 '+LAB[ent.q.ans]+' — 這題留著繼續練';
      const o=wbLoad();if(o[id]){o[id].wrong=(o[id].wrong||1)+1;o[id].picked=i;wbSave(o);}}
  }
  updScore(entries());
});
document.getElementById('printBtn').onclick=function(){
  const prev=MODE;MODE='review';render();
  setTimeout(function(){window.print();MODE=prev;render();},200);
};
document.getElementById('clearBtn').onclick=function(){
  if(!allEntries().length)return;
  if(!clearArm){clearArm=true;this.textContent='⚠ 再按一次清空';setTimeout(()=>{clearArm=false;this.textContent='🗑 清空';},2600);return;}
  localStorage.removeItem(WBGH_KEY);for(const k in picks)delete picks[k];clearArm=false;this.textContent='🗑 清空';
  fc='all';fy='all';ft='all';buildFilters();render();
};
buildFilters();render();
</script>
</body>
</html>
