const DATA = [
 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`q`,no:1,type:`字彙`,topic:`餐飲 · 飲食限制`,star:2,
  stem:`A gluten-__BLANK__ meal does not contain any gluten-based product.`,
  zh:`(給)<b>麩質不耐</b>者的餐點不含任何麩質製品。`,
  opts:[`accepting 接受的`,`indulgent 縱容的`,`intolerant 不耐的、無法耐受的`,`rich 豐富的`],ans:2,
  ana:`<b>gluten-intolerant</b>=對麩質不耐(乳糜瀉)。rich、accepting、indulgent 語意不合。`,
  skill:`💡 <b>套回原句</b>:gluten-intolerant 是固定搭配(對麩質不耐);rich/accepting 語意不合。`,
  note:`⚠️ 別跟 <b>gluten-free</b>(無麩質)搞混:<b>gluten-free</b> 形容「食物」(不含麩質);<b>gluten-intolerant</b> 形容「人」(對麩質不耐)。`,

 {kind:`q`,no:2,type:`字彙`,topic:`住宿 · 入住`,star:2,
  stem:`Guests checked in at the hotel __BLANK__ before going to their rooms.`,

  vocab:[[`reception (n.)`,`rɪˈsɛpʃən`,`接待櫃台;接待`],[`check in`,``,`辦理入住/報到`],[`concierge (n.)`,`ˌkɑnsɪˈɛrʒ`,`(飯店)禮賓`],[`lobby (n.)`,`ˈlɑbɪ`,`大廳`]]},

 {kind:`q`,no:3,type:`字彙`,topic:`出入境 · 查驗`,star:3,
  stem:`Before entering the country, each visitor must have a valid __BLANK__ ready for inspection.`,

  skill:`送分題:看到 <i>entering the country</i>(入境)+ <i>valid</i>(有效)+ <i>inspection</i>(查驗)→ 只有護照符合,秒選。`,

  vocab:[[`passport (n.)`,`ˈpæsˌpɔrt`,`護照`],[`valid (adj.)`,`ˈvælɪd`,`有效的`],[`inspection (n.)`,`ɪnˈspɛkʃən`,`查驗`],[`receipt (n.)`,`rɪˈsit`,`收據(p 不發音!)`]]},

 {kind:`q`,no:4,type:`對話`,topic:`餐飲 · 訂位`,star:3,
  stem:`Peter: Judy, I hope our __BLANK__ at the restaurant is confirmed.　Judy: Don't worry, I received the confirmation email this morning.`,
  zh:`Peter:Judy,希望我們餐廳的<b>訂位</b>已經確認了。　Judy:別擔心,我今早收到確認信了。`,
  opts:[`reservation 訂位、預約`,`city map 城市地圖`,`travel guidebook 旅遊指南`,`luggage tag 行李吊牌`],ans:0,
  ana:`餐廳 + confirmed / confirmation email(確認)→「訂位」<b>reservation</b>。`,
  skill:`💡 <b>情境鎖</b>:餐廳 + confirmation(確認)→ 訂位 reservation。`,
  note:`⚠️ <b>reservation</b>(美式常用)≈ <b>booking</b>(英式常用),訂位/訂房兩字都會考,意思相同。`,
  real:`帶團訂餐廳:<i>"I have a reservation for ten under the name Chen."</i>(我用陳的名字訂了十人的位)。`,
  vocab:[[`reservation (n.)`,`ˌrɛzɚˈveʃən`,`訂位、預約`],[`confirm (v.)`,`kənˈfɝm`,`確認`],[`booking (n.)`,`ˈbʊkɪŋ`,`預訂(英式)`]]},

 {kind:`q`,no:5,type:`字彙`,topic:`餐飲 · 異國美食`,star:2,
  stem:`If you plan to try some __BLANK__ dishes when traveling to a different country, please do some research about what those dishes are.`,
  zh:`如果你到不同國家想嘗試一些<b>異國風味</b>的菜,請先研究一下那些是什麼菜。`,
  opts:[`exotic 異國風情的`,`instinct 本能(名詞)`,`contrastive 對比的`,`known 已知的`],ans:0,

  zh:`在許多美國大城市,人們可以去<b>購物區</b>採買。`,

  vocab:[[`district (n.)`,`ˈdɪstrɪkt`,`區、地段`],[`hallmark (n.)`,`ˈhɔlˌmɑrk`,`標誌、特徵`],[`mansion (n.)`,`ˈmænʃən`,`豪宅`]]},

 {kind:`strategy`,title:`📖 閱讀解題技巧總攻略`,html:`<h4>📖 閱讀口訣(先背這個)</h4><ul><li><b>選對答案</b>:「<b>回文定位,換句話說</b>」</li><li><b>八大陷阱</b>:「<b>反、沒、過、偏、換、張、絕、湊</b>」(相反/沒提/過度推論/以偏概全/偷換概念/張冠李戴/絕對化/硬湊因果)</li><li><b>推論題</b>:「<b>不找對的,先刪錯的</b>」</li></ul><h4>一、開考戰術(時間 &amp; 順序)</h4><ol><li><b>閱讀擺最後寫</b>:前 70 題字彙/對話先秒殺,留 15–20 分給 2 篇(每篇約 8 分)。</li><li><b>先讀題目、再讀文章</b>:帶問題找答案,別先逐字精讀。</li><li><b>細節題按文章順序出</b>:第 1 題答案多在前段、最後題在後段。</li><li><b>略讀骨架</b>:首段 + 每段第一句 + 結論 = 全文主旨。</li></ol>
<h4>二、六大題型速查</h4><table><tr><th>題型</th><th>題目長相</th><th>破解法</th></tr><tr><td><b>主旨/標題</b></td><td>title / mainly about</td><td>選涵蓋全文;太窄太寬都刪</td></tr><tr><td><b>細節</b></td><td>According to / Why / What</td><td>關鍵字回文;答案是原文換句話說</td></tr><tr><td><b>NOT 題</b></td><td>NOT true / EXCEPT</td><td>先圈 NOT!選與原文矛盾/沒出現的</td></tr><tr><td><b>推論</b></td><td>inferred / imply</td><td>刪 4 種雷;選溫和有依據的</td></tr><tr><td><b>字義</b></td><td>the word "X" means</td><td>代入原句 + 字根 + 上下文褒貶</td></tr><tr><td><b>目的/態度</b></td><td>purpose / tone</td><td>看作者立場;語氣太偏必錯</td></tr></table>
<h4>三、干擾選項 8 大陷阱</h4><ol><li><b>與原文相反</b>(回文一比就露餡)</li><li><b>文章沒提</b>(無中生有:政府、政策…)</li><li><b>過度推論</b>(outweigh/best/most 講太滿)</li><li><b>以偏概全</b>(只涵蓋一部分,主旨題最愛)</li><li><b>偷換概念</b>(local↔foreign)</li><li><b>張冠李戴</b>(對的資訊安到錯的題)</li><li><b>絕對化</b>(only/all/never/must/completely)</li><li><b>硬湊因果</b>(兩件無關的事說成因果)</li></ol>
<h4>四、這科(旅遊觀光閱讀)命題特點</h4><ul><li><b>常考主題</b>:觀光經濟影響、永續/淨零、過度觀光、文化遺產、旅遊安全、旅宿趨勢。</li><li><b>超愛正反並陳</b>:先好處再壞處 → <b>「說死一邊」的選項幾乎必錯</b>,答案通常兩面兼顧。</li><li><b>學術詞不用怕</b>:考的是主旨/細節/態度,抓大意就能答。</li></ul>
<h4>五、卡關搶救</h4><ol><li>字義題不會 → 看<b>字根</b> + 上下文褒貶。</li><li>細節找不到 → 用<b>關鍵字/專有名詞/數字</b>回文掃。</li><li>兩選項難選 → 找有原文依據的,避開「絕對化」「文章沒提」。</li><li>時間不夠 → 主旨、字義題最快先搶;推論題擺最後。</li></ol>`},

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:觀光對地方的影響`,
  text:[`When people travel to other parts of the world, their footprints often leave effects on the visited places. One of the most immediate and visible effects brought by tourism onto local communities can be seen in the aspect of economic growth. Tourism is often a primary source of income for many regions, especially those rich in natural beauty, historical importance, or cultural heritage. When most tourists visit a location, they spend money on accommodation, food, transportation, and entertainment, all directly contributing to the local economy.`,`This influx of capital also creates many job opportunities, not only in tourism-related industries like hotels, restaurants, and travel agencies but also in other sectors that support tourism, such as construction and retail business. However, some negative effects also exist. For example, the economic benefits of tourism are not always equitably distributed. In some cases, the majority of profits go to large, foreign-owned companies, leaving local businesses and workers with only a small percentage of the generated income. In other cases, tourism leads to inflation and drives up the cost of living for local residents, particularly in areas where the demand for goods and services rises sharply during peak tourist seasons. Clearly, when promoting tourism, both the positive and negative effects must be taken into consideration.`],
  real:`🎧 這篇主題「觀光的正負面 / 永續觀光」是<b>導遊口試常見議題</b>。可準備:sustainable tourism(永續觀光)、overtourism(過度觀光)、carrying capacity(承載量)。`,
  vocab:[[`equitably (adv.)`,`ˈɛkwɪtəblɪ`,`公平地`],[`influx (n.)`,`ˈɪnflʌks`,`湧入`],[`inflation (n.)`,`ɪnˈfleʃən`,`通貨膨脹`],[`heritage (n.)`,`ˈhɛrətɪdʒ`,`(文化)遺產`],[`sustainable (adj.)`,`səˈstenəbl̩`,`永續的`],[`retail (n.)`,`ˈritel`,`零售`]]},

  ana:`<b>① 定位骨架</b>:首段談經濟成長(正面),第 2 段 <i>However</i> 轉折談 negative effects(負面),結論 both must be considered。<br><b>② 選項逐一辨析</b>:<table class="opta"><tr><td>(A) 規劃旅行</td><td><span class="no2">✗</span>　<b>文章沒提</b>「怎麼規劃」</td></tr><tr><td>(B) 觀光的好處</td><td><span class="no2">✗</span>　<b>以偏概全</b>:只涵蓋正面,漏了負面</td></tr><tr><td>(C) 觀光造成的影響</td><td><span class="ok2">✓ 正解</span>　正反面都涵蓋 = 全文</td></tr><tr><td>(D) 觀光開發訣竅</td><td><span class="no2">✗</span>　<b>偷換概念</b>:文章不是教學文</td></tr></table>`,
  skill:`<b>主旨題「涵蓋全文」原則</b>:看到文章有 <i>However / but</i> 轉折(正反並陳),標題就要「兩面都含」。B 這種「只對一半」的最愛騙人。`,

  zh:`下列敘述何者「不正確」?`,

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:觀光業邁向淨零碳排(較難)`,
  text:[`While progress towards decarbonisation has been made, this research highlights the diversity within the sector, differences in context as well as variety in commitments across industries and companies in Travel & Tourism. The sector must continue developing long-term strategies and targets consistent with the Paris Agreement and latest scientific recommendations, aligned to relevant national and international policies and strategies, to achieve net zero emissions goals. The analysis showed that 53% of the Travel & Tourism businesses analysed currently have publicly announced climate targets. Though many targets are not yet based on the latest science, it is promising to see that many businesses are currently in the process of revising and adapting their targets to reach standards like those set by SBTi, and many others, putting climate action much higher on their priority lists. Of course, key for monitoring this progress will also be the transparent sharing of these activities through more harmonised methodologies. Overall, the Travel & Tourism sector has made progress since the 2021 edition of Net Zero Roadmap but still needs to accelerate efforts to meet the 2050 target. More businesses have climate targets, but implementation and execution have been slower than what is needed. A strong volume recovery highlights the need for continued focus on decarbonisation, particularly in certain geographies experiencing strong growth. New target frameworks and net zero pathways have been established, but challenges remain in carbon data measurement, regulation, and infrastructure.`,`Moving forward, progress will depend on addressing various challenges, some common to all focus industries and some more specific to individual ones. These include emission measurement, especially Scope 3 emissions, the fragmented regulatory landscape, inconsistencies in reporting standards and insufficient budgets remains issues. Moreover, the special challenges for SMEs in the sector, which make up the majority of Travel & Tourism businesses, will require strong commitments from all stakeholders to increase collaboration and ensure inclusiveness.`,`There are clear opportunities for Travel & Tourism to achieve net zero in many areas and industries even before 2050. However, as businesses define their commitments based on their respective corridors, they will require support, particularly for those businesses with hard-to-abate emissions. As the sector pushes for the highest ambitions and an acceleration of climate action overall, it will have to join forces to strengthen the innovation needed for new technologies and alternative fuels to decouple Travel & Tourism growth rates from resource use and emissions for a net zero future. There is no doubt, time is of the essence and our actions of today define our world of tomorrow.`],
  real:`🎧 <b>永續 / 淨零觀光</b>是近年熱門議題。口試被問「觀光業如何減碳」可提:carbon footprint(碳足跡)、eco-friendly(環保)、renewable energy(再生能源)。`,
  vocab:[[`decarbonisation (n.)`,``,`去碳化、減碳`],[`net zero emissions`,``,`淨零排放`],[`climate target`,``,`氣候(減碳)目標`],[`fragmented (adj.)`,`ˈfræɡmɛntɪd`,`破碎的`],[`alternative fuels`,``,`替代燃料`],[`decouple (v.)`,`diˈkʌpl̩`,`脫鉤`]]},

  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
</body>
</html>
