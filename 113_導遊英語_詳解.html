  {kind:`passage`,
   label:`閱讀第 1 篇(第 71–75 題)· 主題:艋舺龍山寺`,
   text:[`Longshan Temple, built in 1738, is located in Wanhua, Taipei. It is one of Taipei's most famous and busiest temples and finest examples of Taiwan's historical, architectural, and artistic heritage. Due to natural disaster and damages caused by humans, the temple has been restored several times. Its trove includes priceless paintings, carvings, and other skilled work of great artistic value. It is regarded as one of the oldest and resplendent Buddhist temples in Taiwan.`,`In Longshan Temple, there are three halls lined up back to back with the main hall in the middle of the temple complex, and two covered galleries running down either side. In total, the modular space is composed of 11 units. The complex sports a classical hipped roof with double-eave style. The restored façade wall is constructed of stones hauled all the way from Mt. Guanyin on the north coast along the Tamsui River. As with many East Asian temples, it has three decorated gates, one inside the next. In the first courtyard is a waterfall stand, a point of ablution. Carved, richly painted dragons guard the entrances. The main hall was built with bronze dragons on right and left pillars symbolizing protections to the hall, and decorations of delicate sculptures, detailed wood carvings and gorgeous buddha statues settle in the main chamber with an explosion of brilliant color.`,`The temple is settled north facing south, worshipping the Guanshiyin Buddha and other divine spirits. Religious devotees, local believers, and general tourists come in great numbers, especially during the Lunar New Year period. It is an important place of worship and historical value.`],
   real:`🎧 <b>龍山寺</b>是導遊必考景點。口試可準備:Longshan Temple(龍山寺)、Guanyin / Guanshiyin(觀世音)、Buddhist temple(佛寺)、Lunar New Year(農曆新年)。`,
   vocab:[[`restore (v.)`,`rɪˈstɔr`,`修復、整修`],[`heritage (n.)`,`ˈhɛrətɪdʒ`,`遺產`],[`façade (n.)`,`fəˈsɑd`,`(建築)正面外牆`],[`hipped roof`,``,`廡殿頂(四坡屋頂)`],[`courtyard (n.)`,`ˈkɔrtˌjɑrd`,`庭院`],[`devotee (n.)`,`ˌdɛvəˈti`,`虔誠信徒`],[`resplendent (adj.)`,`rɪˈsplɛndənt`,`華麗的、輝煌的`]]},

  {kind:`passage`,
   label:`閱讀第 2 篇(第 76–80 題)· 主題:美食旅遊(culinary tourism)`,
   text:[`Culinary tourism is one of the hottest trends in travel. Simply put, culinary tourism is the act of traveling to find great food, which includes any experience where tourists learn about, appreciate, consume, or indulge in food or drinks that reflect the local culture. While some people travel to see historic sights or hit the road in search of boutiques and souvenirs, more and more people are getting bit by the culinary travel bug. It is not hard to see why; culinary tourism allows visitors to engage in a sensory, artistic expression of a destination's culture. Experts estimate interest in gastronomic tours will increase more than 16 percent a year for the next ten years.`,`Whether people plan to travel solely for delicious eats or just hope to pepper some delectable restaurants into their itinerary, culinary tourism is essential to modern travel. Culinary tourism isn't solely about tourists' food or the luxurious restaurants they splurge on. Instead, it's about eating adventurously and seeking out novel culinary experiences. The further the distance traveled, the more comprehensive the range of culinary opportunities.`,`Culinary tourism is a cornerstone of the modern travel industry. It directly contributes to both the hospitality industry and the overall economy. The development of food culture can help a tourist destination draw new visitors. Since food often reflects an entire nation's eating habits, culinary tourism can teach visitors valuable cultural lessons. Countries are often associated with particular foods—people will travel across the world to eat the best pizza in Italy or the best ramen in Japan. Every country and culture is an opportunity to try new and different foods. Culinary tourists are eager to learn more about different cultures through their foods.`,`Travel has been trending increasingly towards authentic experiences. A recent report from World Food Travel found that 81 percent of surveyed tourists believe that local food helps them understand the culture of their travel destination. Eighty-two percent admit to spending more on food while on vacation than at home. Eighty-three percent say food helps create a lasting impression of a country. People are more eager than ever to connect with the real roots of their visiting places. Food is always a significant aspect of any trip—no matter how tired tourists might be, they're going to sit down and have something to eat. And if they dine at a restaurant and enjoy local street food, they're likely to take photos and capture the experience to share with friends. Looking back on their trip, they'll never forget the food they tasted and the adventure surrounding it.`],
   real:`🎧 <b>美食旅遊</b>是導遊超實用主題。口試可提:culinary tourism / food tourism(美食旅遊)、local cuisine(在地料理)、authentic experience(道地體驗)、street food(街頭小吃)。`,
   vocab:[[`culinary (adj.)`,`ˈkʌlɪˌnɛri`,`烹飪的、飲食的`],[`indulge (v.)`,`ɪnˈdʌldʒ`,`盡情享受、沉溺`],[`gastronomic (adj.)`,`ˌɡæstrəˈnɑmɪk`,`美食的`],[`souvenir (n.)`,`ˈsuvəˌnɪr`,`紀念品`],[`splurge (v.)`,`splɝdʒ`,`揮霍、大手筆花費`],[`cornerstone (n.)`,`ˈkɔrnɚˌston`,`基石`],[`authentic (adj.)`,`ɔˈθɛntɪk`,`道地的、真實的`]]},
  {kind:`q`,no:76,type:`閱讀`,topic:`主旨 · 目的`,star:2,
   stem:`Which of the following best describes the purpose of this passage?`,
   zh:`下列何者最能描述本文的寫作目的?`,
   opts:[`To provide evidence showing how food is more important than the economy. 提供證據顯示食物比經濟更重要。`,`To demonstrate the significance of the travelers' culinary skills in cooking. 展示旅客烹飪技巧的重要性。`,`To interpret how authentic and well-cooked local foods may win tourists' hearts. 詮釋道地且烹調得宜的在地美食如何擄獲旅客的心。`,`To compromise the value of domestic food in popular travel destinations. 貶低熱門旅遊地在地食物的價值。`],

   ana:`<b>目的題 = 全文主旨</b>:全文都在講『在地美食如何吸引旅客、成為旅遊核心』→ (C)。<table class='opta'><tr><td>(A) 食物比經濟重要</td><td><span class='no2'>✗</span> 原文說美食『貢獻』經濟,非比較誰重要(偷換)</td></tr><tr><td>(B) 旅客的<b>烹飪技巧</b></td><td><span class='no2'>✗</span> 文章談『吃』不是旅客會不會『煮』(張冠李戴)</td></tr><tr><td>(C) 道地在地美食擄獲旅客</td><td><span class='ok2'>✓ 正解</span> 涵蓋全文主旨</td></tr><tr><td>(D) 貶低在地食物</td><td><span class='no2'>✗</span> 與全文『推崇美食旅遊』相反</td></tr></table>`,

   skill:`<b>true 題回文找數據</b>:題目 eighty percent → 定位 81%(local food → culture)= B;D『不貢獻經濟』與原文 both…economy 相反。`,
   vocab:[[`surveyed (adj.)`,``,`受訪的、被調查的`],[`connect (v.)`,`kəˈnɛkt`,`連結`]]},

   vocab:[[`refer to`,``,`指的是、提及`],[`root (n.)`,``,`根、根源`]]},
  {kind:`q`,no:79,type:`閱讀`,topic:`字義`,star:3,

   ana:`<div class='cite'>interest in <b>gastronomic</b> tours will increase …</div>gastronomic = 美食的、烹飪的 → Gourmet(美食的、講究吃的)。Anorexia(厭食症)/Carnivorous(肉食)/Fruitarian(果食)都只是飲食相關但非『美食』同義。`,
   skill:`<b>字義題</b>:gastronomic(美食的)= gourmet;別被同屬『飲食』的 Carnivorous/Fruitarian 干擾(語意範圍不同)。`,
   vocab:[[`gastronomic (adj.)`,``,`美食的、烹飪的`],[`gourmet (adj.)`,`ɡʊrˈme`,`美食的、講究飲食的`]]},

   zh:`根據本文,下列何者解釋了為何在地美食如此令人著迷?`,
   opts:[`The tourists, tired as they are, are going to sit down and have something to stop hunger. 旅客再累也會坐下來吃點東西止飢。`,`Tourists have chances to travel adventurously and seek out novel cultural experiences. 旅客有機會冒險旅行、尋求新奇的文化體驗。`,`Culinary tourists are eager to learn more about different cultures through their foods. 美食旅客渴望透過食物更了解不同文化。`,`Culinary tourism is solely spending lavishly on the food or the luxurious restaurants. 美食旅遊只是揮霍在食物或奢華餐廳上。`],
   ans:2,
   ana:`<div class='cite'>Culinary tourists are <b>eager to learn more about different cultures through their foods</b>.</div>在地美食令人著迷,是因為旅客渴望『透過食物認識不同文化』→ (C)。<table class='opta'><tr><td>(A) 累了坐下吃東西止飢</td><td><span class='no2'>✗</span> 只是『填飽肚子』,非『著迷』的原因</td></tr><tr><td>(B) 冒險旅行尋新體驗</td><td><span class='no2'>✗</span> 是旅遊態度,非『在地食物迷人』的直接原因</td></tr><tr><td>(C) 渴望透過食物認識文化</td><td><span class='ok2'>✓ 正解</span> 呼應全文『美食=認識文化的窗口』</td></tr><tr><td>(D) 只是揮霍在奢華餐廳</td><td><span class='no2'>✗</span> 原文明說『isn't solely about … luxurious restaurants』相反</td></tr></table>`,
   skill:`<b>因果題回主旨</b>:全文核心=『透過食物認識文化』;D 用 solely(只是)講奢華,原文正好否定(isn't solely)。`,
   note:`⚠️ 看到 solely/only 的選項先警覺;原文 isn't solely about luxurious restaurants → D 錯。`,

{kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`}

];

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en_leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
