<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>學習儀表板</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;
    --ok:#15904a;--okbg:#e5f6ec;--warn:#c98a12;--warnbg:#fdf3e0;--no:#c62a2a;--nobg:#fbe9e9;
    --teal:#0d9488;--tealbg:#e7f6f4;--grid:#e2e8f2;--hd1:#0f766e;--hd2:#0d9488;
    --chipv:#eef2ff;--chipvk:#3b4fd6;--chipd:#e8f7ee;--chipdk:#1f8a4c;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --ok:#5ad48a;--okbg:#173023;--warn:#f0b840;--warnbg:#3a2f13;--no:#ff8080;--nobg:#331a1a;
    --teal:#5eead4;--tealbg:#123230;--grid:#2b333f;--hd1:#0f766e;--hd2:#115e57;
    --chipv:#22284a;--chipvk:#9db0ff;--chipd:#16301f;--chipdk:#6fe0a0;
  }}
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.3rem} header p{margin:2px 0;opacity:.92;font-size:.83rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
  @media(min-width:560px){.grid4{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .stat .n{font-size:1.9rem;font-weight:800;color:var(--teal);line-height:1.1}
  .stat .l{font-size:.78rem;color:var(--sub);margin-top:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .panel h2{margin:0 0 4px;font-size:1.04rem;display:flex;align-items:center;gap:7px}
  .panel .hint{font-size:.78rem;color:var(--sub);margin:0 0 12px}
  .pass{text-align:center;padding:6px 0}
  .pass .big{font-size:2.4rem;font-weight:800;line-height:1.1}
  .pass .msg{font-size:.9rem;color:var(--sub);margin-top:6px}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow .name{width:120px;font-size:.84rem;flex-shrink:0;text-align:right}
  .bartrack{flex:1;background:var(--grid);border-radius:8px;height:20px;overflow:hidden;position:relative}
  .barfill{height:100%;border-radius:8px;transition:width .4s}
  .barrow .pct{width:74px;font-size:.82rem;flex-shrink:0;font-weight:700}
  .barrow .cnt{font-size:.72rem;color:var(--sub)}
  .lv-no{background:var(--no)} .lv-warn{background:var(--warn)} .lv-ok{background:var(--ok)}
  .empty{text-align:center;color:var(--sub);padding:50px 20px}
  .empty .ic{font-size:3rem} .empty h2{margin:8px 0;color:var(--ink);font-size:1.1rem}
  .empty a{display:inline-block;margin-top:12px;background:var(--teal);color:#fff;padding:10px 22px;border-radius:12px;text-decoration:none;font-weight:700}
  .curve{width:100%;height:auto;display:block}
  .lg{font-size:.75rem;color:var(--sub);display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .lg i{display:inline-block;width:11px;height:3px;vertical-align:middle;margin-right:4px}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:.88rem;text-decoration:none;font-family:inherit}
  .btn.pri{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
  .clr{color:var(--no);cursor:pointer;font-size:.78rem;background:none;border:1px solid var(--line);padding:5px 12px;border-radius:8px;font-family:inherit;margin-top:6px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .tab{border:1.4px solid var(--line);background:var(--card);color:var(--sub);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:.85rem;font-weight:700;font-family:inherit}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .note{font-size:.78rem;color:var(--sub);background:var(--tealbg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:12px 0}
  .mini{margin-left:8px;font-size:.76rem;color:var(--teal);text-decoration:none;font-weight:700;white-space:nowrap}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>📊 學習儀表板</h1>
  <p>模擬測驗成績追蹤 · 弱點分析 · 預估及格率</p>
</div></header>

<main class="wrap" id="app"></main>

<script>
const CNAME={leader:'領隊',guide:'導遊',all:'全部'};
const SUBJECTS=[
  {k:'en',name:'英語',wb:'wrongbook_en',page:'錯題本.html'},
  {k:'jp',name:'日語',wb:'wrongbook_jp',page:'日文錯題本.html'},
  {k:'gh',name:'觀光',wb:'wrongbook_gh',page:'觀光錯題本.html'},
  {k:'pr',name:'執業實務',wb:'wrongbook_pr',page:'執業實務錯題本.html'},
  {k:'pr2',name:'執業法規',wb:'wrongbook_pr2',page:'執業法規錯題本.html'}
];
const app=document.getElementById('app');
const PASS=75; // 答對率參考線 75%(各科題數不同,取通用比率)
let subjFilter='all'; // all | en | gh | pr | pr2
function hLoad(){try{return JSON.parse(localStorage.getItem('quiz_history')||'[]');}catch(e){return[];}}
function wbCount(key){try{return Object.keys(JSON.parse(localStorage.getItem(key)||'{}')).length;}catch(e){return 0;}}
function subjName(k){const s=SUBJECTS.find(x=>x.k===k);return s?s.name:'';}
function lv(p){return p<50?'no':p<70?'warn':'ok';}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function tabsHtml(){
  return `<div class="tabs">`+[{k:'all',name:'全部'}].concat(SUBJECTS).map(s=>
    `<button class="tab${subjFilter===s.k?' on':''}" data-k="${s.k}">${s.name}</button>`).join('')+`</div>`;
}
function bindTabs(){app.querySelectorAll('.tab').forEach(b=>{b.onclick=()=>{subjFilter=b.dataset.k;render();window.scrollTo({top:0,behavior:'smooth'});};});}
function wbPanel(counts,total){
  if(!total)return '';
  const max=Math.max(1,...SUBJECTS.map(s=>counts[s.k]));
  return `<div class="panel"><h2>📌 錯題本分布</h2>
    <p class="hint">四科錯題本共 <b>${total}</b> 題,點各科去複習</p>
    ${SUBJECTS.map(s=>`<div class="barrow"><span class="name">${s.name}</span>
      <div class="bartrack"><div class="barfill ${counts[s.k]?'lv-no':'lv-ok'}" style="width:${Math.round(counts[s.k]/max*100)}%"></div></div>
      <span class="pct">${counts[s.k]} 題</span>${counts[s.k]?`<a class="mini" href="${s.page}">複習›</a>`:''}</div>`).join('')}
  </div>`;
}

function render(){
  const allHist=hLoad();
  const hist = subjFilter==='all' ? allHist : allHist.filter(h=>h.subj===subjFilter);
  const wbCounts={};let wbTotal=0;SUBJECTS.forEach(s=>{const c=wbCount(s.wb);wbCounts[s.k]=c;wbTotal+=c;});
  const legacyN=allHist.filter(h=>!h.subj).length;
  const tabs=tabsHtml();

  if(!hist.length){
    app.innerHTML=tabs+`<div class="empty"><div class="ic">📈</div>
      <h2>${subjFilter==='all'?'還沒有測驗記錄':'這一科還沒有測驗記錄'}</h2>
      <p>到<b>模擬測驗</b>${subjFilter==='all'?'':'選「'+subjName(subjFilter)+'」'}做幾組,這裡就會出現成績趨勢、弱點分析和預估及格率。</p>
      <a href="模擬測驗.html">📝 去做模擬測驗</a></div>`+wbPanel(wbCounts,wbTotal);
    bindTabs();return;
  }
  const totalQ=hist.reduce((s,h)=>s+h.total,0);
  const totalC=hist.reduce((s,h)=>s+h.correct,0);
  const avg=Math.round(totalC/totalQ*100);
  const last5=hist.slice(-5);
  const avg5=Math.round(last5.reduce((s,h)=>s+h.correct/h.total,0)/last5.length*100);
  const T={},Y={};
  hist.forEach(h=>{
    for(const k in (h.byTopic||{})){T[k]=T[k]||{ok:0,n:0};T[k].ok+=h.byTopic[k].ok;T[k].n+=h.byTopic[k].n;}
    for(const k in (h.byType||{})){Y[k]=Y[k]||{ok:0,n:0};Y[k].ok+=h.byType[k].ok;Y[k].n+=h.byType[k].n;}
  });
  const topics=Object.keys(T).map(k=>({name:k,ok:T[k].ok,n:T[k].n,p:Math.round(T[k].ok/T[k].n*100)})).sort((a,b)=>a.p-b.p);
  const types=Object.keys(Y).map(k=>({name:k,ok:Y[k].ok,n:Y[k].n,p:Math.round(Y[k].ok/Y[k].n*100)})).sort((a,b)=>a.p-b.p);

  const passMsg = avg5>=PASS ? '🎉 近期已達及格水準,穩住手感!' : avg5>=PASS-12 ? '👍 接近及格,再攻弱點主題就穩了' : '💪 還需加強,先從下方紅色弱點主題練起';
  const passColor = avg5>=PASS?'var(--ok)':avg5>=PASS-12?'var(--warn)':'var(--no)';
  const topStat = subjFilter==='all'?wbTotal:wbCounts[subjFilter];
  const scope = subjFilter==='all'?'':' · '+subjName(subjFilter);

  app.innerHTML=tabs+`
    ${subjFilter==='all'&&legacyN?`<p class="note">ℹ️ 有 ${legacyN} 筆較早的紀錄未分科(只在「全部」顯示);之後的測驗會自動依科目分類。</p>`:''}
    <div class="grid4">
      <div class="stat"><div class="n">${hist.length}</div><div class="l">測驗次數</div></div>
      <div class="stat"><div class="n">${totalQ}</div><div class="l">總作答題數</div></div>
      <div class="stat"><div class="n">${avg}%</div><div class="l">總平均答對率</div></div>
      <div class="stat"><div class="n">${topStat}</div><div class="l">${subjFilter==='all'?'錯題總數':'本科錯題'}</div></div>
    </div>

    <div class="panel">
      <h2>🎯 預估及格率</h2>
      <p class="hint">答對率參考線 75%,以下為<b>近 5 次</b>模擬平均${scope}</p>
      <div class="pass"><div class="big" style="color:${passColor}">${avg5}%</div>
        <div class="msg">${passMsg}</div></div>
    </div>

    <div class="panel">
      <h2>📈 成績趨勢</h2>
      <p class="hint">近 ${Math.min(hist.length,20)} 次答對率(虛線 = 參考線 75%)${scope}</p>
      ${curveSVG(hist)}
      <div class="lg"><span><i style="background:var(--teal)"></i>你的成績</span><span><i style="background:var(--no)"></i>參考線 75%</span></div>
    </div>

    <div class="panel">
      <h2>🔍 弱點主題</h2>
      <p class="hint">各主題累計答對率(由弱到強,<b style="color:var(--no)">紅色最該加強</b>)${subjFilter==='all'?' · 四科混合,點上方分頁看單科':''}</p>
      ${topics.length?topics.map(t=>bar(t.name,t.p,t.ok,t.n)).join(''):'<p class="hint">此範圍尚無資料</p>'}
    </div>

    <div class="panel">
      <h2>📚 題型正確率</h2>
      ${types.length?types.map(t=>bar(t.name,t.p,t.ok,t.n)).join(''):'<p class="hint">此範圍尚無資料</p>'}
    </div>

    ${wbPanel(wbCounts,wbTotal)}

    <div class="acts"><a class="btn pri" href="模擬測驗.html">📝 再測一組</a>
      <a class="btn" href="資料備份.html">💾 備份 / 還原</a>
      <button class="clr" id="clrBtn">🗑️ 清除測驗記錄</button></div>`;

  bindTabs();
  let arm=false;
  const cb=document.getElementById('clrBtn');
  if(cb)cb.onclick=function(){
    if(!arm){arm=true;this.textContent='⚠️ 確定清除全部測驗記錄?(錯題本不受影響)';setTimeout(()=>{arm=false;this.textContent='🗑️ 清除測驗記錄';},3000);return;}
    localStorage.removeItem('quiz_history');subjFilter='all';render();
  };
}
function bar(name,p,ok,n){
  return `<div class="barrow"><span class="name">${esc(name)}</span>
    <div class="bartrack"><div class="barfill lv-${lv(p)}" style="width:${p}%"></div></div>
    <span class="pct">${p}% <span class="cnt">(${ok}/${n})</span></span></div>`;
}
function curveSVG(hist){
  const pts=hist.slice(-20).map(h=>Math.round(h.correct/h.total*100));
  const W=600,H=170,padL=30,padR=12,padT=14,padB=22;
  const n=pts.length;
  const x=i=>padL+(n<=1?0:i*(W-padL-padR)/(n-1));
  const y=v=>padT+(100-v)/100*(H-padT-padB);
  const path=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const gy=[0,25,50,75,100].map(v=>`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-5}" y="${y(v)+3}" font-size="10" fill="var(--sub)" text-anchor="end">${v}</text>`).join('');
  const passLine=`<line x1="${padL}" y1="${y(PASS)}" x2="${W-padR}" y2="${y(PASS)}" stroke="var(--no)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const dots=pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="var(--teal)"/>`).join('');
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    ${gy}${passLine}
    <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}</svg>`;
}
render();
</script>
</body>
</html>
