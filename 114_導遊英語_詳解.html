  {kind:`passage`,
   label:`閱讀第 1 篇(第 71–75 題)· 主題:永續觀光的治理與策略`,
   text:[`Governments took exceptional measures to support tourism as recent crises raised awareness of the sector's importance as an economic and social force. The strong recovery is providing a new wakeup call for governments and the sector as a whole, as destinations struggle to manage demand and the impacts on the environment and local communities. This is putting pressure on the social license for tourism and has highlighted the need to rebalance the impacts, understand the trade-offs and manage tourism sustainably, so the benefits outweigh the costs. At the same time, tourism offers untapped potential for many people, businesses, and places.`,`Governments, at all levels, have a role to play in shaping tourism development to respond to these challenges, capitalize on opportunities, and deliver better outcomes. Many countries have updated or developed tourism strategies to reflect the post-pandemic context and priorities. These strategies look to build on recent momentum to shift to more sustainable models of tourism, to adapt to an increasingly dynamic environment and engage stakeholders around a common vision for the future of the sector. Diversifying the tourism offer and attracting new source markets and segments to emerging destinations and outside of peak periods underpins many tourism strategies, to better spread the benefits and tourist flows. Significant investments are needed to reduce the environmental impact of tourism activities, while adapting to the impacts from climate change. Tourism destinations and businesses need support to keep pace with rapid technological developments, while resources are also required to develop the transport and other infrastructure needed to better manage tourism development. Boosting the capacity of the sector to attract, retain and develop a strong and sustainable workforce is a further area of ongoing focus.`,`However, implementation remains an issue and there is a risk that tourism slips down national policy agendas as the sector returns to pre-pandemic levels and growth paths. Effective governance practices and co-ordinated policy action are needed to deliver on these ambitions, supported by sufficient resources at national, regional, and local level. Action at destination level has an increasingly important role to play in driving momentum for change, guided by an overarching national vision for the future of tourism that in turn considers local needs and priorities, and supported by effective co-ordination mechanisms across levels of government. More granular, timely and robust evidence is also needed to manage and track progress on potential trade-offs, determine “what works” and identify emerging policy impacts and risks, as well as the costs of inaction.`],
   real:`🎧 <b>永續觀光治理</b>是政策型議題。口試可提:sustainable tourism(永續觀光)、stakeholders(利害關係人)、overtourism(過度觀光)、trade-offs(取捨)。本篇偏政策文,抓『政府需有效治理、把觀光管得永續』主旨即可。`,
   vocab:[[`sustainable (adj.)`,`səˈstenəbl̩`,`永續的`],[`stakeholder (n.)`,`ˈstekˌholdɚ`,`利害關係人`],[`trade-off (n.)`,``,`取捨、權衡`],[`governance (n.)`,`ˈɡʌvɚnəns`,`治理`],[`momentum (n.)`,`moˈmɛntəm`,`動能、氣勢`],[`infrastructure (n.)`,`ˈɪnfrəˌstrʌktʃɚ`,`基礎建設`],[`granular (adj.)`,`ˈɡrænjəlɚ`,`細緻的、細粒度的`]]},

  {kind:`passage`,
   label:`閱讀第 2 篇(第 76–80 題)· 主題:AI 在飯店服務業的應用(較難)`,
   text:[`In the fast-paced and highly competitive world of hospitality, where customer expectations are sky-high, the industry faces a multitude of challenges. These obstacles can appear overwhelming, from the need to tailor experiences to effectively managing operations in the face of constantly shifting demand. However, the advent of Artificial Intelligence (AI) marks the dawn of a new era, offering promising solutions with the potential to tackle these challenges head-on. AI is poised to automate processes, boost efficiency, and elevate decision-making in the industry by emulating human intelligence.`,`The hospitality industry, which encompasses hotels, resorts, restaurants, and travel services, faces unique challenges in meeting the ever-increasing expectations of modern guests. With the rise of online booking platforms, social media, and review sites, guests have become more discerning and demanding. They expect personalized experiences, seamless interactions, and efficient services. This is where AI can play a vital role in transforming the hospitality industry.`,`AI's remarkable capacity to analyze vast datasets, forecast trends, and make intelligent decisions is fundamentally reshaping how hospitality businesses operate. AI solutions have the potential to enhance guest services, optimize operations, and improve security and safety within the hospitality sector. By leveraging AI technologies, hotels and other hospitality establishments can provide personalized recommendations to guests based on their preferences, automate routine tasks through virtual assistants and chatbots, and implement voice recognition systems for seamless control of room amenities. By harnessing the power of AI, organizations can now streamline operations for maximum efficiency, and fortify security measures to an unprecedented degree. Additionally, AI can contribute to revenue management through dynamic pricing strategies, facilitate predictive maintenance to minimize downtime and provide valuable insights through data analytics for better decision-making. As per IndustryARC, the travel and hospitality AI Market is projected to exceed the $1.2 billion milestone by 2026, with an expected Compound Annual Growth Rate (CAGR) of over 9.7% throughout the forecast period from 2021 to 2026.`,`Yet, this is merely the tip of the iceberg. A wealth of insights and discoveries await us as we delve deeper into the role of artificial intelligence in the hospitality industry. This article discusses AI use cases in hospitality, the benefits of AI in the industry, future trends and some real-world examples.`],
   real:`🎧 <b>AI 與觀光服務業</b>是新興熱門題。口試可提:artificial intelligence(人工智慧)、personalized service(個人化服務)、chatbot(聊天機器人)、efficiency(效率)。`,
   vocab:[[`hospitality (n.)`,`ˌhɑspɪˈtæləti`,`服務業、款待`],[`multitude (n.)`,`ˈmʌltəˌtud`,`眾多`],[`tailor (v.)`,`ˈtelɚ`,`量身打造`],[`leverage (v.)`,`ˈlɛvərɪdʒ`,`善用、運用`],[`discerning (adj.)`,`dɪˈsɝnɪŋ`,`有眼光的、挑剔的`],[`seamless (adj.)`,`ˈsimlɪs`,`無縫的、順暢的`],[`streamline (v.)`,`ˈstrimˌlaɪn`,`精簡、使流暢`]]},

{kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},
{kind:`strategy`,title:`📖 閱讀解題技巧總攻略`,html:`<h4>📖 閱讀口訣(先背這個)</h4><ul><li><b>選對答案</b>:「<b>回文定位,換句話說</b>」</li><li><b>八大陷阱</b>:「<b>反、沒、過、偏、換、張、絕、湊</b>」(相反/沒提/過度推論/以偏概全/偷換概念/張冠李戴/絕對化/硬湊因果)</li><li><b>推論題</b>:「<b>不找對的,先刪錯的</b>」</li></ul><h4>一、開考戰術(時間 &amp; 順序)</h4><ol><li><b>閱讀擺最後寫</b>:前 70 題字彙/對話先秒殺,留 15–20 分給 2 篇(每篇約 8 分)。</li><li><b>先讀題目、再讀文章</b>:帶問題找答案,別先逐字精讀。</li><li><b>細節題按文章順序出</b>:第 1 題答案多在前段、最後題在後段。</li><li><b>略讀骨架</b>:首段 + 每段第一句 + 結論 = 全文主旨。</li></ol>
<h4>二、六大題型速查</h4><table><tr><th>題型</th><th>題目長相</th><th>破解法</th></tr><tr><td><b>主旨/標題</b></td><td>title / mainly about</td><td>選涵蓋全文;太窄太寬都刪</td></tr><tr><td><b>細節</b></td><td>According to / Why / What</td><td>關鍵字回文;答案是原文換句話說</td></tr><tr><td><b>NOT 題</b></td><td>NOT true / EXCEPT</td><td>先圈 NOT!選與原文矛盾/沒出現的</td></tr><tr><td><b>推論</b></td><td>inferred / imply</td><td>刪 4 種雷;選溫和有依據的</td></tr><tr><td><b>字義</b></td><td>the word "X" means</td><td>代入原句 + 字根 + 上下文褒貶</td></tr><tr><td><b>目的/態度</b></td><td>purpose / tone</td><td>看作者立場;語氣太偏必錯</td></tr></table>
<h4>三、干擾選項 8 大陷阱</h4><ol><li><b>與原文相反</b>(回文一比就露餡)</li><li><b>文章沒提</b>(無中生有:政府、政策…)</li><li><b>過度推論</b>(outweigh/best/most 講太滿)</li><li><b>以偏概全</b>(只涵蓋一部分,主旨題最愛)</li><li><b>偷換概念</b>(local↔foreign)</li><li><b>張冠李戴</b>(對的資訊安到錯的題)</li><li><b>絕對化</b>(only/all/never/must/completely)</li><li><b>硬湊因果</b>(兩件無關的事說成因果)</li></ol>
<h4>四、這科(旅遊觀光閱讀)命題特點</h4><ul><li><b>常考主題</b>:觀光經濟影響、永續/淨零、過度觀光、文化遺產、旅遊安全、旅宿趨勢。</li><li><b>超愛正反並陳</b>:先好處再壞處 → <b>「說死一邊」的選項幾乎必錯</b>,答案通常兩面兼顧。</li><li><b>學術詞不用怕</b>:考的是主旨/細節/態度,抓大意就能答。</li></ul>
<h4>五、卡關搶救</h4><ol><li>字義題不會 → 看<b>字根</b> + 上下文褒貶。</li><li>細節找不到 → 用<b>關鍵字/專有名詞/數字</b>回文掃。</li><li>兩選項難選 → 找有原文依據的,避開「絕對化」「文章沒提」。</li><li>時間不夠 → 主旨、字義題最快先搶;推論題擺最後。</li></ol>`}

];

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';el.id='q'+item.no;
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
(function(){function go(){var h=location.hash;if(!/^#q\d+$/.test(h))return;var c=document.getElementById(h.slice(1));if(!c)return;c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){c.classList.remove('hl');},2400);}window.addEventListener('hashchange',go);setTimeout(go,300);})();
</script>
