<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<title>我的收藏</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;
    --hd1:#92400e;--hd2:#b45309;--star:#e8a72b;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --hd1:#5c3410;--hd2:#7a4712;--star:#f0b840;
  }}
  :root[data-theme="dark"]{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;
    --hd1:#5c3410;--hd2:#7a4712;--star:#f0b840;
  }
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.28rem} header p{margin:2px 0;opacity:.92;font-size:.82rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .bar .wrap{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .schip{border:1.3px solid var(--line);background:var(--card);color:var(--sub);padding:4px 12px;border-radius:16px;cursor:pointer;font-size:.82rem;font-family:inherit;font-weight:600}
  .schip.on{background:var(--hd2);color:#fff;border-color:var(--hd2)}
  .cnt{font-size:.8rem;color:var(--sub);margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:11px 0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .chead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
  .tag{font-size:.72rem;font-weight:700;color:#fff;border-radius:12px;padding:2px 9px}
  .src{font-size:.72rem;color:var(--sub);font-weight:700}
  .rm{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:2px 9px;cursor:pointer;font-size:.74rem;font-family:inherit}
  .rm:hover{color:#c62a2a;border-color:#c62a2a}
  .stem{font-size:.95rem}
  .go{display:inline-block;margin-top:7px;font-size:.8rem;color:var(--accent);font-weight:700;text-decoration:none}
  .empty{text-align:center;color:var(--sub);padding:50px 16px}
  .empty .ic{font-size:2.8rem}
  .empty b{color:var(--star)}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="prefs.js"></script>
<script src="fav.js"></script>
<script src="pwa.js" defer></script>
<script src="bank.js"></script>
<script src="gh.js"></script>
<script src="pr.js"></script>
<script src="pr2.js"></script>
<script src="jp.js"></script>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>⭐ 我的收藏</h1>
  <p>各科詳解頁點 ☆ 收藏的題目 · 跨科集中複習</p>
</div></header>

<div class="bar"><div class="wrap" id="subs"></div></div>

<main class="wrap" id="list"></main>

<script>
const CNAME={leader:'領隊',guide:'導遊'};
const META={
  en: {name:'英語', color:'#2563eb', bank:()=>(typeof BANK!=='undefined'?BANK:null),     page:q=>`英語詳解.html?cert=${q.c}&year=${q.y}#q${q.no}`},
  jp: {name:'日語', color:'#e11d48', bank:()=>(typeof JPBANK!=='undefined'?JPBANK:null), page:q=>`日文詳解.html?cert=${q.c}&year=${q.y}`},
  gh: {name:'觀光', color:'#0d9488', bank:()=>(typeof GHBANK!=='undefined'?GHBANK:null), page:q=>`觀光複習.html?cert=${q.c}&year=${q.y}`},
  pr: {name:'執業實務', color:'#b45309', bank:()=>(typeof PRBANK!=='undefined'?PRBANK:null), page:q=>`執業實務複習.html?cert=${q.c}&year=${q.y}`},
  pr2:{name:'執業法規', color:'#7c3aed', bank:()=>(typeof PR2BANK!=='undefined'?PR2BANK:null),page:q=>`執業法規複習.html?cert=${q.c}&year=${q.y}`}
};
const ORDER=['en','jp','gh','pr','pr2'];
let filter='all';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function findQ(subj,c,y,no){const m=META[subj];if(!m)return null;const b=m.bank();if(!b)return null;
  return b.find(q=>q.c===c&&String(q.y)===String(y)&&+q.no===+no)||null;}
function items(){
  const o=FAV.load();
  return Object.keys(o).map(id=>{const e=o[id];const q=findQ(e.subj,e.c,e.y,e.no);return {id,e,q};})
    .filter(x=>x.q)
    .sort((a,b)=>(b.e.ts||0)-(a.e.ts||0));   // 新收藏在前
}
function buildSubs(){
  const all=items(),cnt={};ORDER.forEach(k=>cnt[k]=0);all.forEach(x=>{cnt[x.e.subj]=(cnt[x.e.subj]||0)+1;});
  let h=`<button class="schip ${filter==='all'?'on':''}" data-k="all">全部 (${all.length})</button>`;
  ORDER.forEach(k=>{if(cnt[k])h+=`<button class="schip ${filter===k?'on':''}" data-k="${k}">${META[k].name} (${cnt[k]})</button>`;});
  h+=`<span class="cnt" id="cnt"></span>`;
  document.getElementById('subs').innerHTML=h;
}
function render(){
  buildSubs();
  let arr=items(); if(filter!=='all')arr=arr.filter(x=>x.e.subj===filter);
  const list=document.getElementById('list');
  if(!items().length){
    list.innerHTML=`<div class="empty"><div class="ic">⭐</div>
      <h3>還沒有收藏的題目</h3>
      <p>到各科<b>詳解 / 複習</b>頁,點題目旁的 <b>☆</b> 就能收藏,<br>把想反覆看的重點題集中在這裡。</p></div>`;
    return;
  }
  list.innerHTML=arr.map(({id,e,q})=>{
    const m=META[e.subj];
    const stem=String(q.stem).replace('__BLANK__','（　）');
    return `<div class="card" data-id="${esc(id)}">
      <div class="chead"><span class="tag" style="background:${m.color}">${m.name}</span>
        <span class="src">${CNAME[q.c]||q.c} ${q.y} 年 第 ${q.no} 題</span>
        <button class="rm" data-rm="${esc(id)}">✕ 取消收藏</button></div>
      <div class="stem">${esc(stem)}</div>
      <a class="go" href="${m.page(q)}">看完整詳解 ›</a>
    </div>`;
  }).join('');
}
document.getElementById('subs').addEventListener('click',e=>{const b=e.target.closest('.schip');if(!b)return;filter=b.dataset.k;render();});
document.getElementById('list').addEventListener('click',e=>{
  const r=e.target.closest('[data-rm]');if(!r)return;
  const o=FAV.load();delete o[r.dataset.rm];FAV.save(o);render();
});
render();
</script>
</body>
</html>
