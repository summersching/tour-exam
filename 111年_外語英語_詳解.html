 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:無人機外送(阿里巴巴 Ele.me)`,
  text:[`It's noon. You're starving, and you need some food now—right now. Back in the old days, if you ordered some delivery, that food might come from a driver or bicycle delivery person. But this is the age of the drone. Therefore, your takeaway might not come with a knock at the door, but with a drone hovering outside your window.`,`Drone delivery hasn't advanced to the point that it will fly up to your 14th floor office window, but in Shanghai's Jinshan Industrial Park, drone delivery has already started. There, online retail giant Alibaba directs the service through its Ele.me food delivery brand. Drones fly along 17 specific routes. Customers can order from any one of 100 restaurants operating in the park. After the order is received and made, a member of the restaurant staff places the meal in the drone. It then flies to a delivery point nearest the customer. It is then picked up by an Alibaba employee and carried the rest of the way.`,`All of this takes just 20 minutes. Ele.me says the drone delivery method greatly reduces operating costs. If it's faster and cheaper, what's not to love about flying food?`],
  real:`科技類文章(無人機外送)是新趨勢題。重點:<b>drone</b>=無人機(unmanned plane);阿里巴巴 Ele.me 在上海金山園區試辦,無人機沿 17 條固定路線飛,但<b>最後一哩仍需真人(Alibaba 員工)接手送達</b>——這是常見陷阱(不是全程無人)。誘因是「更快、更便宜、降低營運成本」。帶團介紹智慧城市/科技應用時可用。`,
  vocab:[[`drone (n.)`,`dron`,`無人機`],[`hovering (adj.)`,`ˈhʌvərɪŋ`,`盤旋的`],[`takeaway (n.)`,`ˈtekəˌwe`,`外帶餐`],[`retail giant`,``,`零售巨頭`],[`operating cost`,``,`營運成本`],[`route (n.)`,`rut`,`路線`]]},

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:疫後觀光產業的趨勢`,
  text:[`Safety & hygiene tourism trends Whether it is airlines, cruises, hotels, restaurants or bars, since the outbreak of COVID-19, safety and hygiene standards have been absolutely paramount. With this in mind, there are a number of tourism trends that are related to this, such as increased cleaning, socially distanced seating, providing hand gel and enforcing masks in some settings. This is also now a vital part of tourism marketing, with companies needing to make clear what their hygiene and safety policies are and what measures they are taking to keep customers safe. The threat of COVID-19 has meant people are more reluctant to travel and visit tourism hot spots, so they will need to be persuaded that it is safe.`,`Shift from international to local The various travel restrictions and the reluctance of many people to travel abroad has meant many in the tourism industry are having to focus on local customers, rather than international ones. This does not mean giving up on international travelers entirely, but it is likely to require a change in your core marketing strategies. With hotels, it could be best to highlight the kinds of facilities that may appeal to the local market, such as your restaurant, your gym facilities, your Wi-Fi and even the fact that your hotel rooms are ideal for remote work. Airlines and tourism management companies may also need to shift gears to domestic tourists. It is worth remembering that local customers are less likely to cancel too, as they will only have to pay attention to local restrictions and are not as likely to have to quarantine after their visit.`,`Virtual reality tourism trends Virtual reality is another of the major tourism trends disrupting the industry and capitalizing on the technology can give you an edge over rivals who have not yet adopted it. Through online VR tours, customers can experience hotel interiors, restaurant interiors, outdoor tourist attractions and more, all from their home. Importantly, they are able to do this at the decision-making phase of the customer journey. This can then be the difference between customers completing a booking or backing out, and VR is especially useful within the context of COVID-19, where customers may have second thoughts and may need extra encouragement to press ahead with their plans.`],
  real:`疫後觀光趨勢是熱門考題,帶團行銷也用得到。三大趨勢:<b>①安全衛生(safety & hygiene)</b>——清潔加強、梅花座、口罩,並成為行銷重點;<b>②國際轉在地(shift to local)</b>——因旅遊限制與隔離顧慮,主攻本地客(本地客較不會取消);<b>③虛擬實境(VR)</b>——線上看飯店/景點,在「決定階段」促成訂房,勝過對手。口試被問疫情如何改變旅遊業,用這三點回答很完整。`,
  vocab:[[`hygiene (n.)`,`ˈhaɪdʒin`,`衛生`],[`paramount (adj.)`,`ˈpærəˌmaʊnt`,`至關重要的`],[`reluctant (adj.)`,`rɪˈlʌktənt`,`不情願的`],[`quarantine (n.)`,`ˈkwɔrənˌtin`,`隔離`],[`virtual reality`,``,`虛擬實境`],[`edge (n.)`,`ɛdʒ`,`優勢`]]},

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en_leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
</body>
</html>
