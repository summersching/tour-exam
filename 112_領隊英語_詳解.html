const DATA = [
 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`q`,no:1,type:`對話`,topic:`機艙`,star:2,
  stem:`Flight attendant: Sir, please switch off your mobile phone as we are about to __BLANK__.`,
  zh:`空服員:先生,我們即將<b>起飛</b>,請關閉手機。`,
  opts:[`get rid of 擺脫`,`put off 拖延`,`remove 移除`,`takeoff 起飛`],ans:3,
  ana:`「即將…(關手機)」→「起飛」<b>takeoff</b>(飛機起飛,about to takeoff)。get rid of/put off/remove 不合。`,
  note:`⚠️ takeoff 當名詞(起飛);take off 當動詞片語(起飛;脫下)。`,
  skill:`💡 <b>情境鎖</b>:關手機 + 即將 → takeoff(起飛)。`,
  vocab:[[`takeoff (n.)`,``,`起飛`],[`switch off`,``,`關閉`],[`flight attendant`,``,`空服員`]]},

 {kind:`q`,no:2,type:`字彙`,topic:`機艙`,star:2,

 {kind:`q`,no:3,type:`對話`,topic:`機艙`,star:2,
  stem:`Flight attendant: Don't inflate your life __BLANK__ until you've left the plane in case of emergency.`,

 {kind:`q`,no:4,type:`文法`,topic:`機艙`,star:2,
  stem:`Please remain __BLANK__ until the "fasten seat belt" sign is switched off and the aircraft has come to a complete stop.`,
  zh:`請保持<b>坐著</b>,直到「繫安全帶」燈號熄滅且飛機完全停妥。`,

  gram:`📝 remain / stay / keep + 形容詞(seated 已就座的),不接動詞原形或名詞。`,

  vocab:[[`seated (adj.)`,`ˈsitɪd`,`就座的`],[`fasten (v.)`,`ˈfæsn̩`,`繫緊`],[`aircraft (n.)`,`ˈɛrˌkræft`,`飛機`]]},

 {kind:`q`,no:5,type:`文法`,topic:`機場`,star:3,
  stem:`Could you please tell me where __BLANK__?`,
  zh:`可以告訴我登機門<b>在哪裡</b>嗎?`,
  opts:[`has the departure gate`,`is the departure gate`,`the departure gate has`,`the departure gate is`],ans:3,
  ana:`間接問句(tell me where …)要用「主詞 + 動詞」正常語序 → where <b>the departure gate is</b>。倒裝(is/has the departure gate)為直接問句語序,錯。`,
  gram:`📝 <b>間接問句</b>:主句 + where/what/how + <u>主詞 + 動詞</u>(不倒裝)。Where is it? → tell me where it is.`,
  skill:`💡 <b>文法陷阱</b>:tell me / know + where → 後面不倒裝(the gate is,不是 is the gate)。`,
  vocab:[[`departure gate`,``,`登機門`],[`indirect question`,``,`間接問句`],[`departure (n.)`,`dɪˈpɑrtʃɚ`,`出發`]]},

 {kind:`q`,no:6,type:`對話`,topic:`行李`,star:2,
  stem:`A: Excuse me, I can't find my baggage.　B: Do you have your __BLANK__ tag?`,
  zh:`A:不好意思,我找不到行李。　B:你有<b>行李領取</b>牌嗎?`,
  opts:[`claim 領取`,`hash 井號`,`page 頁`,`price 價格`],ans:0,
  ana:`「找不到行李 + ___ tag」→「行李領取牌」baggage <b>claim</b> tag。hash/page/price 不合。`,
  skill:`💡 <b>搭配</b>:baggage claim tag(行李領取牌)。`,
  vocab:[[`claim tag`,``,`領取牌`],[`baggage (n.)`,`ˈbæɡɪdʒ`,`行李`],[`claim (v.)`,`klem`,`領取`]]},

 {kind:`q`,no:7,type:`對話`,topic:`購物`,star:2,
  stem:`A: __BLANK__　B: By credit card.`,
  zh:`A:<b>您想怎麼付款?</b>　B:用信用卡。`,
  opts:[`Could I have a receipt? 我能要收據嗎?`,`How would you like to pay? 您想怎麼付款?`,`Is that before or after tax? 那是稅前還稅後?`,`Where's the cashier? 收銀台在哪?`],ans:1,
  ana:`B 答「用信用卡(By credit card)」→ 反推 A 問「怎麼付款」<b>How would you like to pay?</b>。收據/稅/收銀台不對應。`,
  skill:`💡 <b>反推法</b>:答「付款方式」→ 問句必是「how to pay」。`,
  vocab:[[`credit card`,``,`信用卡`],[`receipt (n.)`,`rɪˈsit`,`收據`],[`cashier (n.)`,`kæˈʃɪr`,`收銀員`]]},

 {kind:`q`,no:8,type:`字彙`,topic:`行李`,star:2,
  stem:`Normally, checked baggage will be delivered to the __BLANK__ after the flight arrives, depending on the priority and the position of baggage.`,
  zh:`通常班機抵達後,託運行李會送到<b>行李轉盤</b>,順序視優先級和行李位置而定。`,

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:綠色消費者與綠色行銷`,
  text:[`Global warming and environmental problems raise people's environmental concerns and increase their environmental responsibility in their buying. Countries all over the world are increasingly emphasizing environmental conservation matters. Green consumers are those who are aware of and interested in environmental issues. They support businesses that run in environmentally friendly ways. In addition, green consumers are also concerned about how green the products they bought are. Green products are products that are non-toxic, made from recycled materials, or minimally packaged. In general, green products are known as ecological products or environmentally friendly products that impact less on the environment. The goal of green marketing is bringing environment issue into marketing. If we can make consumers consider that information of environmental protection during their decision process, we can push companies to produce more environmentally friendly products.`,`Although the tourism and hospitality industry is also referred to as the non-factory-made industry, companies are still trying hard toward the goal of sustainable development. In Taiwan, the government took several ways to encourage sustainability development in the industry. For example, the Environmental Protection Administration (EPA) held a reward program that customers could earn "green points" after dining at environmentally friendly restaurants.`],
  real:`帶團常遇「永續旅遊/綠色消費」主題導覽:<b>綠色消費者</b>=關心環境、支持環保企業的人;<b>綠色產品</b>三特徵=無毒(non-toxic)、回收材質(recycled)、簡易包裝(minimally packaged);台灣環保署推「綠點(green points)」鼓勵在環保餐廳消費。口試被問永續旅遊,可用這三特徵 + 政府獎勵措施回答。`,
  vocab:[[`green consumer`,``,`綠色消費者`],[`non-toxic (adj.)`,`nɑnˈtɑksɪk`,`無毒的`],[`recycled (adj.)`,`riˈsaɪkl̩d`,`回收再製的`],[`minimally (adv.)`,`ˈmɪnəməlɪ`,`最低限度地`],[`sustainable (adj.)`,`səˈstenəbl̩`,`永續的`],[`conservation (n.)`,`ˌkɑnsɚˈveʃən`,`保育`]]},

 {kind:`q`,no:71,type:`閱讀`,topic:`細節 · 是非判斷`,star:2,
  stem:`Which of the following statements is true?`,
  zh:`下列敘述何者為真?`,
  opts:[`Countries all over the world are ignoring environmental conservation issues. 各國都在忽視環保議題。`,`Green products are made of plastic. 綠色產品由塑膠製成。`,`The Taiwan government took actions to promote green dining. 台灣政府採取行動推廣綠色餐飲。`,`The goal of green marketing makes no difference from marketing in general. 綠色行銷與一般行銷沒差別。`],ans:2,
  ana:`<b>① 定位原文</b>(第 2 段):「the government took several ways… EPA held a reward program… earn 'green points' after dining at environmentally friendly restaurants」。<br><b>② 選項逐一辨析</b>:<table class="opta"><tr><td>(A) 各國忽視環保</td><td><span class="no2">✗</span>　原文「increasingly <b>emphasizing</b>」= 日益重視,相反</td></tr><tr><td>(B) 綠色產品由塑膠製</td><td><span class="no2">✗</span>　原文是「recycled / non-toxic」,不是塑膠</td></tr><tr><td>(C) 台灣政府推綠色餐飲</td><td><span class="ok2">✓ 正解</span>　對應綠點獎勵計畫(green points)</td></tr><tr><td>(D) 綠色行銷與一般行銷無差</td><td><span class="no2">✗</span>　原文特別強調把「環境議題帶入行銷」,有差</td></tr></table>`,
  skill:`💡 <b>是非題找反轉字</b>:A「ignoring」對上原文「emphasizing」(相反)、D「no difference」對上原文的差異描述——這科最愛用「原文說相反」設錯項。`,
  note:`⚠️ 看到 ignore / no difference / always / never 等絕對字,回原文核對常是陷阱。`,
  vocab:[[`promote (v.)`,`prəˈmot`,`推廣`],[`emphasize (v.)`,`ˈɛmfəˌsaɪz`,`強調`],[`dining (n.)`,`ˈdaɪnɪŋ`,`用餐`]]},

 {kind:`q`,no:72,type:`閱讀`,topic:`細節 · NOT 題`,star:2,
  stem:`Which of the following is not a possible characteristic of green products?`,
  zh:`下列何者<b>不是</b>綠色產品可能的特徵?`,

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:小琉球的海龜保育志工`,
  text:[`The sea turtle has been a species at high risk of extinction for many years. In Taiwan, Xiaoliuqiu (also called Little Liuqiu or Liuqiu), an island belonging to Pingtung County in Taiwan has a high number of sea turtles, and the majority of the residents there have been aware of the importance of protecting sea turtles.`,`However, the island has so many tourist attractions that many visitors come to the island on weekends and holidays. They come for scuba diving, SUP (stand-up paddling), snorkeling, and so on. Although these activities promote local economic growth, it leads to some influences on marine life and the environment.`,`To decrease the burden on the environment, a team of volunteers, consisting of university students in Taiwan, non-profit organizations, and residents have started to conduct a project about environmental protection, including sea turtle conservation and marine-debris decoration. The team observes the life of sea turtles, keeping records of their migration behaviors. The team also has a sea turtle patrol at night from 7:00 p.m. to 5:00 a.m., learning about how sea turtles lay their eggs. On the other hand, the team conducts beach clean-ups every day. The volunteers collect marine debris to create an art wall near the beach. This decoration wall aims to remind visitors that they should reduce pollution and disturbance. The head of the team says the volunteers will take more actions to keep the island green.`],
  real:`小琉球是台灣熱門海龜島(帶潛水/SUP/浮潛團常去)。導覽重點:海龜是<b>瀕危物種(extinction)</b>;志工團(大學生+NPO+居民)做海龜保育、夜間巡邏(晚 7 點到早 5 點看海龜產卵)、每日淨灘、用海洋廢棄物(marine debris)做藝術牆提醒遊客減少汙染。帶團到生態敏感區,務必提醒團員降低干擾、不追逐海龜。`,
  vocab:[[`extinction (n.)`,`ɪkˈstɪŋkʃən`,`絕種`],[`snorkeling (n.)`,`ˈsnɔrkl̩ɪŋ`,`浮潛`],[`marine debris`,``,`海洋廢棄物`],[`patrol (n.)`,`pəˈtrol`,`巡邏`],[`migration (n.)`,`maɪˈɡreʃən`,`遷徙`],[`non-profit (adj.)`,``,`非營利的`]]},

  vocab:[[`mainly (adv.)`,`ˈmenlɪ`,`主要地`],[`protection (n.)`,`prəˈtɛkʃən`,`保護`],[`wildlife (n.)`,`ˈwaɪldˌlaɪf`,`野生動物`]]},

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';el.id='q'+item.no;
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
(function(){function backBtn(){var ref=document.referrer||'';var label;if(/學習中心/.test(ref))label='← 回學習中心';else if(/錯題本/.test(ref))label='← 回錯題本';else return;var b=document.createElement('a');b.textContent=label;b.href='#';b.style.cssText='position:fixed;left:12px;bottom:16px;z-index:99;background:var(--accent);color:#fff;padding:9px 16px;border-radius:22px;font-size:.86rem;font-weight:700;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.28)';b.addEventListener('click',function(e){e.preventDefault();history.back();});document.body.appendChild(b);}function go(){var h=location.hash;if(!/^#q\d+$/.test(h))return;var c=document.getElementById(h.slice(1));if(!c)return;c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){c.classList.remove('hl');},2400);}window.addEventListener('hashchange',go);if(/^#q\d+$/.test(location.hash))backBtn();setTimeout(go,300);})();
</script>
</body>
</html>
