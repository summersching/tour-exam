const DATA = [
 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`q`,no:1,type:`對話`,topic:`急救`,star:2,
  stem:`Guest: My friend has just fallen over and cut his leg badly. It is Ms. Lin from room 510.　Clerk: __BLANK__`,
  zh:`客人:我朋友剛跌倒,腿割得很嚴重。是 510 房的林小姐。　櫃台:<b>會有人立刻拿急救設備上去,別移動他。</b>`,

 {kind:`q`,no:4,type:`字彙`,topic:`通關`,star:2,

  vocab:[[`allowance (n.)`,`əˈlaʊəns`,`額度`],[`tobacco (n.)`,`təˈbæko`,`菸草`],[`customs duty`,``,`關稅`]]},

 {kind:`q`,no:5,type:`字彙`,topic:`行李`,star:2,
  stem:`Clerk: Your suitcase is a bit heavy. You'll need to pay for an excess baggage fee.　Passenger: Oh. What's the weight __BLANK__?`,
  zh:`櫃台:你的行李箱有點重,需付超重行李費。　乘客:喔,重量<b>上限</b>是多少?`,
  opts:[`limit 限制(名詞)`,`limitation 侷限`,`limited 有限的`,`limiting 限制的`],ans:0,
  ana:`「超重費(excess baggage)+ 重量…」→「上限」weight <b>limit</b>(重量限制)。limitation(侷限,較抽象)/limited/limiting(形容詞)不合。`,
  note:`⚠️ 官方送分:本題答 A(limit)或 B(limitation)皆給分;但 weight limit 才是自然搭配。`,

 {kind:`q`,no:6,type:`對話`,topic:`航空`,star:2,

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:低衝擊觀光與「綠色旅人」`,
  text:[`Tourism represents an important source of income. Most resource-poor countries, therefore, cannot afford to neglect the economic opportunities tourism offers. However, tourism often ends up destroying the landscape and culture that attracted visitors in the first place. Low-impact tourism is sustainable travel and leisure activities that directly benefit local communities. The society and culture and environment of the people who live in the tourist destinations are not damaged or destroyed either.`,`Unfortunately, the environmental impacts of tourism can be devastating when profit takes precedence. As a result, it heavily depends on individuals travel responsibly as a "green tourist." Being a green tourist starts eating out on trips with a philosophy of "buy local, eat and drink local." Try not to go for the international fast-food chains, because most of the money from tourism may undergo leakage. Furthermore, food is an important part of the culture of a region; through its consumption you gain in-depth knowledge about the local cuisine and the destination's culture. Choosing locally made souvenirs is another area where the tourist can be either a help or a hindrance, but never buy anything made from an endangered species. Never pick any plants or flowers either.`,`However, sometimes tourists behave very poorly while traveling. Therefore, the key factor in minimizing damage through tourism is to keep tourist groups to a manageable size and manage their movements and behavior. In fact, some popular attractions have tourist group size limit. For example, La Boqueria, the most famous market in Barcelona, banned tourist groups of more than 15 people in 2015.`],
  real:`「低衝擊/綠色觀光(low-impact / green tourism)」是永續旅遊核心,帶團常宣導。當「綠色旅人」的原則:<b>①買在地、吃在地(buy local, eat local)</b>——避開國際速食連鎖,否則觀光財會外流(leakage);<b>②買在地紀念品但禁買瀕危物種製品、禁採花草</b>;<b>③控制團體人數</b>——巴塞隆納波格利亞市場 2015 年起就禁 15 人以上團體進入。口試問永續旅遊可用這三點。`,
  vocab:[[`low-impact (adj.)`,``,`低衝擊的`],[`devastating (adj.)`,`ˈdɛvəˌstetɪŋ`,`毀滅性的`],[`leakage (n.)`,`ˈlikɪdʒ`,`(觀光財)外流`],[`hindrance (n.)`,`ˈhɪndrəns`,`妨礙`],[`endangered species`,``,`瀕危物種`],[`sustainable (adj.)`,`səˈstenəbl̩`,`永續的`]]},

 {kind:`q`,no:71,type:`閱讀`,topic:`字義推測題`,star:2,
  stem:`Which of the following is closest in meaning to "devastating"?`,
  zh:`與 devastating 意思最接近的字是?`,
  opts:[`destined 命中註定的`,`destructive 破壞性的`,`determinate 確定的`,`striking 引人注目的`],ans:1,
  ana:`<b>① 回原句</b>:「environmental impacts… can be <b>devastating</b> when profit takes precedence」——利益掛帥時,環境衝擊是「毀滅性的」。<br><b>② 選項辨析</b>:<table class="opta"><tr><td>(A) 命定 / (C) 確定 / (D) 引人注目</td><td><span class="no2">✗</span>　與「毀滅、破壞」無關(且 destined 拼字相近誘導)</td></tr><tr><td>(B) 破壞性的</td><td><span class="ok2">✓ 正解</span>　devastating = 毀滅性的,近義 destructive</td></tr></table>`,
  skill:`💡 <b>生字看語境</b>:講「環境衝擊(impacts)」又是負面 → 選「破壞性(destructive)」。A(destined)長得像但意思無關。`,
  vocab:[[`destructive (adj.)`,`dɪˈstrʌktɪv`,`破壞性的`],[`devastating (adj.)`,`ˈdɛvəˌstetɪŋ`,`毀滅性的`],[`impact (n.)`,`ˈɪmpækt`,`衝擊`]]},

 {kind:`q`,no:72,type:`閱讀`,topic:`句意理解題`,star:3,
  stem:`Which of the following best explains "… most of the money from tourism may undergo leakage" in the second paragraph?`,
  zh:`<b>下列何者</b>最能解釋<b>第二段中</b>「… most of the money from tourism may undergo leakage(觀光財大多外流)」?`,
  opts:[`Most of the money from tourism may leave the destination. 觀光財大多流出當地。`,`Most of the money may come from the destination. 大多來自當地。`,`Most of the money may be repatriated to the destination. 大多匯回當地。`,`Most of the money may recover from the destination. 大多從當地回收。`],ans:0,
  ana:`<b>① 抓上下文</b>:前句叫你「別去國際速食連鎖」,因為錢會 leakage(外流)→ 錢「流出當地」。<br><b>② 選項辨析</b>:<table class="opta"><tr><td>(A) 流出當地</td><td><span class="ok2">✓ 正解</span>　leakage = 外流,錢離開目的地(進了國際企業口袋)</td></tr><tr><td>(B) 來自當地 / (C) 匯回當地 / (D) 從當地回收</td><td><span class="no2">✗</span>　方向相反(都是「錢進來/留下」,與 leakage 外流相反)</td></tr></table>`,
  skill:`💡 <b>片語理解</b>:leakage(漏出)= 錢外流。前文「別去國際連鎖」是線索——錢被外國企業賺走 = leave the destination。B/C/D 方向都相反。`,
  vocab:[[`leakage (n.)`,`ˈlikɪdʒ`,`外流`],[`destination (n.)`,`ˌdɛstəˈneʃən`,`目的地`],[`repatriate (v.)`,`riˈpetrɪˌet`,`匯回、遣返`]]},

 {kind:`q`,no:73,type:`閱讀`,topic:`細節 · NOT 題`,star:3,
  stem:`According to the passage, which of the following statements is NOT true?`,
  zh:`根據本文,下列敘述何者<b>不</b>正確?`,
  opts:[`Businesses use the term "low-impact tourism" to appeal to travelers without actually having responsible policies. 企業用「低衝擊觀光」名號吸客卻無實際環保政策。`,`Travellers are recommended to make conscious choices that increase the positive impact of travel. 建議旅客做有意識的選擇以增加正面影響。`,`Sourcing locally-produced products for restaurants and gift shops should be encouraged. 應鼓勵在地採購。`,`Low-impact tourism sustains the well-being of the local people. 低衝擊觀光維護在地居民福祉。`],ans:0,
  ana:`<b>① NOT 題:找「文章沒說/與文章相反」的</b>。本文<b>正面</b>提倡低衝擊觀光,並未指控企業「掛羊頭賣狗肉(漂綠)」。<br><b>② 選項辨析</b>:<table class="opta"><tr><td>(A) 企業假環保吸客</td><td><span class="ok2">✓ 正解</span>　文章<b>從未</b>提到企業漂綠 = NOT true 答案</td></tr><tr><td>(B) 有意識選擇增加正面影響</td><td><span class="no2">✗</span>　對應「travel responsibly / green tourist」——真</td></tr><tr><td>(C) 鼓勵在地採購</td><td><span class="no2">✗</span>　對應「buy local / locally made souvenirs」——真</td></tr><tr><td>(D) 維護在地福祉</td><td><span class="no2">✗</span>　對應「directly benefit local communities」——真</td></tr></table>`,
  skill:`💡 <b>NOT 題找「沒說的」</b>:B/C/D 都能在文中找到根據(真),只有 A(指控企業漂綠)文章完全沒提 → 選它。`,
  vocab:[[`appeal to`,``,`吸引`],[`conscious (adj.)`,`ˈkɑnʃəs`,`有意識的`],[`well-being (n.)`,``,`福祉`]]},

 {kind:`q`,no:74,type:`閱讀`,topic:`推論題`,star:3,

  skill:`💡 <b>推論貼原文</b>:合理推論=「原文換句話說」。原文「吃在地→懂當地文化」→ A。B/C/D 都是「文章沒提的延伸」,推太遠。`,

 {kind:`q`,no:75,type:`閱讀`,topic:`細節 · 定位`,star:2,

  vocab:[[`manageable (adj.)`,`ˈmænɪdʒəbl̩`,`可控管的`],[`minimize (v.)`,`ˈmɪnəˌmaɪz`,`降至最低`],[`behavior (n.)`,`bɪˈhevjɚ`,`行為`]]},

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:羅浮宮玻璃金字塔改建`,
  text:[`The renovation project of the Louvre signifies the possibility of harmony between modernity and history. Louvre, originally constructed as a fortress, was the home of the kings of France until Louis XIV chose Versailles for his household, leaving the Louvre primarily as a home for artists and intellectuals. In the late 1800s, the Louvre was damaged in a fire. The fire entirely destroyed the interior of the palace, spreading to the museum next to it.`,`The decision to turn the Louvre into a massive repository of the world's greatest fine art collection was proposed in 1981 by the French President François Mitterrand. However, the old royal palace was barely functional as a museum. The challenge was in turning a historical building into a modern museum equipped to cater for a large ever-growing number of visitors. The architect Ieoh Ming Pei was named to design the Grand Louvre project. His proposal for a glass pyramid was extremely controversial. Many believed that this historic site was already "saturated with architectural styles." Pei overcame the negative response from officials and historians to his design.`,`Pei was convinced that, in addition to educating the public, museums needed to be attractive enough to make people want to spend the day there. Most importantly, a museum should not only be a place to see art but also should be an aesthetic experience in itself. Louvre's glass pyramid was once decried as an architectural "obscenity" but nowadays, it has become a cherished icon of the French capital, drawing over a million visitors every year.`],
  real:`羅浮宮(Louvre)玻璃金字塔是「現代與歷史融合」的經典案例,帶歐洲團必講。重點:羅浮宮原為<b>堡壘(fortress)</b>→ 法王居所 → 藝術家聚所;1980 年代密特朗總統推「大羅浮宮計畫」,把歷史建築改成現代美術館;華裔建築師<b>貝聿銘(I.M. Pei)</b>設計玻璃金字塔,起初被批「褻瀆」,如今成巴黎地標。貝聿銘理念:美術館不只看藝術,本身要是「美學體驗」。`,
  vocab:[[`renovation (n.)`,`ˌrɛnəˈveʃən`,`翻修`],[`fortress (n.)`,`ˈfɔrtrɪs`,`堡壘`],[`repository (n.)`,`rɪˈpɑzəˌtɔrɪ`,`儲藏所`],[`controversial (adj.)`,`ˌkɑntrəˈvɝʃəl`,`有爭議的`],[`aesthetic (adj.)`,`ɛsˈθɛtɪk`,`美學的`],[`icon (n.)`,`ˈaɪkɑn`,`地標、象徵`]]},

 {kind:`q`,no:76,type:`閱讀`,topic:`主旨題`,star:2,

  skill:`💡 <b>主旨看首句</b>:renovation signifies harmony… 就是主旨句。D「失敗」與結局(成功地標)相反,A 只是背景(以偏概全)。`,
  vocab:[[`modernity (n.)`,`mɑˈdɝnətɪ`,`現代性`],[`harmony (n.)`,`ˈhɑrmənɪ`,`和諧、融合`],[`skyscraper (n.)`,`ˈskaɪˌskrepɚ`,`摩天樓`]]},

  vocab:[[`storehouse (n.)`,`ˈstɔrˌhaʊs`,`儲藏所`],[`repository (n.)`,`rɪˈpɑzəˌtɔrɪ`,`儲藏所`],[`collection (n.)`,`kəˈlɛkʃən`,`收藏`]]},

  skill:`💡 <b>NOT 題:找「文章沒說 or 說相反」</b>。B、D 都能在文中找到(真);A(沒提)、C(相反)都對不上 → 官方兩者都送分。`,

 {kind:`q`,no:79,type:`閱讀`,topic:`細節 · 定位`,star:2,
  stem:`What was the aim of the Grand Louvre project?`,
  zh:`「大羅浮宮計畫」的目標是什麼?`,
  opts:[`To rediscover western art and Egyptian art. 重新發現西方與埃及藝術。`,`To safeguard the Louvre Museum and its collections. 保護羅浮宮及其收藏。`,`To use accessible digital tools to explore collections. 用數位工具探索收藏。`,`To turn a historical building into a modern museum. 把歷史建築改成現代美術館。`],ans:3,
  ana:`<b>① 定位原文</b>(第 2 段):「The challenge was in <b>turning a historical building into a modern museum</b>… The architect… was named to design the Grand Louvre project」——計畫目標即此。<br><b>② 選項辨析</b>:<table class="opta"><tr><td>(A) 重探西方/埃及藝術 / (C) 數位工具</td><td><span class="no2">✗</span>　文章沒提</td></tr><tr><td>(B) 保護收藏</td><td><span class="no2">✗</span>　重點是「改造成現代館」不是「保護」</td></tr><tr><td>(D) 歷史建築改現代館</td><td><span class="ok2">✓ 正解</span>　對應「turning a historical building into a modern museum」</td></tr></table>`,
  skill:`💡 <b>關鍵字定位</b>:Grand Louvre project 前一句就是「the challenge was turning… into a modern museum」→ 直接抄。`,
  vocab:[[`aim (n.)`,`em`,`目標`],[`safeguard (v.)`,`ˈsefˌɡɑrd`,`保護`],[`modern museum`,``,`現代美術館`]]},

 {kind:`q`,no:80,type:`閱讀`,topic:`細節 · 觀點`,star:3,
  stem:`What is the purpose of a museum according to I.M. Pei?`,
  zh:`依貝聿銘之見,博物館的目的是什麼?`,
  opts:[`To display its architectural style. 展示其建築風格。`,`To preserve and store national treasures. 保存與存放國寶。`,`To entertain officials and historians. 娛樂官員與史學家。`,`To educate the public and have aesthetic experiences. 教育大眾並提供美學體驗。`],ans:3,
  ana:`<b>① 定位原文</b>(第 3 段):Pei 認為博物館「in addition to <b>educating the public</b>… should be an <b>aesthetic experience</b> in itself」——教育 + 美學體驗。<br><b>② 選項辨析</b>:<table class="opta"><tr><td>(A) 展示建築風格 / (B) 保存國寶 / (C) 娛樂官員</td><td><span class="no2">✗</span>　都不是貝聿銘說的「博物館目的」(偷換/沒提)</td></tr><tr><td>(D) 教育大眾 + 美學體驗</td><td><span class="ok2">✓ 正解</span>　對應「educating the public + aesthetic experience」</td></tr></table>`,
  skill:`💡 <b>觀點題找「某人說」</b>:題目問「according to Pei」→ 回文找 Pei 的主張(educate + aesthetic experience)。其他選項是文章其他部分或沒提,別混。`,
  vocab:[[`aesthetic (adj.)`,`ɛsˈθɛtɪk`,`美學的`],[`educate (v.)`,`ˈɛdʒəˌket`,`教育`],[`treasure (n.)`,`ˈtrɛʒɚ`,`寶藏`]]}
];

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';el.id='q'+item.no;
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
(function(){function backBtn(){var ref=document.referrer||'';var label;if(/學習中心/.test(ref))label='← 回學習中心';else if(/錯題本/.test(ref))label='← 回錯題本';else return;var b=document.createElement('a');b.textContent=label;b.href='#';b.style.cssText='position:fixed;left:12px;bottom:16px;z-index:99;background:var(--accent);color:#fff;padding:9px 16px;border-radius:22px;font-size:.86rem;font-weight:700;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.28)';b.addEventListener('click',function(e){e.preventDefault();history.back();});document.body.appendChild(b);}function go(){var h=location.hash;if(!/^#q\d+$/.test(h))return;var c=document.getElementById(h.slice(1));if(!c)return;c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){c.classList.remove('hl');},2400);}window.addEventListener('hashchange',go);if(/^#q\d+$/.test(location.hash))backBtn();setTimeout(go,300);})();
</script>
</body>
</html>
