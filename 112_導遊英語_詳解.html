  {kind:`passage`,
   label:`閱讀第 1 篇(第 71–75 題)· 主題:電動飛機與綠色航空`,
   text:[`In the past few years, most major airlines have announced their plans to use commercial electric airplanes. Travelers can soon travel to different places via an electric aircraft. Take United Airlines for example. They will offer fossil fuel-free domestic flights by 2026. In addition, Sweden and Denmark also declared their plans to use fossil fuel-free electric-powered airplanes by 2030. Electric air travel (i.e. traveling with an electric-powered aircraft) is going mainstream. There are various methods to supply electricity; however, the most common way is to use batteries.`,`The climate crisis has been worsening these past few years. One of the major contributors to this environmental problem is air transportation. The aviation sector has released huge amounts of carbon dioxide (CO2) into the atmosphere every year. Unfortunately, airplanes are predicted to triple their CO2 emissions by 2050 if left unchecked now.`,`Most major airlines have thus signed up to meet the targeted net-zero carbon emissions by 2050. Governments from many different countries are establishing policies to help protect the environment. Austria and France have enacted bans on short-haul domestic flights. In the United States of America, the government is also pushing to reduce CO2 emissions through clean-energy transportation.`,`As presented, the use of small electric airplanes is the first step towards greener air travel. The development of larger electric planes may take several years. Still, you can expect to hear that electric air travel will be going mainstream in the coming years.`],
   real:`🎧 <b>電動飛機 / 綠色航空</b>是永續熱門題。口試可提:electric aircraft(電動飛機)、net-zero carbon emissions(淨零碳排)、climate crisis(氣候危機)、clean energy(潔淨能源)。`,
   vocab:[[`aviation (n.)`,`ˌeviˈeʃən`,`航空(業)`],[`carbon dioxide`,``,`二氧化碳`],[`emission (n.)`,`ɪˈmɪʃən`,`排放`],[`fossil fuel`,``,`化石燃料`],[`mainstream (adj.)`,`ˈmenˌstrim`,`主流的`],[`short-haul (adj.)`,``,`短程的`],[`enact (v.)`,`ɪnˈækt`,`制定(法律)`]]},
  {kind:`q`,no:71,type:`閱讀`,topic:`主旨`,star:2,
   stem:`What is the main idea of the passage?`,
   zh:`本文的主旨為何?`,
   opts:[`As science develops, views of travel do not change. 隨著科學發展,人們對旅遊的看法並未改變。`,`Traveling with an electric-powered aircraft is going mainstream. 搭乘電動飛機旅行正邁向主流。`,`It does not suggest a different solution to a problem. 它並未針對問題提出不同的解方。`,`The climate crisis has been worsening these past few years. 氣候危機近年來持續惡化。`],
   ans:1,
   ana:`<b>主旨題「涵蓋全文」</b>:全文都在講『電動飛機航空正邁向主流』(開頭、結尾都提 going mainstream)→ (B)。<table class='opta'><tr><td>(A) 科學發展但旅遊觀不變</td><td><span class='no2'>✗</span> 與全文『航空正在改變』相反</td></tr><tr><td>(B) 電動飛機旅行邁向主流</td><td><span class='ok2'>✓ 正解</span> 首尾呼應 going mainstream</td></tr><tr><td>(C) 未提出解方</td><td><span class='no2'>✗</span> 與原文相反(有提電動飛機解方)</td></tr><tr><td>(D) 氣候危機惡化</td><td><span class='no2'>✗</span> 只是第 2 段背景(以偏概全)</td></tr></table>`,
   skill:`<b>主旨看首尾</b>:開頭與結尾都出現 going mainstream(邁向主流)→ 主旨就是它;D 只是其中一段背景。`,
   vocab:[[`mainstream (adj.)`,``,`主流的`],[`electric-powered`,``,`電力驅動的`]]},

  {kind:`passage`,
   label:`閱讀第 2 篇(第 76–80 題)· 主題:非洲野生動物之旅(safari)`,
   text:[`I was filled with excitement and awe as our vehicle jolted down the muddy paths of the wildlife reserve. Incredible creatures roamed the savannah, and the sceneries itself were some of the most stunning I've ever seen.`,`Safari traveling is a thrilling and one-of-a-kind opportunity to take in the splendor and variety of the natural world. In order to see and photograph wild creatures in their natural environment, safari vacationers often visit an African wildlife reserve or national park.`,`In my experience, seeing iconic and endangered animals like lions, elephants, and gorillas in their natural habitats is expected to be a staple of a safari vacation. My favorite part of the trip was getting to see a group of wild canine animals in their natural habitat. I'd never had such a good look at these endangered creatures before.`,`Aside from getting an up-close glimpse at the animals, tourists can receive insight into their habits and routines from knowledgeable guides on several safari programs that include guided drives within the park. Safaris sometimes involve more than just visits to zoos and sanctuaries to see animals; they often provide opportunities for hiking, birdwatching, and cultural immersion.`,`Memories created on the safari journey will last a lifetime since it was truly once in a lifetime opportunity. I think a trip to Africa for a safari would be amazing if you have the chance to go. You won't soon forget this incredible journey.`],
   real:`🎧 <b>Safari 野生動物之旅</b>是特色行程題。口試可提:wildlife reserve(野生動物保護區)、endangered animals(瀕危動物)、natural habitat(自然棲地)、eco-tourism(生態旅遊)。`,
   vocab:[[`awe (n.)`,`ɔ`,`敬畏、讚嘆`],[`savannah (n.)`,`səˈvænə`,`大草原`],[`splendor (n.)`,`ˈsplɛndɚ`,`壯麗`],[`endangered (adj.)`,`ɪnˈdendʒɚd`,`瀕危的`],[`habitat (n.)`,`ˈhæbəˌtæt`,`棲地`],[`sanctuary (n.)`,`ˈsæŋktʃuˌɛri`,`保護區、庇護所`],[`immersion (n.)`,`ɪˈmɝʒən`,`沉浸`]]},

   opts:[`Shattered. 粉碎。`,`Shot. 射擊。`,`Shook. 搖動。`,`Shrank. 縮小。`],
   ans:2,
   ana:`<div class='cite'>our vehicle <b>jolted</b> down the muddy paths</div>車子在泥濘路上『顛簸、震動』→ jolted = 震動、顛簸 → Shook(shake 的過去式,搖動)。Shattered/Shot/Shrank 不合。`,
   skill:`<b>字義題看情境</b>:車子在泥路上 jolted → 顛簸搖晃 = Shook;形近的 Sh- 開頭字靠語意刷掉。`,
   vocab:[[`jolt (v.)`,``,`顛簸、使震動`],[`shake (v.)`,`ʃeik`,`搖動`]]},
  {kind:`q`,no:78,type:`閱讀`,topic:`細節`,star:3,
   stem:`What was the highlight of the author's safari's trip?`,
   zh:`作者 safari 之旅的亮點(最精彩處)是什麼?`,
   opts:[`He was surrounded by the most breathtaking landscapes he had ever seen. 他被此生見過最壯麗的景色環繞。`,`He had the chance to see a pack of wild dogs up close. 他有機會近距離看到一群野狗。`,`He could experience the beauty and diversity of the natural world. 他能體驗自然界的美與多樣性。`,`He could get close to some of the most famous and endangered animals in the world, like lions and gorillas. 他能近距離接觸世上最知名、瀕危的動物,如獅子和大猩猩。`],
   ans:1,
   ana:`<div class='cite'>My <b>favorite part</b> of the trip was getting to see a group of <b>wild canine animals</b> in their natural habitat</div>作者最愛的部分 = 看到一群野生犬科動物(wild dogs)→ (B)。<table class='opta'><tr><td>(A) 被最美景色包圍</td><td><span class='no2'>✗</span> 有提但非『最愛的部分』</td></tr><tr><td>(B) 近距離看一群野狗</td><td><span class='ok2'>✓ 正解</span> = favorite part … wild canine animals(犬科=狗)</td></tr><tr><td>(C) 體驗自然之美</td><td><span class='no2'>✗</span> 是整體感受非 highlight</td></tr><tr><td>(D) 近距離看獅子大猩猩</td><td><span class='no2'>✗</span> 那是『預期的常見項目 staple』,非他的 highlight</td></tr></table>`,
   skill:`<b>highlight 題找 favorite/best</b>:定位 My favorite part → wild canine animals(犬科動物=狗)= B;D 是 staple(常見預期)不是他最愛。`,
   note:`⚠️ canine = 犬科的(狗);wild canine animals = 野狗/野生犬科動物。`,
   vocab:[[`canine (adj.)`,``,`犬科的`],[`up close`,``,`近距離`]]},
  {kind:`q`,no:79,type:`閱讀`,topic:`細節`,star:2,
   stem:`According to this passage, what can tourists learn from these knowledgeable safari guides?`,
   zh:`根據本文,遊客能從這些博學的 safari 嚮導身上學到什麼?`,
   opts:[`They can learn about the animals' behavior and habits. 他們能了解動物的行為與習性。`,`They can learn about endangered animal species. 他們能了解瀕危動物物種。`,`They can learn about several African wildlife sanctuaries. 他們能了解幾個非洲野生動物保護區。`,`They can get knowledge about the splendor of nature. 他們能獲得關於自然壯麗的知識。`],
   ans:0,
   ana:`<div class='cite'>tourists can receive insight into their <b>habits and routines</b> from knowledgeable guides</div>從嚮導可獲得動物的『習性與作息』→ (A) 動物的行為與習性。B(瀕危物種)/C(保護區)/D(自然壯麗)非『從嚮導學到』的那句內容(張冠李戴)。`,
   skill:`<b>『從 X 學到什麼』回 X 那句</b>:insight into their habits and routines(習性作息)→ A(behavior and habits)換句話說。`,
   vocab:[[`insight (n.)`,``,`洞察、了解`],[`routine (n.)`,``,`作息、慣例`]]},
  {kind:`q`,no:80,type:`閱讀`,topic:`細節 · NOT`,star:2,
   stem:`According to this passage, which of the following is NOT included in safari vacations besides animal sightings?`,
   zh:`根據本文,除了看動物外,下列何者「未」包含在 safari 度假中?`,
   opts:[`Hiking. 健行。`,`Observing birds. 賞鳥。`,`Animal breeding. 動物繁殖。`,`Cultural encounters. 文化交流。`],
   ans:2,
   ana:`<div class='cite'>they often provide opportunities for <b>hiking, birdwatching, and cultural immersion</b></div>除了看動物,safari 還有:健行(Hiking)、賞鳥(Observing birds)、文化沉浸(Cultural encounters)——唯獨<b>沒提</b>『動物繁殖 Animal breeding』→ NOT 選 (C)。`,
   skill:`<b>NOT 題回文對清單</b>:原文列 hiking / birdwatching / cultural immersion 三項 → 對應 A/B/D;沒列的 C(動物繁殖)就是答案。`,
   vocab:[[`breeding (n.)`,``,`繁殖、育種`],[`encounter (n.)`,`ɪnˈkaʊntɚ`,`接觸、相遇`]]},
{kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`}

];

const LAB=['A','B','C','D'];
function splitOpt(o){const m=o.match(/^(.*?)([\u4e00-\u9fff].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+m[2]+'</span>':o;}
const app=document.getElementById('app');
const TOTAL=DATA.filter(d=>d.kind==='q').length;
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${t.replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return v.map(x=>`<tr><td><span class="vw">${x[0]}</span>${x[1]?`<span class="kk">/${x[1]}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

let answered=new Set(),correct=0;
function updateScore(){document.getElementById('score').textContent=`作答 ${answered.size}/${TOTAL} · 答對 ${correct} · ${answered.size?Math.round(correct/answered.size*100):0}%`;}


/* ===== 錯題本記錄(跨年共用 localStorage;安裝成 App/同一網址才跨檔共用)===== */
var WB_KEY='wrongbook_en';
var WB_CERT=/導遊/.test(document.title)?'guide':'leader';
var WB_YEAR=(document.title.match(/(\d{3})\s*年/)||[])[1]||'';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return {};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=WB_CERT+'-'+WB_YEAR+'-'+item.no,e=o[id]||{};o[id]={cert:WB_CERT,y:WB_YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[WB_CERT+'-'+WB_YEAR+'-'+no];wbSave(o);}

DATA.forEach(item=>{
  if(item.kind==='guide'){
    const el=document.createElement('div');el.className='guide';
    el.innerHTML=`<div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div>`;
    app.appendChild(el);return;
  }
  if(item.kind==='strategy'){
    const el=document.createElement('div');el.className='strategy';
    el.innerHTML=`<button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div>`;
    el.querySelector('.stgh').addEventListener('click',()=>{const o=el.classList.toggle('open');el.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';});
    app.appendChild(el);return;
  }
  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
</script>
