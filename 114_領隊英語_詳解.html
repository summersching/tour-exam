const DATA = [
 {kind:`strategy`,title:`⚡ 字彙 · 對話題 快速解題法`,html:`<h4>⚡ 快速解題口訣(先背這個)</h4><ul><li><b>字彙四招</b>:「<b>情境鎖 → 套回唸 → 記搭配 → 刷詞性</b>」</li><li><b>對話題</b>:「<b>先看回應,反推問題</b>」</li><li><b>完全不會</b>:「<b>刪兩個、猜一個、絕不空</b>」</li></ul><h4>一、四大快速招式(8 成題用得上)</h4><ol><li><b>情境關鍵字定位</b>:題幹一定有情境線索(機場/海關/飯店/殺價…)→ 鎖定情境找關鍵字。例:看到 Green Channel → declare(申報)</li><li><b>套回原句法</b>:4 個選項一個個填回去唸,只有一個通順(不確定字義時最有效)</li><li><b>搭配詞</b>:背固定搭配比背單字快——tax <b>refund</b>、<b>bargain</b> for、keep a safe <b>distance</b>、in case of <b>emergency</b></li><li><b>詞性先刷</b>:看空格要名詞/動詞/形容詞,詞性不對先刪(dishes 前要形容詞 → 名詞 instinct 先刪)</li></ol><h4>二、對話題專用(比字彙題更簡單)</h4><ol><li><b>看「回應」反推「問題」</b>:回答提到 camera flash → 問題必跟拍照有關</li><li><b>靠常識刷</b>:對話多是日常情境,不合常理的先刪</li></ol><h4>三、字彙題三大陷阱</h4><table><tr><th>陷阱</th><th>例</th></tr><tr><td><b>形近字</b>(長得像意思不同)</td><td>refund 退稅 / evasion 逃稅;custom 習俗 / customs 海關;quite 相當 / quiet 安靜</td></tr><tr><td><b>一詞多義</b>(看情境選對意思)</td><td>fair 公道/展覽;tip 訣竅/小費;decline 婉拒/下降;take off 起飛/脫下</td></tr><tr><td><b>同字根不同字首</b></td><td>attract/distract/retract;appropriate/approximate;deport/depart</td></tr></table><h4>四、高頻主題速記(考點集中,背這些)</h4><ul><li><b>機場/航班</b>:boarding、take off、aisle seat、immigration、arrival、turbulence</li><li><b>海關/出入境</b>:customs、declare、Green/Red Channel、tax refund、validity</li><li><b>飯店</b>:reception、amenities、check in</li><li><b>購物</b>:bargain、vendor、souvenir、boutique、groceries</li><li><b>片語動詞(每年 5–10 題必考!)</b>:take off、put out、put off、add up to、fed up with、get rid of</li></ul><h4>五、遇到完全不會的字</h4><ol><li>用<b>字根字首</b>猜(de-=去/離 → deport 遣返;-tion=名詞)</li><li><b>刪去法</b>:先刪明顯不合情境的 2 個,剩 2 個猜(命中率 50%)</li><li><b>絕不空著</b>:選擇題沒倒扣,一定要選!</li></ol>`},

 {kind:`q`,no:1,type:`字彙`,topic:`災害`,star:2,

 {kind:`q`,no:2,type:`字彙`,topic:`社會`,star:2,

 {kind:`q`,no:3,type:`字彙`,topic:`環境`,star:2,

 {kind:`q`,no:5,type:`字彙`,topic:`文法`,star:3,

  ana:`<b>worth + V-ing</b>(值得做):work worth <b>doing</b>。worth 後接動名詞,不接不定詞。`,
  gram:`📝 <b>be worth + V-ing</b> = 值得做…(worth doing);worth 後永遠接動名詞,不接 to do。`,

  vocab:[[`worth (adj.)`,`wɝθ`,`值得的(worth doing)`],[`prize (n.)`,`praɪz`,`獎賞`],[`far and away`,``,`遠遠地、無疑`]]},

 {kind:`q`,no:6,type:`字彙`,topic:`片語`,star:3,
  stem:`Time is running out, so we must __BLANK__ the problem right away.`,

 {kind:`q`,no:7,type:`字彙`,topic:`片語`,star:3,
  stem:`I __BLANK__ my coworkers quite well. We often collaborate on projects and enjoy spending time together during breaks.`,
  zh:`我跟同事<b>相處</b>得很好。我們常一起合作專案,休息時也喜歡待在一起。`,

{kind:`strategy`,title:`📖 閱讀解題技巧總攻略`,html:`<h4>📖 閱讀口訣(先背這個)</h4><ul><li><b>選對答案</b>:「<b>回文定位,換句話說</b>」</li><li><b>八大陷阱</b>:「<b>反、沒、過、偏、換、張、絕、湊</b>」(相反/沒提/過度推論/以偏概全/偷換概念/張冠李戴/絕對化/硬湊因果)</li><li><b>推論題</b>:「<b>不找對的,先刪錯的</b>」</li></ul><h4>一、開考戰術(時間 &amp; 順序)</h4><ol><li><b>閱讀擺最後寫</b>:前 70 題字彙/對話先秒殺,留 15–20 分給 2 篇(每篇約 8 分)。</li><li><b>先讀題目、再讀文章</b>:帶問題找答案,別先逐字精讀。</li><li><b>細節題按文章順序出</b>:第 1 題答案多在前段、最後題在後段。</li><li><b>略讀骨架</b>:首段 + 每段第一句 + 結論 = 全文主旨。</li></ol>
<h4>二、六大題型速查</h4><table><tr><th>題型</th><th>題目長相</th><th>破解法</th></tr><tr><td><b>主旨/標題</b></td><td>title / mainly about</td><td>選涵蓋全文;太窄太寬都刪</td></tr><tr><td><b>細節</b></td><td>According to / Why / What</td><td>關鍵字回文;答案是原文換句話說</td></tr><tr><td><b>NOT 題</b></td><td>NOT true / EXCEPT</td><td>先圈 NOT!選與原文矛盾/沒出現的</td></tr><tr><td><b>推論</b></td><td>inferred / imply</td><td>刪 4 種雷;選溫和有依據的</td></tr><tr><td><b>字義</b></td><td>the word "X" means</td><td>代入原句 + 字根 + 上下文褒貶</td></tr><tr><td><b>目的/態度</b></td><td>purpose / tone</td><td>看作者立場;語氣太偏必錯</td></tr></table>
<h4>三、干擾選項 8 大陷阱</h4><ol><li><b>與原文相反</b>(回文一比就露餡)</li><li><b>文章沒提</b>(無中生有:政府、政策…)</li><li><b>過度推論</b>(outweigh/best/most 講太滿)</li><li><b>以偏概全</b>(只涵蓋一部分,主旨題最愛)</li><li><b>偷換概念</b>(local↔foreign)</li><li><b>張冠李戴</b>(對的資訊安到錯的題)</li><li><b>絕對化</b>(only/all/never/must/completely)</li><li><b>硬湊因果</b>(兩件無關的事說成因果)</li></ol>
<h4>四、這科(旅遊觀光閱讀)命題特點</h4><ul><li><b>常考主題</b>:觀光經濟影響、永續/淨零、過度觀光、文化遺產、旅遊安全、旅宿趨勢。</li><li><b>超愛正反並陳</b>:先好處再壞處 → <b>「說死一邊」的選項幾乎必錯</b>,答案通常兩面兼顧。</li><li><b>學術詞不用怕</b>:考的是主旨/細節/態度,抓大意就能答。</li></ul>
<h4>五、卡關搶救</h4><ol><li>字義題不會 → 看<b>字根</b> + 上下文褒貶。</li><li>細節找不到 → 用<b>關鍵字/專有名詞/數字</b>回文掃。</li><li>兩選項難選 → 找有原文依據的,避開「絕對化」「文章沒提」。</li><li>時間不夠 → 主旨、字義題最快先搶;推論題擺最後。</li></ol>`},

 {kind:`passage`,label:`閱讀第 1 篇(第 71–75 題)· 主題:飛機該選哪一側座位`,
  text:[`Most travelers have a preference for window or aisle seats when it comes to air travel, but have you ever given thought to which side of the plane you should sit on? We polled some passengers about which side of the aisle they prefer—here's what they suggest when selecting your seat on an airplane.`,`Potential Views—If you prefer a window seat, you might want to check your potential flight path before picking a side. "I really like the window seat and often try and predict which side will have a better view based on the logical flight path into the airport," says Richard Campbell, founder of Travel Platform. "I still remember my first international flight almost 25 years ago. I was flying into London Heathrow and sat on the right-hand side of the plane, looking out on the Thames and central London as we circled over the city for our approach into the airport. What a way to start a trip!" But keep in mind that no matter how much research you do, your flight might have other plans.`,`What's Going on in the Sky—It's not all about the view below you. "If I'm flying a polar route, I try to be on the side of the plane that will face north during local nightfall in case I have an opportunity to witness the northern lights," says atmospheric scientist Matthew Cappucci. But if you're flying on a daytime flight, the sun is a more important consideration. "Since I don't like having the sun in my eyes, I try to sit on the opposite side of the sun," says Cappucci. "Sitting on the sunny side also means being on the noticeably warmer side of the plane."`,`Sleeping Preference—Do you tend to lean right or left when dozing off on a plane? If you're one to sleep on planes, you'll probably find yourself leaning one way or another as you drift off. "I prefer the right side of the plane, next to the window, when booking economy. I love looking out the window, but more importantly, I tend to lean to the right when I fall asleep, especially on long-haul flights," says Dominika Dryjski, an operating officer.`,`Right-handedness or Left-handedness—This might be a smaller consideration for nonbusiness travelers, but if you plan on working from a flight, consider your dominant hand. "As a right-handed person, I prefer to sit on the left side of the plane, in an aisle seat, as this makes it easier to work on a laptop if there's work I have to do," says John Lyotier, CEO of a travel magazine.`],
  real:`🎧 選座位、機艙方位是導遊領隊帶團常用知識。相關字:window/aisle/middle seat、boarding、layover、northern lights(極光)。`,

 {kind:`passage`,label:`閱讀第 2 篇(第 76–80 題)· 主題:郵輪產業疫後轉型(較難)`,
  text:[`During the pandemic, the cruise industry faced many challenges and financial losses. The cruise ship The Braemar was denied entry to the Bahamas after several passengers tested positive for COVID-19. The Diamond Princess was quarantined for a month in Japan as the virus spread onboard. The Diamond and the Ruby had death cases, 9 and 28 fatalities, respectively. Almost overnight, these luxury liners became symbols of death and contagion. Even some critics claimed that the global cruise industry was sinking. However, the Braemar changed its name to Odyssey and heralded a new era. Nowadays, the notion of perpetual cruises—where passengers live full-time on cruise ships—has attracted widespread attention of the wealthy. Despite some technical issues, the Odyssey eventually embarked on the voyage and offered passengers an alternative lifestyle at sea, where the ship serves as a floating home.`,`Unlike traditional vacation cruises, the Odyssey offers a new growing trend: cruises are a new living option for the rich. Passengers can purchase or rent cabins for up to 15 years. The prices range from $99,999 to $899,000, based on the cabin size. Only mid-range cabins are available, and two-thirds of them have been sold or rented. One of the critical elements is a sense of ownership, as they can customize their cabin to their liking. Also, wealthy residents do not want to share their space with tourists. Following a Manhattan-style co-op, the cruise ship The World was relaunched in 2002 and is still the world's only residential community at sea, ensuring exclusivity and ownership to its residents. However, this business model has faced challenges, such as managing short-term tourists and long-term residents. Another challenge was that they may grow sick of the sea after spending a long period of time. To address these issues, the residents decide the ship's itinerary, with stops every two or three days and no return to the original port of departure for at least three years. The ship Odyssey followed a similar business model of the ship The World and updated services, providing long-term living options for the wealthy. While living at sea full-time is not the norm for most people, it is clear that this trend is gaining popularity among the wealthy. With more ships being designed to accommodate long-term residents and offer more exclusive services, the idea of a perpetual home at sea is becoming a viable option for those who can afford it.`],

  if(item.kind==='passage'){
    const el=document.createElement('div');el.className='passage';
    el.innerHTML=`<div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+item.text.map(t=>`<p>${t}</p>`).join('')+(item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+`<div class="reveal fold"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div>`;
    app.appendChild(el);return;
  }
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=item.stem.replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const el=document.createElement('div');el.className='card';el.id='q'+item.no;
  el.innerHTML=`
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">解析</div><div class="ana">${item.ana}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div>`;
  const opts=el.querySelectorAll('.opt');
  opts.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!answered.has(item.no)){answered.add(item.no);if(i===item.ans){correct++;wbRemove(item.no);}else{wbAdd(item,i);}updateScore();}
    opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
    opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
    if(i!==item.ans){b.classList.add('no');b.querySelector('.mk').textContent='✗';}
    el.classList.add('show');
  }));
  app.appendChild(el);
});

app.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;
  const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('show'));setTimeout(()=>window.print(),100);});
const modeBtn=document.getElementById('mode');let review=false;
modeBtn.addEventListener('click',()=>{review=!review;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',review));
  if(review){modeBtn.textContent='📖 複習模式';modeBtn.classList.add('on');setHideZh(false);
    document.querySelectorAll('.card').forEach(c=>{const no=c.querySelector('.qno').textContent.replace(/\D/g,'');
      const item=DATA.find(d=>d.kind==='q'&&String(d.no)===no);
      if(item){const o=c.querySelectorAll('.opt');o.forEach(x=>x.classList.remove('ok','no'));
        o[item.ans].classList.add('ok');o[item.ans].querySelector('.mk').textContent='✓';}});
  }else{modeBtn.textContent='✍️ 自測模式';modeBtn.classList.remove('on');setHideZh(true);
    document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});}});
const zhToggle=document.getElementById('zhToggle');
function setHideZh(h){document.body.classList.toggle('hide-zh',h);zhToggle.classList.toggle('on',!h);zhToggle.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';}
zhToggle.addEventListener('click',function(){setHideZh(!document.body.classList.contains('hide-zh'));});
setHideZh(true);
updateScore();
(function(){function backBtn(){var ref=document.referrer||'';var label;if(/學習中心/.test(ref))label='← 回學習中心';else if(/錯題本/.test(ref))label='← 回錯題本';else return;var b=document.createElement('a');b.textContent=label;b.href='#';b.style.cssText='position:fixed;left:12px;bottom:16px;z-index:99;background:var(--accent);color:#fff;padding:9px 16px;border-radius:22px;font-size:.86rem;font-weight:700;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.28)';b.addEventListener('click',function(e){e.preventDefault();history.back();});document.body.appendChild(b);}function go(){var h=location.hash;if(!/^#q\d+$/.test(h))return;var c=document.getElementById(h.slice(1));if(!c)return;c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){c.classList.remove('hl');},2400);}window.addEventListener('hashchange',go);if(/^#q\d+$/.test(location.hash))backBtn();setTimeout(go,300);})();
</script>
</body>
</html>
