<style>
  :root{
    --bg:#f3f7f4;--card:#fff;--ink:#1a2a20;--sub:#58705f;--line:#dfe9e2;--soft:#e9f6ee;

    --shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#111712;--card:#19211b;--ink:#e6efe8;--sub:#9db3a3;--line:#2a372e;--soft:#16301f;
    --sel:#4ade80;--accent:#22c55e;--hd1:#052e16;--hd2:#14532d;--onsel:#052e16;

  :root[data-theme="dark"]{
    --bg:#111712;--card:#19211b;--ink:#e6efe8;--sub:#9db3a3;--line:#2a372e;--soft:#16301f;
    --sel:#4ade80;--accent:#22c55e;--hd1:#052e16;--hd2:#14532d;--onsel:#052e16;

  }
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;padding:0 0 70px;

  .bar{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .row{display:flex;gap:7px;padding:9px 0 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;

  .chip:hover{border-color:var(--sub)} .chip.on{background:var(--sel);border-color:var(--sel);color:var(--onsel)}
  .tools{display:flex;gap:8px;align-items:center;padding:8px 0 10px;flex-wrap:wrap}
  #q{flex:1;min-width:150px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:12px;font-size:.9rem;font-family:inherit}
  .tbtn{border:1.5px solid var(--sel);background:var(--card);color:var(--sel);font-weight:800;border-radius:12px;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:.85rem;white-space:nowrap}

  .basis{font-size:.72rem;color:var(--sub);margin:16px 2px}

<div class="bar"><div class="wrap">
  <div class="row" id="secRow"></div>

    <input id="q" placeholder="搜尋…(如 布農、潟湖、元宵、玄武岩)" aria-label="搜尋">

<div class="wrap">
  <div class="tip">💡 <strong>怎麼用</strong>:地圖可切換分區、點縣市河川山岳看說明,表上每列按「📍 圖上看」直接在地圖標出來。先整區看過,再按「遮住重點」把粗體與數字蓋起來,看著名稱回想特色(點一下看答案)。每區最下面:<strong>配對小測</strong>是用表上內容即時出題;<strong>歷屆原題</strong>從觀光資源概要考古題抽,答錯會收進觀光錯題本。後面的「導 / 領 年-題號」可點,看原題詳解。</div>

<script>
'use strict';
const D = window.ATLAS;
const QUIZ_N = 10;
const $ = id => document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function plain(s){return String(s).replace(/<[^>]+>/g,'');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const IDS = D.sections.map(s=>s.id);
function initSec(){
  const h = location.hash.slice(1);
  if (IDS.includes(h)) return h;
  try { const v = localStorage.getItem('pref_atlas_sec'); return v && (v==='all' || IDS.includes(v)) ? v : 'all'; } catch(e){ return 'all'; }
}
let SEC = initSec();
let MASKON = false;

function srcLink(sr){
  const m = sr.match(/^([gl])(\d+)-(\d+)$/); if (!m) return '';
  const q = { c: m[1]==='g'?'guide':'leader', y: m[2], no: +m[3] };
  return `<a class="qs" href="${PRACTICE.href('gh',q)}" title="${esc(PRACTICE.label('gh',q))}">${m[1]==='g'?'導':'領'}${m[2]}-${m[3]}</a>`;
}
function hl(html, kw){
  if (!kw) return html;
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith('<')?p:p.replace(re, m=>`<mark>${m}</mark>`)).join('');
}
/* 世界史分期(世界史年表用;各書劃分略有不同,這裡採常見的 476 / 1453 / 1789 / 1914) */
const ERA_W = [{ s: -1e9, e: 476, n: '古代', y: '到 476', c: '#64748b' }, { s: 476, e: 1453, n: '中古', y: '476–1453', c: '#0284c7' },
  { s: 1453, e: 1789, n: '近代早期', y: '1453–1789', c: '#16a34a' }, { s: 1789, e: 1914, n: '近代', y: '1789–1914', c: '#d97706' }, { s: 1914, e: 1e9, n: '現代', y: '1914–', c: '#7c3aed' }];
/* 年代欄 → 年份:「前27」= -27、「13世紀」= 1250、「1519–1522」取起始年 */
function yearOf(s){ const m = plain(s).match(/(前)?\s*(\d+)\s*(世紀)?/); if (!m) return 0; let n = +m[2]; if (m[3]) n = (n - 1) * 100 + 50; return m[1] ? -n : n; }
/* 臺灣史 / 世界史年表、臺灣古蹟:每列左邊色條＝所屬時期(臺灣史顏色同 ana.js 時間軸;古蹟看第 2 欄「年代」) */
function eraStyle(sec, r){
  const eras = sec.id === 'hist' || sec.id === 'heri' ? (window.ANAUI && ANAUI.era) : sec.id === 'whist' ? ERA_W : null;
  if (!eras) return '';
  const n = sec.id === 'hist' ? (parseInt(plain(r.c[0]), 10) || 0) : sec.id === 'heri' ? yearOf(r.c[1]) : yearOf(r.c[0]), e = eras.find(x => n >= x.s && n < x.e);
  return e ? ' style="border-left:4px solid ' + e.c + ';padding-left:10px"' : '';
}
function renderRow(sec, r, i, kw){
  const fields = r.c.slice(1).map((v,j)=>v==='—'?'':`<div class="lb nomask">${esc(sec.cols[j+1])}</div><div class="rv">${hl(v,kw)}</div>`).join('');
  const src = (r.src||[]).length ? r.src.map(srcLink).join('') : '<span class="nos">官方資料整理(歷屆未直接考)</span>';
  const tgb = r.f && TGCFG[sec.id] && window.TWGEO ? `<button type="button" class="tgb" data-tgf="${esc(r.f)}" data-tgt="${sec.id}">📍 圖上看</button>` : '';
  return `<div class="r" id="r-${sec.id}-${i}"${eraStyle(sec, r)}><div class="rk nomask">${hl(esc(plain(r.c[0])),kw)}</div><div class="rf">${fields}</div>
    <div class="meta nomask">${tgb}${src}</div></div>`;
}
/* 國家公園、國家風景區分布圖:編號＝表格順序,點地圖或圖例跳到那一列(twmap.js);搜尋時只畫符合的列 */
const MAPKEYS = { '參山':['獅頭山','梨山','八卦山'], '北海岸及觀音山':['北海岸及觀音山','觀音山'], '大鵬灣':['大鵬灣','小琉球'] };
/* 世界遺產:常考地點分布(worldmap.js),點的顏色＝遺產類型 */
const WH_MARKS = [
  { k: '黃石國家公園', label: '黃石', t: 'n' }, { k: '伊盧利薩特', label: '冰峽灣(格陵蘭)', t: 'n' },
  { k: '加拉巴哥群島', label: '加拉巴哥', t: 'n' }, { k: '馬丘比丘', t: 'm' },
  { k: '利物浦', label: '利物浦(2021 除名)', t: 'x' }, { k: '雅典', label: '雅典衛城', t: 'c' },
  { k: '阿布辛貝', t: 'c' }, { k: '塞倫蓋蒂', t: 'n' }, { k: '吳哥窟', label: '吳哥', t: 'c' },
  { k: '巴納韋梯田', label: '科迪勒拉梯田', t: 'c' }, { k: '濟州島', t: 'n' }, { k: '大堡礁', t: 'n' }
];
/* 世界地理之最:代表地點(worldmap.js);標籤＝之最 + 名稱 */
const WGEO_MARKS = [
  { k: '聖母峰', label: '最高:聖母峰', side: 'u' }, { k: '死海', label: '最低:死海', side: 'l' },
  { k: '貝加爾湖', label: '最深:貝加爾湖', side: 'u' }, { k: '伊盧利薩特', label: '最大島:格陵蘭', side: 'r' },
  { k: '大堡礁', label: '大堡礁', side: 'r' }, { k: '乞拉朋吉', label: '最多雨:乞拉朋吉', side: 'd' },
  { k: '阿他加馬', label: '最乾:阿他加馬', side: 'l' }, { k: '納米比沙海', label: '納米比沙漠', side: 'l' },
  { k: '維多利亞瀑布', label: '維多利亞瀑布', side: 'r' }, { k: '尼加拉瀑布', label: '尼加拉瀑布', side: 'r' },
  { k: '伊瓜蘇瀑布', label: '伊瓜蘇瀑布', side: 'r' }, { k: '的的喀喀湖', label: '的的喀喀湖', side: 'l' },
  { k: '大峽谷', label: '大峽谷', side: 'l' }, { k: '北角', label: '極光:北角', side: 'u' }
];
/* 氣候與季風:臺灣的地方風與季風現象(twmap.js) */
const CLIM_MARKS = [
  { k: '宜蘭', label: '蘭雨', side: 'd' }, { k: '新竹', label: '竹風、九降風', side: 'u' },
  { k: '臺東', label: '焚風', side: 'r' }, { k: '恆春', label: '落山風', side: 'l' },
  { k: '澎湖', label: '菜宅擋風', side: 'l' }, { k: '金門', label: '風獅爺' }
];
/* 臺灣古蹟:常考古蹟的位置(twmap.js);標籤＝該地的代表古蹟 */
const HERI_MARKS = [
  { k: '淡水', label: '紅毛城', side: 'l' }, { k: '和平島', label: '聖薩爾瓦多城', side: 'u' },
  { k: '臺北', label: '府城、總督府', side: 'r' }, { k: '新竹', label: '新竹火車站', side: 'l' },
  { k: '北埔', label: '金廣福', side: 'r' }, { k: '鹿港', label: '文開書院', side: 'l' },
  { k: '彰化', label: '扇形車庫', side: 'r' }, { k: '安平', label: '熱蘭遮城、億載金城', side: 'l' },
  { k: '臺南', label: '孔廟、州廳', side: 'r' }, { k: '鳳山', label: '鳳儀書院', side: 'l' },
  { k: '萬金', label: '萬金聖母聖殿', side: 'r' }, { k: '恆春', label: '恆春古城', side: 'l' },
  { k: '鵝鑾鼻', label: '鵝鑾鼻燈塔', side: 'r' }
];
/* 臺灣地理總圖(twgeo.js):各區的圖層、標示與圖例;標示點顏色同各區說明 */
const IGN = '#dc2626', SED = '#b45309', MET = '#7c3aed';

function mapFor(sec, idx){
  if (window.TWGEO && TGCFG[sec.id]) return TWGEO.widget(sec.id, TGCFG[sec.id]);
  if (sec.id === 'heri') return window.TWMAP ? '<figure class="amap nomask">' + TWMAP.svg({ marks: HERI_MARKS, labels: true, title: '常考古蹟的位置' }) + TWMAP.note + '<div class="twm-nt">四座龍山寺、王得祿墓、各地眷村沒有標在圖上;安平與臺南府城相距很近,標籤分開寫</div></figure>' : '';
  if (sec.id === 'clim') return window.TWMAP ? '<figure class="amap nomask">' + TWMAP.svg({ marks: CLIM_MARKS, labels: true, title: '臺灣的季風與地方風' }) + TWMAP.note + '<div class="twm-nt">東北季風(約 10 月到隔年 3 月)由東北方吹來,北部、東北部迎風多雨;西南季風(約 5–9 月)由西南方吹來,中南部夏雨集中</div></figure>' : '';
  if (sec.id === 'wgeo') return window.WMAP ? '<figure class="amap nomask">' + WMAP.svg({ view: 'world', marks: WGEO_MARKS, rivers: ['尼羅河', '亞馬遜河', '東非大裂谷'], seas: ['蘇必略湖'], title: '世界自然地理之最' }) + WMAP.note + '<div class="twm-nt">藍線＝尼羅河、亞馬遜河;咖啡色虛線＝東非大裂谷</div></figure>' : '';
  /* 臺灣史年表:各時期長度長條圖(ana.js);山脈:五大山脈走向 + 常考高峰 */
  if (sec.id === 'hist') return window.ANAUI ? '<figure class="amap nomask">' + ANAUI.eraBar() + '<div class="twm-nt">長條長度＝該時期的年數(戰後算到今年)</div></figure>' : '';
  if (sec.id === 'whist') return '<figure class="amap nomask"><div class="wera">' + ERA_W.map(e => '<span style="--c:' + e.c + '"><b>' + e.n + '</b>' + e.y + '</span>').join('') + '</div><div class="twm-nt">每列左邊的色條＝所屬時期(分期採常見劃分,各書略有不同)</div></figure>';
  if (sec.id === 'wh') return window.WMAP ? '<figure class="amap nomask">' + WMAP.svg({ view: 'world', marks: WH_MARKS, title: '常考世界遺產分布' }) + WMAP.typeLegend + WMAP.note + '</figure>' : '';
  if (!window.TWMAP || (sec.id !== 'np' && sec.id !== 'nsa')) return '';
  const marks = [], leg = [];
  idx.forEach(i => {
    const r = sec.rows[i];
    const name = plain(r.c[0]), keys = MAPKEYS[name] || [name], row = 'r-' + sec.id + '-' + i;
    keys.forEach(k => { if (TWMAP.get(k)) marks.push({ k, n: i + 1, c: sec.id, row }); });
    leg.push({ k: keys[0], n: i + 1, c: sec.id, row, label: name.replace(/(國家風景區|國家公園|國家自然公園)$/, '') });
  });
  return '<figure class="amap nomask">' + TWMAP.svg({ marks, title: sec.t + '分布圖' }) + TWMAP.legend(leg) + TWMAP.note + '</figure>';
}
function qaCount(sec){ return sec.rows.reduce((n,r)=>n+(r.qa||[]).length,0); }
function render(){
  $('secRow').innerHTML = [['all','全部']].concat(D.sections.map(s=>[s.id, s.icon+' '+s.t])).map(([v,l])=>
    `<button class="chip${SEC===v?' on':''}" type="button" data-v="${v}">${esc(l)}</button>`).join('');
  const kw = $('q').value.trim();
  const k = kw.toLowerCase();
  let html = '';
  D.sections.forEach(sec=>{
    if (SEC !== 'all' && sec.id !== SEC) return;
    const idx = [];
    sec.rows.forEach((r,i)=>{ if (!k || r.c.map(plain).join(' ').toLowerCase().includes(k)) idx.push(i); });
    if (!idx.length) return;
    const open = kw || SEC !== 'all' ? ' open' : '';
    html += `<details class="sec" id="s-${sec.id}"${open}><summary class="nomask"><span class="si">${sec.icon}</span><span><span class="st">${esc(sec.t)}</span><span class="sd">${esc(sec.desc)} · ${sec.rows.length} 列</span></span></summary>
      <div class="sb"><div class="note">${sec.note}</div>${mapFor(sec, idx)}${idx.map(i=>renderRow(sec, sec.rows[i], i, kw)).join('')}
      <div class="qz nomask"><button type="button" data-pair="${sec.id}">🎯 配對小測 ${qaCount(sec)} 題</button><button class="o" type="button" data-quiz="${sec.id}">📝 歷屆原題 ${QUIZ_N} 題</button><button class="o" type="button" data-quiz="${sec.id}" data-all="1">全部相關原題</button></div>
      <div class="gq nomask" id="gq-${sec.id}" hidden></div></div></details>`;
  });
  $('app').innerHTML = html || `<div class="empty">找不到「${esc(kw)}」<br><span style="font-size:.85rem">換個關鍵字或切到「全部」</span></div>`;
  MASK.prepare($('app'));
  MASK.set($('app'), MASKON);
  const row = $('secRow'), on = row.querySelector('.chip.on');
  if (on) row.scrollLeft = Math.max(0, on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2);
}

/* ===== 歷屆原題:本區出處題 + 依規則篩出的相關題(排除法規已變、官方答案不適用的題)===== */
function quizList(sec){
  return PRACTICE.load('gh').then(d=>{
    const seen = new Set(), list = [];
    const add = q=>{
      if (!q) return;
      const st = window.STALE && STALE.note('gh', q);
      if (st && st.k === 'old') return;
      const id = PRACTICE.key(q); if (seen.has(id)) return; seen.add(id);
      list.push({ s:'gh', q });
    };
    sec.rows.forEach(r=>(r.src||[]).forEach(sr=>{
      const m = sr.match(/^([gl])(\d+)-(\d+)$/);
      if (m) add(d.map[(m[1]==='g'?'guide':'leader')+'-'+m[2]+'-'+m[3]]);
    }));
    d.bank.forEach(q=>{
      const a = d.ana[PRACTICE.key(q)] || {};
      const tx = q.stem + ' ' + q.opts.join(' ');
      if ((!sec.quiz.c || q.c === sec.quiz.c) && sec.quiz.tt.test(a.tt || '') && sec.quiz.kw.test(tx) && !(sec.quiz.nkw && sec.quiz.nkw.test(tx))) add(q);
    });
    return list;
  });
}

/* ===== 配對小測:用表上內容即時出題(不進錯題本,只計入今日練習)===== */
function pairItems(sec){
  const out = [];
  sec.rows.forEach((r,ri)=>(r.qa||[]).forEach(x=>out.push({ q:x[0], a:x[1], cat:x[2], d:x[3], ri })));
  return out;
}
function pairOpts(sec, it, all){
  let ds = it.d ? it.d.slice() : shuffle([...new Set(all.filter(x=>x.cat===it.cat && x.a!==it.a).map(x=>x.a))]).slice(0,3);
  ds = ds.filter(x=>x!==it.a).slice(0,3);
  return shuffle([it.a].concat(ds));
}
const PQ = {};
function pairStart(id){
  const sec = D.sections.find(s=>s.id===id), all = pairItems(sec);
  PQ[id] = { sec, all, list: shuffle(all.slice()), i:0, ok:0, wrong:[] };
  const box = $('gq-'+id); box.hidden = false;
  pairShow(id);
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function pairShow(id){
  const st = PQ[id], box = $('gq-'+id);
  if (st.i >= st.list.length) return pairDone(id);
  const it = st.list[st.i], opts = pairOpts(st.sec, it, st.all);
  st.cur = { it, opts };
  box.innerHTML = `<span class="sc">${st.i+1} / ${st.list.length} · ✓ ${st.ok}</span><span class="tag">${esc(st.sec.icon+' '+st.sec.t)}</span>
    <div class="pr">${esc(it.q)} → ?</div>` + opts.map((o,i)=>`<button class="op" type="button" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('') + '<div class="fbk"></div>';
}
function pairAnswer(id, p){
  const st = PQ[id], box = $('gq-'+id), { it, opts } = st.cur, ans = opts.indexOf(it.a), ok = p === ans;
  if (box.querySelector('.op:disabled')) return;
  box.querySelectorAll('.op').forEach((x,i)=>{ x.disabled = true; if (i===ans) x.classList.add('ok'); else if (i===p) x.classList.add('no'); });
  if (ok) st.ok++; else st.wrong.push(it);
  PRACTICE.addDaily(1);
  box.querySelector('.sc').textContent = `${st.i+1} / ${st.list.length} · ✓ ${st.ok}`;
  const row = st.sec.rows[it.ri];
  box.querySelector('.fbk').innerHTML = `<div class="ex">${ok?'✅ 答對!':'✗ 答錯,正解:<strong>'+esc(it.a)+'</strong>'}<br>出自「${esc(plain(row.c[0]))}」:${esc(plain(row.c.slice(1).filter(v=>v!=='—').join(' · ')))}
    <br><button class="lnk" type="button" data-row="r-${st.sec.id}-${it.ri}">看表上這一列 ↑</button></div>
    <div class="act"><button type="button" data-next="${id}">${st.i+1 < st.list.length ? '下一題 →' : '看成績'}</button></div>`;
}
function pairDone(id){
  const st = PQ[id], box = $('gq-'+id), n = st.list.length;
  box.innerHTML = `<span class="tag">${esc(st.sec.icon+' '+st.sec.t)} · 配對小測</span><div class="big">${st.ok} / ${n}</div>
    <div style="text-align:center;color:var(--sub);font-size:.86rem">${st.ok===n?'全對,這區記得很熟 👍':'答錯的回表上再看一次,過幾天再測'}</div>
    ${st.wrong.length?'<ul>'+st.wrong.map(it=>`<li>${esc(it.q)} → <strong>${esc(it.a)}</strong> <button class="lnk" type="button" data-row="r-${st.sec.id}-${it.ri}">看這列</button></li>`).join('')+'</ul>':''}
    <div class="act">${st.wrong.length?`<button type="button" data-redo="${id}">只重測答錯的 ${st.wrong.length} 題</button>`:''}<button class="o" type="button" data-again="${id}">再測一次</button></div>`;
}
function jumpRow(rid){
  const el = $(rid); if (!el) return;
  const det = el.closest('details'); if (det) det.open = true;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1400);
}

$('secRow').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if (!b) return;
  SEC = b.dataset.v; try { localStorage.setItem('pref_atlas_sec', SEC); } catch(err){}
  history.replaceState(null, '', SEC==='all' ? location.pathname + location.search : '#'+SEC);
  render(); window.scrollTo(0,0);
});
window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if (IDS.includes(h) && h!==SEC){ SEC = h; render(); } });
$('app').addEventListener('click', e=>{
  let b;
  if ((b = e.target.closest('[data-pair]'))) return pairStart(b.dataset.pair);
  if ((b = e.target.closest('.gq .op'))) return pairAnswer(b.closest('.gq').id.slice(3), +b.dataset.i);
  if ((b = e.target.closest('[data-next]'))) { PQ[b.dataset.next].i++; return pairShow(b.dataset.next); }
  if ((b = e.target.closest('[data-again]'))) return pairStart(b.dataset.again);
  if ((b = e.target.closest('[data-redo]'))) {
    const id = b.dataset.redo, st = PQ[id];
    PQ[id] = { sec: st.sec, all: st.all, list: shuffle(st.wrong.slice()), i:0, ok:0, wrong:[] };
    return pairShow(id);
  }
  if ((b = e.target.closest('[data-row]'))) return jumpRow(b.dataset.row);
  if ((b = e.target.closest('[data-quiz]'))) {
    const sec = D.sections.find(s=>s.id===b.dataset.quiz), all = !!b.dataset.all;
    b.disabled = true;
    quizList(sec).then(list=>{
      b.disabled = false;
      MINIQUIZ.start({ title: sec.icon+' '+sec.t+(all?' · 全部相關原題':' · 歷屆原題'), list, n: all ? 0 : QUIZ_N });
    }).catch(()=>{ b.disabled = false; });
  }
});
$('maskBtn').addEventListener('click', ()=>{
  MASKON = !MASKON;
  $('maskBtn').classList.toggle('on', MASKON);
  $('maskBtn').textContent = MASKON ? '👀 顯示全部' : '🙈 遮住重點';
  $('resetBtn').hidden = !MASKON;
  MASK.reset($('app')); MASK.set($('app'), MASKON);
});
$('resetBtn').addEventListener('click', ()=>MASK.reset($('app')));
let tmr; $('q').addEventListener('input', ()=>{ clearTimeout(tmr); tmr = setTimeout(render, 200); });
window.addEventListener('beforeprint', ()=>document.querySelectorAll('details.sec').forEach(d=>d.open=true));
$('basis').textContent = `資料核對日期 ${D.updated} · ${D.basis}`;
render();
</script>
</body>
</html>
