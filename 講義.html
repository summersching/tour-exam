function groupsOf(J){
  const G = GROUPS[J.subj]; if (!G) return [{ name:'', k:0, chs:J.chapters }];
  const out = G.map(([name,a,b],i)=>({ name, k:i%6+1, chs:J.chapters.filter(c=>c.no>=a&&c.no<=b) })).filter(g=>g.chs.length);
  const rest = J.chapters.filter(c=>!out.some(g=>g.chs.includes(c)));
  if (rest.length) out.push({ name:'其他', k:out.length%6+1, chs:rest });
  return out;
}

const JY = {}, JYLOAD = {};   // JYLOAD:載入中的 Promise(同一科只插入一次 script,避免重複宣告)
function loadSubj(k){
  const S = SUBJS.find(x=>x.k===k);
  if (!S || !S.file) return Promise.resolve(null);
  if (JY[k]) return Promise.resolve(JY[k]);
  if (JYLOAD[k]) return JYLOAD[k];
  const pre = PRACTICE.gv(S.v) ? Promise.resolve() : PRACTICE.loadJs(S.file);
  JYLOAD[k] = pre.then(()=>{ JY[k] = PRACTICE.gv(S.v) || null; return JY[k]; }).catch(()=>{ delete JYLOAD[k]; return null; });
  return JYLOAD[k];
}
function bankOf(k){ return (PRACTICE.S ? PRACTICE.S(k) : PRACTICE.SUBJ[k]) ? PRACTICE.load(k).catch(()=>null) : Promise.resolve(null); }   // v251 外語由 PRACTICE.S 取設定
function chapterQs(ch, d){
  if (!d) return [];
  const m = ch.match || {};
  return d.bank.filter(q=>{
    const k = PRACTICE.key(q), text = q.stem + ' ' + (q.opts||[]).join(' ');
    if (m.add && m.add.includes(k)) return true;   // v211 個別題目標在其他主題,但屬於本章
    if (m.ex && m.ex.includes(k)) return false;    // v231 個別題目雖符合條件,但歸到別章
    if (m.c && !m.c.includes(q.c)) return false;   // v231 只取導遊(guide)或領隊(leader)題
    if (m.not && m.not.test(text)) return false;   // v231 排除含關鍵字的題(例如國家公園題屬觀光資源第 1 章)
    if (m.kw) return m.kw.test(text);
    const a = d.ana[k] || {};
    return (m.t||[]).includes(a.t) && (m.tt||[]).includes(a.tt);
  });
}
function isOld(k, q){ const n = window.STALE && STALE.note(k, q); return !!(n && n.k === 'old'); }
function stats(k, ch, d){
  const qs = chapterQs(ch, d); if (!d) return null;
  const years = [...new Set(d.bank.map(q=>+q.y))].sort((a,b)=>a-b);
  const by = {}; years.forEach(y=>by[y]=0); qs.forEach(q=>by[+q.y]++);
  const recent = years.slice(-3);
  return { n: qs.length, guide: qs.filter(q=>q.c==='guide').length, leader: qs.filter(q=>q.c==='leader').length,
    years, by, recent: qs.filter(q=>recent.includes(+q.y)).length, quiz: qs.filter(q=>!isOld(k,q)) };
}
function chartSvg(st){
  const ys = st.years, max = Math.max(1, ...ys.map(y=>st.by[y])), w = 360, bw = Math.floor((w - 20) / ys.length), recent = ys.slice(-3);
  let h = '';
  ys.forEach((y,i)=>{
    const v = st.by[y], bh = Math.round(v / max * 64), x = 10 + i*bw + 4, top = 84 - bh;
    h += `<rect class="bar${recent.includes(y)?' r':''}" x="${x}" y="${top}" width="${bw-8}" height="${Math.max(bh,1)}" rx="3"/>`
       + `<text class="ts" x="${x + (bw-8)/2}" y="${top-4}" text-anchor="middle">${v}</text>`
       + `<text class="ts" x="${x + (bw-8)/2}" y="100" text-anchor="middle">${y}</text>`;
  });
  return `<figure class="jfig"><figcaption>📊 各年度題數(黃色 = 近 3 年)</figcaption><svg viewBox="0 0 ${w} 106" role="img" aria-label="各年度題數">${h}</svg></figure>`;
}

function tableHtml(head, rows, stack){
  // 第一欄都很短(≤ 6 字)才整欄不換行;長文字的第一欄改成保底寬度,避免整張表被撐到要左右捲

  const plain = x => String(x).replace(/<[^>]*>/g, '').replace(/&[a-z]+;/g, '·');

  return `<div class="tw"><table class="${nw ? 'nw' : 'wr'}${stack ? ' stk' : ''}"><thead><tr>${head.map(x=>`<th${plain(x).length > 6 ? ' class="w"' : ''}>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${head[i] || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* v263 日語章同樣用這四種區塊:單字表第 2 欄是假名讀音(不是音標)、🔊 唸假名;例子、會話、文法裡可用 {漢字|かな} 注音;
   標題列多一個「🙈 遮住讀音」(自我測驗);發音提醒改叫「讀音提醒」。
   v255 英語講義新格式的四種區塊:
   vocab 單字表 items:[字, 音標, 詞性, 中文, 例子(英), 例子(中)];dlg 情境會話 who:[角色…]、lines:[[第幾個角色, 英文, 中文]…](me 那一方靠右,預設 1);
   gram 文法重點 pat:[句型…]、points:[說明…]、egs:[[英, 中]…];pron 發音提醒 items:[字, 音標, 說明]。
   🔊 與例句、會話泡泡都帶 data-say(要唸的英文);**字** 會標紅 */
const RUBY = /\{([^{}|]+)\|([^{}|]+)\}/g;   // v263 日語注音:{漢字|かな}
const rb = s => String(s).replace(RUBY, '<ruby>$1<rt>$2</rt></ruby>');   // 畫面顯示成 ruby(s 已經 esc)

}

/* v220 重點紅字:重點條列、重點表、易混比較裡的數字與日期(期限、金額、人數、年份)自動標紅;
   「」『』引號內(原文用語或錯誤選項)、括號內與「N 年考題」(考題出處)、「第 N 條」不自動標。
   內容檔可用 **關鍵詞** 手動標紅(條列、表格、解題技巧、易錯陷阱都適用);解題技巧與易錯陷阱只標手動標記,不自動標數字(避免把錯誤數字標成重點) */
const HL_SKIP = /「[^」]*」|『[^』]*』|[(（][^()（）]*[)）]|第\s*\d+\s*(?:條|項|款|章|節|屆|類)(?:\s*之\s*\d+)?/g;
const HL_NUM = /\d{2,3}\/\d{1,2}\/\d{1,2}|(?:新臺幣\s*)?\d[\d,]*(?:\.\d+)?(?:\s*[~～至到]\s*\d[\d,]*(?:\.\d+)?)?\s*(?:萬元|億元|元|美元|歐元|公斤|公尺|公分|公里|個工作天|工作天|小時|分鐘|個月|月|週|天|日|年|歲|人|次|倍|%|％)(?!考題)/g;
const HL_MARK = /\*\*([^*]+?)\*\*/g;
function hlNum(s){
  let out = '', last = 0;
  s.replace(HL_SKIP, (m, i) => { out += s.slice(last, i).replace(HL_NUM, '<b class="kn">$&</b>') + m; last = i + m.length; return m; });
  return out + s.slice(last).replace(HL_NUM, '<b class="kn">$&</b>');
}
function hl(s){   // s 已經過 esc()
  s = rb(s);   // v263 日語注音
  let out = '', last = 0;
  s.replace(HL_MARK, (m, t, i) => { out += hlNum(s.slice(last, i)) + '<b class="kn">' + t + '</b>'; last = i + m.length; return m; });
  return out + hlNum(s.slice(last));
}
function mk(s){ return rb(s.replace(HL_MARK, '<b class="kn">$1</b>')); }   // 只轉手動標記;v263 {漢字|かな} 顯示成注音
/* v253 長段落自動條列:依句號、分號拆成一條一條(只在 <b>、括號、引號之外拆;分號前不到 18 字不拆);
   每條開頭是「短語:」的,把短語標成小標。內容文字不變,只改排版 */
function pHtml(html){
  const parts = []; let buf = '', depth = 0, tag = false, bold = 0;
  const plainLen = s => s.replace(/<[^>]+>/g, '').length;
  const push = () => { const t = buf.trim(); if (t) parts.push(t); buf = ''; };
  for (let i = 0; i < html.length; i++){
    const c = html[i];
    if (c === '<'){ tag = true; if (html.startsWith('<b>', i)) bold++; else if (html.startsWith('</b>', i)) bold--; }
    if (tag){ buf += c; if (c === '>') tag = false; continue; }
    if ('(「『'.includes(c)) depth++; else if (')」』'.includes(c)) depth = Math.max(0, depth - 1);
    if ((c === '。' || c === ';') && depth === 0 && bold === 0){
      if (c === ';' && plainLen(buf) < 18){ buf += c; continue; }
      push(); continue;
    }
    buf += c;
  }
  push();
  const lead = s => { const m = s.match(/^([^<:。;,()]{2,14}):(?!\d)/); return m ? '<span class="ld">' + m[1] + ':</span>' + s.slice(m[0].length) : s; };
  if (parts.length < 2) return `<p class="jp">${lead(html)}</p>`;
  return `<ul class="jp">${parts.map(x=>`<li>${lead(x)}</li>`).join('')}</ul>`;
}
function blockHtml(k, b, d){
  if (cfg.mode === 'quick' && !QUICK[b.t]) return '';
  switch (b.t){
    case 'h': return `<h3 class="jh">${esc(b.text)}</h3>`;
    case 'p': return pHtml(b.html);
    case 'key': return `<div class="jkeyb"><div class="mh">📌 重點整理</div><ul class="jkey">${b.items.map(x=>`<li>${hl(esc(x))}</li>`).join('')}</ul></div>`;
    case 'fig': return figHtml(b);
    case 'link': return `<a class="jlink" href="${esc(b.href)}">${esc(b.text)}</a>`;
    case 'table': return `<div class="jtbl"><div class="th">📋 ${esc(b.h)}</div>${tableHtml(b.head.map(esc), b.rows.map(r=>r.map(c=>hl(esc(c)))), b.stack)}${b.note?`<div class="tn">${esc(b.note)}</div>`:''}</div>`;
    case 'mn': return mnHtml(b, false);
    case 'tip': return `<div class="jtip"><div class="mh">🎯 解題技巧</div><ul>${b.items.map(x=>`<li>${mk(esc(x))}</li>`).join('')}</ul></div>`;
    case 'trap': return `<div class="jtrap"><div class="mh">⚠ 易錯陷阱</div><ul>${b.items.map(x=>`<li>${mk(esc(x))}</li>`).join('')}</ul></div>`;
    case 'cmp': return cmpHtml(b);
    case 'stale': return `<div class="jstale">⏱ <b>時效提醒</b>:${esc(b.text)} <a href="法規異動.html">看「新制與法規異動」→</a></div>`;
    case 'law': return `<div class="jlaw"><div class="mh">⚖️ 條文原文</div><dl>${b.items.map(([n,t])=>`<dt>${esc(n)}${lawRefLink(n)}</dt><dd>${esc(t)}</dd>`).join('')}</dl></div>`;
    case 'ex': return exHtml(k, b, d);
    case 'self': return selfHtml(b);
    case 'vocab': return vocabHtml(b);
    case 'dlg': return dlgHtml(b);
    case 'gram': return gramHtml(b);
    case 'pron': return pronHtml(b);
    default: return '';
  }
}

/* ===== 畫面 ===== */
let CUR = null;   // 目前章節 { k, ch, d, st }
/* 條文原文 → 「🔎 考過 N 題」連到條文反查(law_ref.js 延遲載入;歷屆詳解有引用這一條才顯示) */
const LAWDT = /^(.+?)第\s*(\d+)(?:\s*-\s*(\d+))?\s*條(?:\s*之\s*(\d+))?/;
function lawRefLink(n){
  const m = String(n).match(LAWDT); if (!m) return '';
  const art = m[2] + (m[3] ? '-' + m[3] : m[4] ? '-' + m[4] : '');
  return ` <a class="lref" hidden href="條文反查.html?law=${encodeURIComponent(m[1].trim())}&art=${encodeURIComponent(art)}" data-law="${esc(m[1].trim())}" data-art="${art}"></a>`;
}
let lawRefP = null;
function hydrateLawRef(){
  const els = [...document.querySelectorAll('a.lref[hidden]')]; if (!els.length) return;
  lawRefP = lawRefP || (PRACTICE.gv('LAW_REF') ? Promise.resolve() : PRACTICE.loadJs('law_ref.js'));

  const secs = ch.blocks.filter(b=>b.t==='h');
  /* v253 置頂的章節選單列:上一章 / 章節選單(可回目錄、直接跳章)/ 本章小節 / 下一章 */
  const nav = `<div class="chnav"><button class="nb" type="button" ${prev?`data-go="${esc(prev.id)}"`:'disabled'} aria-label="上一章" title="上一章">←</button>
    <select class="chsel" aria-label="章節選單"><option value="@toc">📑 回章節目錄</option>${chOptions(J, ch.id)}</select>
    <select class="secsel" aria-label="本章小節"><option value="">§ 本章小節</option>${secs.map((b,n)=>`<option value="${n}">${esc(b.text)}</option>`).join('')}</select>
    <button class="nb" type="button" ${next?`data-go="${esc(next.id)}"`:'disabled'} aria-label="下一章" title="下一章">→</button></div>`;
  const exam = st ? `<div class="exam">📊 <b>本章考情</b>:歷屆(${st.years[0]}~${st.years[st.years.length-1]} 年)共 <b>${st.n}</b> 題(導遊 ${st.guide}、領隊 ${st.leader}),近 3 年 <b>${st.recent}</b> 題;章末測驗可出 ${st.quiz.length} 題(已排除法規已修正題)。</div>${chartSvg(st)}` : '';
  $('app').innerHTML = nav + `<div class="card chhead"><div class="chno">${esc(J.name)} · 第 ${ch.no} 章</div><div class="cht">${esc(ch.t)}</div><div class="chs sub" title="點一下展開或收合">${esc(ch.sub)}</div>
    <div class="chs">資料截至 ${esc(ch.ver)}</div>
    <div class="tools"><span class="seg"><button type="button" data-mode="full" class="${cfg.mode==='full'?'on':''}">📖 完整閱讀</button><button type="button" data-mode="quick" class="${cfg.mode==='quick'?'on':''}">⚡ 快速複習</button></span>
    <button class="tbtn" type="button" data-act="read">${p.read?'✅ 已讀':'標記已讀'}</button><button class="tbtn" type="button" data-act="tts">🔊 朗讀</button><button class="tbtn" type="button" data-act="print">🖨 列印</button></div></div>`
    + exam + bodyHtml(k, ch, d)
    + `<div class="end"><button class="tbtn fill" type="button" data-act="quiz"${st&&st.quiz.length?'':' disabled'}>📝 章末測驗 ${QUIZ_N} 題</button><button class="tbtn" type="button" data-act="quizall"${st&&st.quiz.length?'':' disabled'}>📚 本章全部 ${st?st.quiz.length:0} 題</button>
      <button class="tbtn" type="button" data-act="read">${p.read?'✅ 已讀':'標記已讀'}</button>
      ${prev?`<button class="tbtn" type="button" data-go="${esc(prev.id)}">← 上一章</button>`:''}${next?`<button class="tbtn" type="button" data-go="${esc(next.id)}">下一章 →</button>`:''}
      <select class="chsel" aria-label="章節選單"><option value="">📑 章節選單:跳到其他章…</option><option value="@toc">← 回章節目錄</option>${chOptions(J)}</select></div>`
    + (p.best!=null?`<div class="tip0">📝 章末測驗:最佳 ${p.best}%,上次 ${p.last}%</div>`:'');
  hydrateLawRef();
}
function openChapter(id){
  const k = id.split('-')[0];
  cfg.subj = k; cfg.view = 'ch'; cfg.ch = id; saveCfg();
  history.replaceState(null, '', '?ch=' + encodeURIComponent(id) + (cfg.mode==='quick'?'&mode=quick':''));
  renderBar(); $('app').innerHTML = '<div class="empty">載入中…</div>';
  Promise.all([loadSubj(k), bankOf(k)]).then(([J, d])=>{
    const ch = J && J.chapters.find(c=>c.id===id);
    if (!ch){ cfg.view = 'toc'; cfg.ch = null; saveCfg(); render(); return; }
    CUR = { k, ch, d, st: stats(k, ch, d) };
    renderBar(); renderChapter(); window.scrollTo(0,0);
  });
}
function render(){
  TTS.stop(true); SAY.stop();
  if (cfg.view === 'ch' && cfg.ch) return openChapter(cfg.ch);
  history.replaceState(null, '', location.pathname);
  renderBar();
  const S = SUBJS.find(x=>x.k===cfg.subj);
  if (!S.file){ $('app').innerHTML = noData(); return; }
  $('app').innerHTML = '<div class="empty">載入中…</div>';
  loadSubj(cfg.subj).then(J=>{
    renderBar();
    if (!J){ $('app').innerHTML = noData(); return; }
    if (cfg.view === 'toc') renderToc(J); else renderAgg(J, cfg.view);
  });
}
function startQuiz(all){
  const { k, ch, st } = CUR; if (!st || !st.quiz.length) return;
  MINIQUIZ.start({ title: '📝 第 ' + ch.no + ' 章 章末測驗', list: st.quiz.map(q=>({ s:k, q })), n: all ? 0 : QUIZ_N,
    onResult: (ok, n, info)=>{ if (info && (info.redo || info.partial)) return;   // 「只練錯的」與中途關閉不算整章成績
      const pct = Math.round(ok / n * 100), p = prog()[ch.id] || {};
      setProg(ch.id, { last: pct, best: Math.max(pct, p.best == null ? 0 : p.best) }); if (cfg.view === 'ch' && CUR && CUR.ch === ch) renderChapter(); } });
}

document.querySelector('.bar').addEventListener('click', e=>{
  const s = e.target.closest('[data-subj]');
  if (s){ cfg.subj = s.dataset.subj; cfg.view = cfg.view === 'ch' ? 'toc' : cfg.view; cfg.ch = null; cfg.grp = 'all'; saveCfg(); render(); return; }
  const v = e.target.closest('[data-view]');
  if (v){ cfg.view = v.dataset.view; cfg.ch = null; saveCfg(); render(); }
});
$('app').addEventListener('click', e=>{
  /* v255 英語發音:🔊、例句、會話泡泡 → 唸那個字或那一句;▶ 播放整段會話;🙈 遮住 / 顯示中文(自測) */
  const dp = e.target.closest('[data-dplay]'); if (dp){ SAY.play(dp.closest('.jdlg'), dp); return; }
  const vy = e.target.closest('[data-vy]'); if (vy){ const h = vy.closest('.jvoc, .jdlg').classList.toggle('hidey'); vy.textContent = h ? '👀 顯示讀音' : '🙈 遮住讀音'; vy.classList.toggle('on', h); return; }   // v263 日語:遮住假名讀音自我測驗
  const vz = e.target.closest('[data-vz]'); if (vz){ const h = vz.closest('.jvoc, .jdlg').classList.toggle('hidez'); vz.textContent = h ? '👀 顯示中文' : '🙈 遮住中文'; vz.classList.toggle('on', h); return; }
  const sy = e.target.closest('[data-say]'); if (sy){ SAY.say(sy.dataset.say, sy.closest('.vrow, .geg, .prow, .db') || sy); return; }
  if (TTS.on && !e.target.closest('button, a, input')) TTS.jump(e.target);   // 朗讀中點區塊 → 從那裡開始
  const ans = e.target.closest('.ans'); if (ans){ ans.classList.toggle('mask'); return; }
  const mn = e.target.closest('.jmn.hide'); if (mn){ mn.classList.remove('hide'); return; }
  const gp = e.target.closest('[data-grp]');   // v253 目錄分組標籤:直接重畫目錄,保留標籤列的捲動位置
  if (gp){ cfg.grp = gp.dataset.grp; saveCfg(); const J = JY[cfg.subj], x = $('grpRow') ? $('grpRow').scrollLeft : 0;
    if (J){ renderToc(J); if ($('grpRow')) $('grpRow').scrollLeft = x; } else render(); return; }
  const sb = e.target.closest('.chhead .sub'); if (sb){ sb.classList.toggle('open'); return; }                    // v253 章首重點:點一下展開 / 收合
  const a = e.target.closest('[data-ch]'); if (a){ e.preventDefault(); openChapter(a.dataset.ch); return; }
  const g = e.target.closest('[data-go]'); if (g){ openChapter(g.dataset.go); return; }
  const m = e.target.closest('[data-mode]');
  if (m){ cfg.mode = m.dataset.mode; saveCfg(); history.replaceState(null, '', '?ch=' + encodeURIComponent(CUR.ch.id) + (cfg.mode==='quick'?'&mode=quick':'')); renderChapter(); return; }
  if (e.target.id === 'maskAll'){ cfg.mask = !cfg.mask; saveCfg(); render(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'toc'){ cfg.view = 'toc'; cfg.ch = null; saveCfg(); render(); window.scrollTo(0,0); }
  else if (act === 'read'){ const p = prog()[CUR.ch.id] || {}; setProg(CUR.ch.id, { read: p.read ? null : Date.now() }); renderChapter(); }
  else if (act === 'print') window.print();
  else if (act === 'tts'){ SAY.stop(); TTS.start(0); }
  else if (act === 'quiz') startQuiz(false);
  else if (act === 'quizall') startQuiz(true);
});

/* v253 章節選單:目錄 / 章內置頂列 / 章末的選單跳章,或回目錄;小節選單捲到該小節;總表頁跳到某一章 */
$('app').addEventListener('change', e=>{
  const s = e.target, v = s.value;
  if (s.matches('.chsel, #tocJump')){ if (!v) return;
    if (v === '@toc'){ cfg.view = 'toc'; cfg.ch = null; saveCfg(); render(); window.scrollTo(0,0); } else openChapter(v); }
  else if (s.matches('.secsel')){ const el = document.getElementById('sec-' + v); s.value = ''; if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }
  else if (s.id === 'aggJump'){ const el = v && document.querySelector('.it[data-agg="' + v + '"]'); s.value = ''; if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }
});
$('ttsBar').addEventListener('click', e=>{ const b = e.target.closest('[data-tts]'); if (b) TTS.act(b.dataset.tts); });
window.addEventListener('pagehide', ()=>{ TTS.stop(true); SAY.stop(); });
Promise.all(SUBJS.filter(s=>s.file).map(s=>loadSubj(s.k))).then(()=>renderBar());   // 先載入有內容的科目,顯示章數
render();
</script>
</body>
</html>
