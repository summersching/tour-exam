  /* v285 重點整理卡:原本畫成「方框由上而下排列」的純文字圖改成條列卡(左欄標題、右欄說明;手機改上下排);標題用所在小節的強調色 */

  /* ===== v253 閱讀體驗改版 ===== */
  /* 配色:各科主色(body[data-sj]);小節與分組輪流用 6 種強調色(.k1~.k6:--ac 強調色、--acb 淡底;--on 是強調色上的文字) */

const VIEWS = [['toc','📑 章節'],['mn','🎵 口訣總表'],['fig','🖼 圖解與整理卡'],['cmp','⚖️ 易混比較']];
/* v277 🔥 高頻字句(英語、日語):依歷屆考題統計出題次數 ——
   英語:題目難字表(單字、片語),考 3 次以上;日語:文法題考的句型(考 2 次以上)與詳解語彙(考 2 次以上);
   最後附講義各章的句型總表。每項有 🔊、考過幾次、在講義第幾章(點了直接開該章) */
const HOT_SUBJ = ['en', 'jp'];
const viewsOf = k => HOT_SUBJ.includes(k) ? [VIEWS[0], ['hot', '🔥 高頻字句'], ...VIEWS.slice(1)] : VIEWS;   // 排在「章節」後面,手機上不會被切到畫面外
function hotPat(tt){   // 日語文法題的細類 → 句型(去掉「自動詞+」等前綴;單一動詞、名詞的細類不算句型)
  const s = String(tt || '').trim();
  if (/^(自動詞|他動詞|動詞|名詞|副詞|形容詞)\(/.test(s)) return '';
  const m = s.match(/^助詞\((.{2,})\)$/); if (m) return '〜' + m[1];
  if (/^助詞/.test(s)) return '';
  const p = s.replace(/^[^+]*\+/, '').replace(/^〜/, '');
  return p ? '〜' + p : '';
}
/* v298 🔮 可能會考(推估):歷屆當過 2 次以上干擾選項、還沒當過正解的字詞(出題者用過、之後可能改當正解;只是推估,僅供參考)

const GUESS_STOP = new Set('a an the in at on of to for with by from into onto upon over under between among through during before after above below off out up down about since but and or so as if than then that which who whom whose what when where while because although though unless until it its they them their he she we you me my your our his her be is are was were been being do does did have has had will would can could shall should may might must not no yes too very much many more most some any all each every both either neither none other another such this these those there here how why just only also even still yet already ever never'.split(' '));
function guessList(d, JP){
  const M = new Map();
  d.bank.forEach(q => {
    if (q.psg || !Array.isArray(q.opts)) return;
    const acc = SCORE.acc(q); if (!acc.length) return;   // 送分題沒有正解,不算
    const a = JP ? (d.ana[PRACTICE.key(q)] || {}) : null;
    q.opts.forEach((o, i) => {
      let w, z;
      if (JP){
        const oz = Array.isArray(a.oz) ? String(a.oz[i] || '') : '';
        w = String(o).trim(); z = oz.replace(/\s*[(（][^()（）]*[)）]\s*$/, '').trim();
        if (!w || w.length < 3 || w.length > 12 || /\s/.test(w) || /誤/.test(oz) || /^[(（]/.test(oz)) return;
      } else {
        const m = String(o).match(/^([A-Za-z][A-Za-z' .-]*?)\s*([\u4e00-\u9fff].*)?$/); if (!m) return;
        w = m[1].trim().toLowerCase(); z = (m[2] || '').trim();
        if (!w || w.split(/\s+/).length > 4 || (!/\s/.test(w) && (w.length < 4 || GUESS_STOP.has(w))) || /無此|錯誤|不存在/.test(z)) return;
      }
      let e = M.get(w); if (!e){ e = { w, z: '', ans: 0, n: 0 }; M.set(w, e); }
      if (acc.includes(i)) e.ans++; else e.n++;
      if (!e.z && z) e.z = z;
    });
  });
  return [...M.values()].filter(e => e.ans === 0 && e.n >= 2 && e.z).sort((a, b) => b.n - a.n || a.w.localeCompare(b.w, JP ? 'ja' : 'en'));   // 沒有中文意思的不列
}
function renderHot(J){
  const k = cfg.subj, JP = k === 'jp';
  $('app').innerHTML = '<div class="empty">統計中…</div>';
  bankOf(k).then(d => {
    if (!d || cfg.view !== 'hot' || cfg.subj !== k) return;
    const own = {}; J.chapters.forEach(ch => (ch.match.add || []).forEach(x => { own[x] = ch; }));

   分配方法:小節文字與題目(題幹 + 選項)取詞元(中文、日文取相鄰兩字,英文取 3 個字母以上的單字),共同詞元依稀有度加分,分到分數最高的小節
   本章相關新制:newlaw.js 的新制卡,相關歷屆題屬於本章就列出(那些舊題的答案可能已改)
   考前速記:把本章的口訣、有數字的表格、易錯陷阱、自我檢測集中在一個視窗;外語:本章最常考的字、句型、發音提醒 */
const SQ_N = 3, SQ_MIN = 0.04;   // 每節最多出幾題;相似度低於 SQ_MIN 的題目不分配
const SQ_SKIP = new Set(['tip', 'trap', 'stale', 'law', 'ex', 'self', 'link', 'how']);
SQ_SKIP.add('demo');   // v328 示範例題(自編)也不算進小節內容   // v305 章末彙整的區塊不算進小節內容(它們放在最後一節,但講的是整章)
const SQ_STOP = new Set('the and for with that this from are was were you your have has had will would can could should may might not but all any one two three which what who whom whose when where why how into onto about than then them they their there these those its our out off over under very just also only more most much many some such each other another'.split(' '));
const IC = n => (window.ICONS ? ICONS.svg(n) : '');
function sqToks(s){
  s = String(s == null ? '' : s).replace(/<[^>]*>/g, ' ').replace(/\*\*/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').toLowerCase();
  const out = new Set();
  (s.match(/[\u3040-\u30ff\u3400-\u9fff]+/g) || []).forEach(w => { for (let i = 0; i < w.length - 1; i++) out.add(w.slice(i, i + 2)); });
  (s.match(/[a-z][a-z'-]{2,}/g) || []).forEach(w => { if (!SQ_STOP.has(w)) out.add(w); });
  return out;
}
function sqAssign(ch, qs){
  const secs = []; let cur = null;
  ch.blocks.forEach(b => { if (b.t === 'h'){ cur = [b.text]; cur.x = !!b.x; secs.push(cur); } else if (cur && !SQ_SKIP.has(b.t)) cur.push(JSON.stringify(b)); });
  if (!secs.length || !qs || !qs.length) return [];
  const T = secs.map(x => x.x ? new Set() : sqToks(x.join(' ')));   // v305 小節標題 x:1 = 延伸補充(還沒考過的內容),不分配歷屆題
  const df = new Map(); T.forEach(t => t.forEach(x => df.set(x, (df.get(x) || 0) + 1)));
  const N = T.length, idf = x => Math.log(1 + N / (df.get(x) || N));
  const L = T.map(t => { let s2 = 0; t.forEach(x => { const w = idf(x); s2 += w * w; }); return Math.sqrt(s2) || 1; });   // 小節長度校正(字多的小節不會通吃)
  const res = T.map(() => []);
  qs.forEach(q => {
    const tq = [...sqToks(q.stem + ' ' + (q.opts || []).join(' '))].filter(x => df.has(x));
    const qn = Math.sqrt(tq.reduce((a, x) => a + idf(x) * idf(x), 0)) || 1;
    let best = -1, bs = 0;
    T.forEach((t, i) => { let dot = 0; tq.forEach(x => { if (t.has(x)) dot += idf(x) * idf(x); }); const sc = dot / (L[i] * qn); if (sc > bs){ bs = sc; best = i; } });
    if (best >= 0 && bs >= SQ_MIN) res[best].push({ q, s: bs });
  });
  return res;
}
const SQ_WRONG = /何者(?:錯誤|不正確|有誤|為非|非|不是|不屬於|不得|不可|不適當|不符|不宜)|錯誤者|不正確者|不包括/;
const SQ_RIGHT = /何者(?:正確|為是|適當|最適當|最恰當|最佳|屬之|為宜)|正確者/;
function sqPat(k, items){
  if (k === 'en' || k === 'jp') return '';
  let w = 0, r = 0;
  items.forEach(({ q }) => { if (SQ_WRONG.test(q.stem)) w++; else if (SQ_RIGHT.test(q.stem)) r++; });
  const o = items.length - w - r, ps = [];
  if (w) ps.push(`選錯的(何者錯誤)${w} 題`);
  if (r) ps.push(`選對的(何者正確)${r} 題`);
  if (o) ps.push(`直接問內容 ${o} 題`);
  return ps.length ? `<p class="sq-pat">常見問法:${ps.join('、')}</p>` : '';
}
function sqOk(k, q, exKeys){

  return !(k === 'jp' && psgOf(k, q));
}
function sqQ(k, q){

    ${O && O.fig ? (O.fig(q) || '') : ''}<div class="sq-st">${ZW(k, clean(q.stem))}</div>
    ${q.opts.map((o, i) => `<button type="button" class="sq-o" data-i="${i}">${'ABCD'[i]}. ${O && O.html ? (O.html(q, i) || '') : ''}${ZW(k, clean(o))}</button>`).join('')}
    <div class="sq-fb" hidden></div></div>`;
}
function sqHtml(k, items, i){
  if (!items || !items.length || !CUR) return '';
  const st = CUR.st, ys = st ? st.years.slice(-3) : [];

}

const psgFull = (k, q) => k === 'en' && q.psg && window.ENREAD ? ENREAD.html(q, { open: false, full: true }) : psgOf(k, q);
function sqaBody(k, xs, li){
  const gs = [], m = new Map();
  xs.forEach(x => { const p = psgFull(k, x.q); if (!m.has(p)){ const g = { p, xs: [] }; m.set(p, g); gs.push(g); } m.get(p).xs.push(x); });

function sqAll(k, items){

  const ans = q => SCORE.free(q) ? (q.sungei === 2 ? '有作答就給分(官方送分)' : '一律給分(官方送分)') : SCORE.acc(q).map(i => 'ABCD'[i] + '. ' + ZW(k, clean(q.opts[i]))).join(' / ');
  const li = ({ q }) => `<li><span class="sqa-y">${PRACTICE.CNAME[q.c] || ''} ${q.y}-${q.no}</span><div class="sqa-q">${ZW(k, clean(q.stem))}</div>${zh(q)}<div class="sqa-a">${ans(q)}</div></li>`;
  return `<details class="sqa"><summary>看這節全部 ${items.length} 題的問與答</summary>${sqaBody(k, list.slice(0, SQA_MAX), li)}` +

  else if (s.matches('.secsel')){ const el = document.getElementById('sec-' + v); s.value = ''; if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }
  else if (s.id === 'hotJump'){ const el = document.getElementById('hot-' + v); if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }   // v277
  else if (s.id === 'aggJump'){ const el = v && document.querySelector('.it[data-agg="' + v + '"]'); s.value = ''; if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }
});
$('ttsBar').addEventListener('click', e=>{ const b = e.target.closest('[data-tts]'); if (b) TTS.act(b.dataset.tts); });
window.addEventListener('pagehide', ()=>{ TTS.stop(true); SAY.stop(); });
Promise.all(SUBJS.filter(s=>s.file).map(s=>loadSubj(s.k))).then(()=>renderBar());   // 先載入有內容的科目,顯示章數
render();
</script>
</body>
