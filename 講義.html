<script>
'use strict';
const SUBJS = [
  { k:'pr2', name:'⚖️ 執業法規', file:'jy_pr2.js', v:'JY_PR2' },
  { k:'pr',  name:'🚩 執業實務', file:'jy_pr.js', v:'JY_PR' },
  { k:'gh',  name:'🗺️ 觀光資源', file:'jy_gh.js', v:'JY_GH' },
  { k:'en',  name:'🔤 外語英語', file:null, v:null },
  { k:'jp',  name:'🎌 外語日語', file:null, v:null }];
const VIEWS = [['toc','📑 章節'],['mn','🎵 口訣總表'],['fig','🖼 圖解總覽'],['cmp','⚖️ 易混比較']];
const QUICK = { h:1, key:1, fig:1, table:1, mn:1, tip:1, trap:1, cmp:1, stale:1, self:1, link:1 };   // 快速複習顯示的區塊
const QUIZ_N = 10, PROG_KEY = 'jy_prog';
const $ = id => document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clean(s){return String(s==null?'':s).replace(/[ˉ‾¯]+/g,'');}
const cfg = Object.assign({ subj:'pr2', view:'toc', mode:'full', ch:null, mask:true }, PRACTICE.LSget('pref_jy', {}));
(function(){ const p = new URLSearchParams(location.search);
  const s = p.get('subj'), ch = p.get('ch'), m = p.get('mode');
  if (SUBJS.some(x=>x.k===s)) { cfg.subj = s; cfg.view = 'toc'; cfg.ch = null; }
  if (ch) { cfg.ch = ch; cfg.view = 'ch'; const k = ch.split('-')[0]; if (SUBJS.some(x=>x.k===k)) cfg.subj = k; }
  if (m === 'quick' || m === 'full') cfg.mode = m; })();
function saveCfg(){ PRACTICE.LSset('pref_jy', cfg); }
function prog(){ return PRACTICE.LSget(PROG_KEY, {}); }
function setProg(id, patch){ const p = prog(); p[id] = Object.assign(p[id] || {}, patch); PRACTICE.LSset(PROG_KEY, p); }

/* ===== 資料載入 ===== */
const JY = {}, JYLOAD = {};   // JYLOAD:載入中的 Promise(同一科只插入一次 script,避免重複宣告)
function loadSubj(k){
  const S = SUBJS.find(x=>x.k===k);
  if (!S || !S.file) return Promise.resolve(null);
  if (JY[k]) return Promise.resolve(JY[k]);
  if (JYLOAD[k]) return JYLOAD[k];
  const pre = PRACTICE.gv(S.v) ? Promise.resolve() : PRACTICE.loadJs(S.file);
  JYLOAD[k] = pre.then(()=>{ JY[k] = PRACTICE.gv(S.v) || null; return JY[k]; }).catch(()=>{ delete JYLOAD[k]; return null; });
  return JYLOAD[k];
}
function bankOf(k){ return PRACTICE.SUBJ[k] ? PRACTICE.load(k).catch(()=>null) : Promise.resolve(null); }
function chapterQs(ch, d){
  if (!d) return [];
  const m = ch.match || {};
  return d.bank.filter(q=>{
    if (m.add && m.add.includes(PRACTICE.key(q))) return true;   // v211 個別題目標在其他主題,但屬於本章
    if (m.kw) return m.kw.test(q.stem + ' ' + (q.opts||[]).join(' '));
    const a = d.ana[PRACTICE.key(q)] || {};
    return (m.t||[]).includes(a.t) && (m.tt||[]).includes(a.tt);
  });
}

  const { k, ch, d, st } = CUR, J = JY[k], i = J.chapters.indexOf(ch), p = prog()[ch.id] || {};
  const prev = J.chapters[i-1], next = J.chapters[i+1];
  const exam = st ? `<div class="exam">📊 <b>本章考情</b>:歷屆(${st.years[0]}~${st.years[st.years.length-1]} 年)共 <b>${st.n}</b> 題(導遊 ${st.guide}、領隊 ${st.leader}),近 3 年 <b>${st.recent}</b> 題;章末測驗可出 ${st.quiz.length} 題(已排除法規已修正題)。</div>${chartSvg(st)}` : '';
  $('app').innerHTML = `<div class="card chhead"><div class="chno">${esc(J.name)} · 第 ${ch.no} 章</div><div class="cht">${esc(ch.t)}</div><div class="chs">${esc(ch.sub)}</div>
    <div class="chs">資料截至 ${esc(ch.ver)}</div>
    <div class="tools"><span class="seg"><button type="button" data-mode="full" class="${cfg.mode==='full'?'on':''}">📖 完整閱讀</button><button type="button" data-mode="quick" class="${cfg.mode==='quick'?'on':''}">⚡ 快速複習</button></span>
    <button class="tbtn" type="button" data-act="read">${p.read?'✅ 已讀':'標記已讀'}</button><button class="tbtn" type="button" data-act="tts">🔊 朗讀</button><button class="tbtn" type="button" data-act="print">🖨 列印</button><button class="tbtn" type="button" data-act="toc">← 目錄</button></div></div>`
    + exam + ch.blocks.map(b=>blockHtml(k, b, d)).join('')
    + `<div class="end"><button class="tbtn fill" type="button" data-act="quiz"${st&&st.quiz.length?'':' disabled'}>📝 章末測驗 ${QUIZ_N} 題</button><button class="tbtn" type="button" data-act="quizall"${st&&st.quiz.length?'':' disabled'}>📚 本章全部 ${st?st.quiz.length:0} 題</button>
      <button class="tbtn" type="button" data-act="read">${p.read?'✅ 已讀':'標記已讀'}</button>
      ${prev?`<button class="tbtn" type="button" data-go="${esc(prev.id)}">← 上一章</button>`:''}${next?`<button class="tbtn" type="button" data-go="${esc(next.id)}">下一章 →</button>`:''}</div>`
    + (p.best!=null?`<div class="tip0">📝 章末測驗:最佳 ${p.best}%,上次 ${p.last}%</div>`:'');
  hydrateLawRef();
}
function openChapter(id){
  const k = id.split('-')[0];
  cfg.subj = k; cfg.view = 'ch'; cfg.ch = id; saveCfg();
  history.replaceState(null, '', '?ch=' + encodeURIComponent(id) + (cfg.mode==='quick'?'&mode=quick':''));
  renderBar(); $('app').innerHTML = '<div class="empty">載入中…</div>';
  Promise.all([loadSubj(k), bankOf(k)]).then(([J, d])=>{
    const ch = J && J.chapters.find(c=>c.id===id);
    if (!ch){ cfg.view = 'toc'; cfg.ch = null; saveCfg(); render(); return; }
    CUR = { k, ch, d, st: stats(k, ch, d) };
    renderBar(); renderChapter(); window.scrollTo(0,0);
  });
}
function render(){
  TTS.stop(true);
  if (cfg.view === 'ch' && cfg.ch) return openChapter(cfg.ch);
  history.replaceState(null, '', location.pathname);
  renderBar();
  const S = SUBJS.find(x=>x.k===cfg.subj);
  if (!S.file){ $('app').innerHTML = noData(); return; }
  $('app').innerHTML = '<div class="empty">載入中…</div>';
  loadSubj(cfg.subj).then(J=>{
    renderBar();
    if (!J){ $('app').innerHTML = noData(); return; }
    if (cfg.view === 'toc') renderToc(J); else renderAgg(J, cfg.view);
  });
}
function startQuiz(all){
  const { k, ch, st } = CUR; if (!st || !st.quiz.length) return;
  MINIQUIZ.start({ title: '📝 第 ' + ch.no + ' 章 章末測驗', list: st.quiz.map(q=>({ s:k, q })), n: all ? 0 : QUIZ_N,
    onResult: (ok, n, info)=>{ if (info && (info.redo || info.partial)) return;   // 「只練錯的」與中途關閉不算整章成績
      const pct = Math.round(ok / n * 100), p = prog()[ch.id] || {};
      setProg(ch.id, { last: pct, best: Math.max(pct, p.best == null ? 0 : p.best) }); if (cfg.view === 'ch' && CUR && CUR.ch === ch) renderChapter(); } });
}

document.querySelector('.bar').addEventListener('click', e=>{
  const s = e.target.closest('[data-subj]');
  if (s){ cfg.subj = s.dataset.subj; cfg.view = cfg.view === 'ch' ? 'toc' : cfg.view; cfg.ch = null; saveCfg(); render(); return; }
  const v = e.target.closest('[data-view]');
  if (v){ cfg.view = v.dataset.view; cfg.ch = null; saveCfg(); render(); }
});
$('app').addEventListener('click', e=>{
  if (TTS.on && !e.target.closest('button, a, input')) TTS.jump(e.target);   // 朗讀中點區塊 → 從那裡開始
  const ans = e.target.closest('.ans'); if (ans){ ans.classList.toggle('mask'); return; }
  const mn = e.target.closest('.jmn.hide'); if (mn){ mn.classList.remove('hide'); return; }
  const a = e.target.closest('[data-ch]'); if (a){ e.preventDefault(); openChapter(a.dataset.ch); return; }
  const g = e.target.closest('[data-go]'); if (g){ openChapter(g.dataset.go); return; }
  const m = e.target.closest('[data-mode]');
  if (m){ cfg.mode = m.dataset.mode; saveCfg(); history.replaceState(null, '', '?ch=' + encodeURIComponent(CUR.ch.id) + (cfg.mode==='quick'?'&mode=quick':'')); renderChapter(); return; }
  if (e.target.id === 'maskAll'){ cfg.mask = !cfg.mask; saveCfg(); render(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'toc'){ cfg.view = 'toc'; cfg.ch = null; saveCfg(); render(); window.scrollTo(0,0); }
  else if (act === 'read'){ const p = prog()[CUR.ch.id] || {}; setProg(CUR.ch.id, { read: p.read ? null : Date.now() }); renderChapter(); }
  else if (act === 'print') window.print();
  else if (act === 'tts') TTS.start(0);
  else if (act === 'quiz') startQuiz(false);
  else if (act === 'quizall') startQuiz(true);
});

$('ttsBar').addEventListener('click', e=>{ const b = e.target.closest('[data-tts]'); if (b) TTS.act(b.dataset.tts); });
window.addEventListener('pagehide', ()=>TTS.stop(true));
Promise.all(SUBJS.filter(s=>s.file).map(s=>loadSubj(s.k))).then(()=>renderBar());   // 先載入有內容的科目,顯示章數
render();
</script>
</body>
</html>
