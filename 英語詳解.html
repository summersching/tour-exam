<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>外語英語 · 逐題完整詳解</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2330; --sub:#5a6b82; --line:#e2e8f2;
    --accent:#2563eb; --sel:#2563eb; --selbg:#eef2ff; --ok:#15904a; --okbg:#e5f6ec; --no:#c62a2a; --nobg:#fbe9e9;
    --chipv:#eef2ff; --chipvk:#3b4fd6; --chipd:#e8f7ee; --chipdk:#1f8a4c;
    --chipr:#f4ecfb; --chiprk:#7a3fc0; --chipt:#eef1f5; --chiptk:#55647a;
    --blank:#fff4cc; --blankk:#8a6d1a; --star:#e8a72b;
    --skillbg:#eaf1ff; --skillk:#1d4ed8; --skillbd:#93b4f7;
    --notebg:#fff3e6; --notek:#b5560c; --notebd:#f3bd7e;
    --grambg:#f0ecfb; --gramk:#6b34c9; --grambd:#c2a8ef;
    --realbg:#e7f6f4; --realk:#0d7d72; --realbd:#84cdc2;
    --kk:#0e7c86;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --card:#1b2029; --ink:#e8edf5; --sub:#9aa8bd; --line:#2b333f;
      --accent:#5b8cff; --sel:#5b8cff; --selbg:#22284a; --ok:#5ad48a; --okbg:#173023; --no:#ff8080; --nobg:#331a1a;
      --chipv:#22284a; --chipvk:#9db0ff; --chipd:#16301f; --chipdk:#6fe0a0;
      --chipr:#2a1f3a; --chiprk:#c79bff; --chipt:#242b36; --chiptk:#9fb0c6;
      --blank:#3d3413; --blankk:#f2d778; --star:#f0b840;
      --skillbg:#182741; --skillk:#9db8ff; --skillbd:#2f4a80;
      --notebg:#3a2a17; --notek:#f4b877; --notebd:#6a4a24;
      --grambg:#241a3a; --gramk:#c9adff; --grambd:#4a3670;
      --realbg:#123230; --realk:#6fd6c8; --realbd:#2b5a54;
      --kk:#57cdd8;
    }
  }
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.75;padding:0 0 80px}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;position:relative;
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.28rem}
  header p{margin:2px 0;opacity:.92;font-size:.82rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  /* 篩選列(與觀光複習一致的結構) */
  .bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .bar .wrap{padding:9px 16px}
  .rowf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}
  .rowf .lb{font-size:.76rem;color:var(--sub);font-weight:700;margin-right:2px;min-width:30px}
  .chip2{border:1.4px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:16px;cursor:pointer;font-size:.82rem;font-family:inherit;font-weight:600}
  .chip2.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  #q{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem;font-family:inherit;margin-top:4px}
  .cnt{font-size:.78rem;color:var(--sub);padding:10px 0 0}
  .tools2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 2px}
  .mbtn{border:1.4px solid var(--line);background:var(--card);color:var(--ink);padding:6px 15px;border-radius:16px;cursor:pointer;font-size:.86rem;font-weight:700;font-family:inherit}
  .mbtn.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .pbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:16px;cursor:pointer;font-size:.84rem;font-family:inherit}
  .pbtn.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .score{font-size:.82rem;color:var(--sub);font-weight:700;margin-left:auto}
  /* 題卡(沿用英語詳解樣式) */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 8px;margin:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .qno{background:var(--ink);color:var(--card);font-weight:700;border-radius:8px;padding:2px 10px;font-size:.85rem}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600}
  .c-v{background:var(--chipv);color:var(--chipvk)} .c-d{background:var(--chipd);color:var(--chipdk)}
  .c-r{background:var(--chipr);color:var(--chiprk)} .c-t{background:var(--chipt);color:var(--chiptk)}
  .stars{color:var(--star);font-size:.85rem;letter-spacing:1px;margin-left:auto} .stars .dim{opacity:.28}
  .stem{font-size:1.02rem;margin:6px 0 12px} .stem .say{margin-left:6px}
  .blank{background:var(--blank);color:var(--blankk);border-radius:5px;padding:0 22px;margin:0 3px;font-weight:700}
  .opts{display:grid;gap:8px;margin:6px 0}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.95rem;font-family:inherit;transition:.15s;width:100%}
  .opt:hover{border-color:var(--accent)} .opt .lab{font-weight:700;color:var(--sub);min-width:18px}
  .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .lab{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--nobg)} .opt.no .lab{color:var(--no)}
  .opt .mk{margin-left:auto;font-weight:700}
  .ozh{color:var(--sub);margin-left:4px} body.hide-zh .ozh{display:none}
  .reveal{margin:12px 0 8px;border-top:1px dashed var(--line);padding-top:10px}
  .lbl{font-weight:700;font-size:.8rem;color:var(--accent);margin:10px 0 4px;letter-spacing:.03em} .lbl:first-child{margin-top:0}
  .zh{color:var(--sub);font-size:.95rem} .ana{font-size:.95rem}
  .ana b.ac{color:var(--ok);font-weight:700} .ana b.wr{color:var(--no);font-weight:700}
  .box{border-left:4px solid;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
  .box .h{display:block;margin-bottom:2px;font-size:.82rem}
  .box.skill{background:var(--skillbg);border-color:var(--skillbd)} .box.skill .h{color:var(--skillk)}
  .box.note{background:var(--notebg);border-color:var(--notebd)} .box.note .h{color:var(--notek)}
  .box.gram{background:var(--grambg);border-color:var(--grambd)} .box.gram .h{color:var(--gramk)}
  .box.real{background:var(--realbg);border-color:var(--realbd)} .box.real .h{color:var(--realk)}
  table.vocab{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:.9rem}
  table.vocab td{border:1px solid var(--line);padding:5px 9px;vertical-align:top} table.vocab td:first-child{width:46%}
  .vw{font-weight:700;color:var(--accent)} .kk{color:var(--kk);font-style:italic;font-size:.86rem;margin-left:5px}
  .say{cursor:pointer;color:var(--accent);font-size:.85rem;user-select:none;border:1px solid var(--line);border-radius:6px;padding:0 5px;background:var(--card)}
  .say:hover{background:var(--chipv)}
  .passage{background:var(--chipt);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:.93rem}
  .passage .lbl{color:var(--chiptk)} .passage p{margin:6px 0}
  .strategy{background:var(--grambg);border:1px solid var(--grambd);border-radius:12px;margin:14px 0 8px;overflow:hidden}
  .stgh{width:100%;text-align:left;background:transparent;border:0;color:var(--gramk);font-weight:700;font-size:1rem;padding:13px 16px;cursor:pointer;font-family:inherit}
  .stgb{display:none;padding:0 16px 14px;font-size:.9rem} .strategy.open .stgb{display:block}
  .stgb h4{color:var(--gramk);margin:14px 0 6px;font-size:.92rem}
  .stgb table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.85rem}
  .stgb td,.stgb th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  .stgb ol{padding-left:20px;margin:4px 0}
  table.opta{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
  table.opta td{border:1px solid var(--line);padding:6px 9px;vertical-align:top} table.opta td:first-child{width:44%}
  .cite{background:var(--chipt);border-left:3px solid var(--chiptk);padding:6px 10px;margin:6px 0;border-radius:6px;font-size:.9rem;font-style:italic}
  .ok2{color:var(--ok);font-weight:700} .no2{color:var(--no);font-weight:700}
  .guide{background:var(--realbg);border:1px solid var(--realbd);border-radius:12px;padding:14px 16px;margin:14px 0 8px;font-size:.92rem}
  .guide .lbl{color:var(--realk)} .guide ol{margin:6px 0 0;padding-left:20px}
  .fold{display:none} .show .fold{display:block}
  .card.hl{animation:hlp 2.4s ease}@keyframes hlp{0%,100%{box-shadow:0 1px 6px rgba(0,0,0,.04)}18%,55%{box-shadow:0 0 0 3px var(--accent)}}
  .backbtn{position:fixed;left:12px;bottom:16px;z-index:99;background:var(--accent);color:#fff;padding:9px 16px;border-radius:22px;font-size:.86rem;font-weight:700;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.28)}
  .empty{text-align:center;color:var(--sub);padding:40px 10px}
  footer{max-width:840px;margin:26px auto 0;padding:0 16px;color:var(--sub);font-size:.78rem;text-align:center}
  @media print{
    header .home,.bar,.tools2,.say{display:none!important}
    header{background:#1e3a8a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .fold{display:block!important} .card,.passage,.guide{break-inside:avoid;box-shadow:none} body{background:#fff}
  }
</style>

<body>
<header><div class="wrap">
  <a class="home" href="歷屆試題.html">← 歷屆試題</a>
  <h1>📖 外語英語 · 逐題完整詳解</h1>
  <p>整句中譯 · 四選項中英+KK · 正解 · 解析 · 💡技巧 · ⚠️注意 · 📝文法 · 🎧現場 · ★重要度</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="rowf"><span class="lb">證照</span><span id="fCert"></span></div>
  <div class="rowf"><span class="lb">年份</span><span id="fYear"></span></div>
  <div class="rowf"><span class="lb">題型</span><span id="fType"></span></div>
  <input id="q" placeholder="搜尋題幹 / 選項 / 解析關鍵字…">
  <div class="cnt" id="cnt"></div>
</div></div>

<div class="wrap">
  <div class="tools2">
    <button class="mbtn on" data-m="review">📖 複習模式</button>
    <button class="mbtn" data-m="test">✍️ 自測模式</button>
    <button class="pbtn" id="zhBtn">🈯 隱藏選項中文</button>
    <button class="pbtn" id="printBtn">🖨 匯出 PDF</button>
    <span class="score" id="score"></span>
  </div>
</div>

<main class="wrap" id="app"></main>
<footer>外語英語逐題詳解 · 題目來源:交通部觀光署 / 考選部考畢試題(公開) · 詳解由 AI 整理,供個人備考複習</footer>

<script>
const LAB=['A','B','C','D'];
const CNAME={leader:'領隊',guide:'導遊'};
const TYPES=[['all','全部'],['字彙','字彙'],['對話','對話'],['文法','文法'],['閱讀','閱讀']];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function splitOpt(o){const m=o.match(/^(.*?)([（(]?[一-鿿].*)$/);return m?'<span class="oen">'+m[1].trim()+'</span><span class="ozh">'+esc(m[2])+'</span>':esc(o);}
function enPhrase(o){var m=String(o).match(/^[^一-鿿（(]+/);return m?m[0].trim():'';}
function hlAna(ana,opts,ans){
  if(!ana||!opts)return ana||'';
  var marks=[];for(var i=0;i<opts.length;i++){var ph=enPhrase(opts[i]);if(ph&&ph.length>=3)marks.push({ph:ph,cls:(i===ans?'ac':'wr')});}
  if(!marks.length)return ana;
  marks.sort(function(a,b){return b.ph.length-a.ph.length;});
  var map={};marks.forEach(function(m){if(!(m.ph in map))map[m.ph]=m.cls;});
  var alt=marks.map(function(m){return m.ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  var re;try{re=new RegExp('('+alt+')','g');}catch(e){return ana;}
  return ana.replace(re,function(mt){return '<b class="'+(map[mt]||'ac')+'">'+mt+'</b>';});
}
const stars=n=>[0,1,2].map(i=>i<n?'★':'<span class="dim">☆</span>').join('');
const sayBtn=t=>`<span class="say" data-say="${String(t).replace(/"/g,'&quot;')}" title="點我朗讀">🔊</span>`;
function vRows(v){return (v||[]).map(x=>`<tr><td><span class="vw">${esc(x[0])}</span>${x[1]?`<span class="kk">/${esc(x[1])}/</span>`:''} ${/^[A-Za-z]/.test(x[0])?sayBtn(x[0].replace(/\s*\(.*/,'')):''}</td><td>${x[2]}</td></tr>`).join('');}

const YEARS=[115,114,113,112,111,110,109,108,107,106];
const QP=new URLSearchParams(location.search);
let CERT=QP.get('cert')||(function(){try{return localStorage.getItem('pref_cert');}catch(e){return null;}})();
if(CERT!=='guide'&&CERT!=='leader')CERT='leader';
let YEAR=QP.get('year')||String(YEARS[0]);
if(!YEARS.includes(+YEAR))YEAR=String(YEARS[0]);
let TYPE='all', MODE=(QP.get('mode')==='test')?'test':'review';   // ?mode=test 可從歷屆試題直接進自測
document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x.dataset.m===MODE));
const answered={};   // 自測作答:no → 選項index(依 cert-year 分開)
function curKey(){return CERT+'-'+YEAR;}
function curData(){return (typeof EN_REVIEW!=='undefined'&&EN_REVIEW[curKey()])||[];}
function ansKey(no){return curKey()+'-'+no;}

/* 錯題本(沿用英語 wrongbook_en) */
const WB_KEY='wrongbook_en';
function wbLoad(){try{return JSON.parse(localStorage.getItem(WB_KEY)||'{}');}catch(e){return{};}}
function wbSave(o){try{localStorage.setItem(WB_KEY,JSON.stringify(o));}catch(e){}}
function wbAdd(item,picked){var o=wbLoad(),id=CERT+'-'+YEAR+'-'+item.no,e=o[id]||{};
  o[id]={cert:CERT,y:YEAR,no:item.no,type:item.type,topic:item.topic,star:item.star,stem:item.stem,opts:item.opts,ans:item.ans,zh:item.zh,ana:item.ana,skill:item.skill||'',note:item.note||'',gram:item.gram||'',real:item.real||'',vocab:item.vocab||[],picked:picked,wrong:(e.wrong||0)+1,ts:Date.now()};wbSave(o);}
function wbRemove(no){var o=wbLoad();delete o[CERT+'-'+YEAR+'-'+no];wbSave(o);}

function chip(v,t,on,attr){return `<button class="chip2 ${on?'on':''}" data-${attr}="${v}">${t}</button>`;}
function buildFilters(){
  document.getElementById('fCert').innerHTML=[['leader','領隊'],['guide','導遊']].map(([v,t])=>chip(v,t,v===CERT,'fc')).join('');
  document.getElementById('fYear').innerHTML=YEARS.map(y=>chip(y,y+'年',String(y)===YEAR,'fy')).join('');
  document.getElementById('fType').innerHTML=TYPES.map(([v,t])=>chip(v,t,v===TYPE,'ft')).join('');
}

function qMatch(item,kw){
  if(!kw)return true;
  const hay=(item.stem+' '+item.opts.join(' ')+' '+item.zh+' '+item.ana+' '+(item.skill||'')+' '+(item.note||'')+' '+(item.gram||'')).toLowerCase();
  return hay.includes(kw);
}
function optBtn(item,i,o){return `<button class="opt" data-no="${item.no}" data-i="${i}"><span class="lab">${LAB[i]}</span><span>${splitOpt(o)}</span><span class="mk"></span></button>`;}
function qCard(item){
  const cls=item.type==='字彙'?'c-v':item.type==='對話'?'c-d':'c-r';
  const stem=esc(item.stem).replace('__BLANK__','<span class="blank"></span>');
  const rawStem=item.stem.replace('__BLANK__','blank').replace(/[A-Za-z]+:/g,'').replace(/　/g,' ');
  const showCls=(MODE==='review'||answered[ansKey(item.no)]!=null)?' show':'';
  return `<div class="card${showCls}" id="q${item.no}">
    <div class="qhead"><span class="qno">第 ${item.no} 題</span>
      <span class="chip ${cls}">${item.type}</span><span class="chip c-t">${item.topic}</span>
      <span class="stars" title="重要度/出現頻率">${stars(item.star)}</span></div>
    <div class="stem">${stem} ${sayBtn(rawStem)}</div>
    <div class="opts">${item.opts.map((o,i)=>optBtn(item,i,o)).join('')}</div>
    <div class="reveal fold">
      <div class="lbl">整句中譯</div><div class="zh">${item.zh}</div>
      <div class="lbl">正解</div><div class="ana"><b style="color:var(--ok);font-weight:700">${item.ans>=0?"ABCD"[item.ans]+". "+item.opts[item.ans]:"（送分題,一律給分）"}</b></div>
      <div class="lbl">解析</div><div class="ana">${hlAna(item.ana,item.opts,item.ans)}</div>
      ${item.skill?`<div class="box skill"><b class="h">💡 考試技巧</b>${item.skill}</div>`:''}
      ${item.note?`<div class="box note"><b class="h">⚠️ 注意 / 易錯</b>${item.note}</div>`:''}
      ${item.gram?`<div class="box gram"><b class="h">📝 文法 / 句型</b>${item.gram}</div>`:''}
      ${item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:''}
      <div class="lbl">難字 / 片語(附 KK 音標,點 🔊 聽發音)</div>
      <table class="vocab">${vRows(item.vocab)}</table>
    </div></div>`;
}
function passageHtml(item){
  return `<div class="passage"><div class="lbl">${item.label} ${sayBtn(item.text.join(' '))}</div>`+
    item.text.map(t=>`<p>${t}</p>`).join('')+
    (item.real?`<div class="box real"><b class="h">🎧 現場實用 / 口試</b>${item.real}</div>`:'')+
    `<div class="reveal"><div class="lbl">難字</div><table class="vocab">${vRows(item.vocab)}</table></div></div>`;
}

function render(){
  const D=curData();
  const kw=document.getElementById('q').value.trim().toLowerCase();
  const plain=(TYPE==='all'&&!kw);   // 無篩選 → 完整呈現(含策略/導引/題組)
  let html='', shownQ=0;
  D.forEach(item=>{
    if(item.kind==='guide'){ if(plain)html+=`<div class="guide"><div class="lbl">${item.label}</div><ol>${item.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div style="margin-top:8px">${item.tip}</div></div>`; return; }
    if(item.kind==='strategy'){ if(plain)html+=`<div class="strategy"><button class="stgh" type="button">${item.title}　<span class="stgar">▼ 點開</span></button><div class="stgb">${item.html}</div></div>`; return; }
    if(item.kind==='passage'){ if(TYPE==='all'||TYPE==='閱讀'){ if(!kw)html+=passageHtml(item); } return; }
    // q
    if(TYPE!=='all'&&item.type!==TYPE)return;
    if(!qMatch(item,kw))return;
    html+=qCard(item); shownQ++;
  });
  document.getElementById('app').innerHTML=html||'<div class="empty">找不到符合的題目</div>';
  const totalQ=D.filter(d=>d.kind==='q').length;
  document.getElementById('cnt').textContent=`${CNAME[CERT]} ${YEAR} 年 · 共 ${totalQ} 題`+((TYPE!=='all'||kw)?`(篩選後 ${shownQ})`:'');
  updateScore();
}
function updateScore(){
  const el=document.getElementById('score');
  if(MODE!=='test'){el.textContent='';return;}
  const D=curData().filter(d=>d.kind==='q');
  let done=0,ok=0;D.forEach(q=>{const p=answered[ansKey(q.no)];if(p!=null){done++;if(p===q.ans)ok++;}});
  el.textContent=done?`作答 ${done} · 答對 ${ok} · ${Math.round(ok/done*100)}%`:'';
}

/* 事件:篩選列 */
document.querySelector('.bar').addEventListener('click',e=>{
  const b=e.target.closest('.chip2');if(!b)return;
  if(b.dataset.fc!=null){CERT=b.dataset.fc;try{localStorage.setItem('pref_cert',CERT);}catch(e){}}
  else if(b.dataset.fy!=null)YEAR=b.dataset.fy;
  else if(b.dataset.ft!=null)TYPE=b.dataset.ft;
  buildFilters();render();window.scrollTo(0,0);
});
document.getElementById('q').addEventListener('input',render);
/* 工具列:模式 / 中文 / PDF */
document.querySelector('.tools2').addEventListener('click',e=>{
  const b=e.target.closest('.mbtn');if(!b)return;
  MODE=b.dataset.m;document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x===b));
  render();window.scrollTo(0,0);
});
document.getElementById('zhBtn').addEventListener('click',function(){
  const h=document.body.classList.toggle('hide-zh');
  this.textContent=h?'🈚 顯示選項中文':'🈯 隱藏選項中文';
});
document.getElementById('printBtn').addEventListener('click',()=>{
  const prev=MODE;MODE='review';document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x.dataset.m==='review'));render();
  setTimeout(()=>{window.print();MODE=prev;document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x.dataset.m===prev));render();},200);
});
/* 內容區:選項作答 / 朗讀 / 策略展開 */
document.getElementById('app').addEventListener('click',e=>{
  const say=e.target.closest('.say');
  if(say){const u=new SpeechSynthesisUtterance(say.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);return;}
  const stg=e.target.closest('.stgh');
  if(stg){const box=stg.closest('.strategy');const o=box.classList.toggle('open');box.querySelector('.stgar').textContent=o?'▲ 收合':'▼ 點開';return;}
  if(MODE!=='test')return;
  const b=e.target.closest('.opt');if(!b)return;
  const no=+b.dataset.no,i=+b.dataset.i;
  const card=b.closest('.card');if(card.dataset.done)return;card.dataset.done='1';
  const item=curData().find(d=>d.kind==='q'&&d.no===no);if(!item)return;
  answered[ansKey(no)]=i;
  const opts=[...card.querySelectorAll('.opt')];
  opts.forEach(x=>{x.classList.remove('ok','no');x.querySelector('.mk').textContent='';});
  opts[item.ans].classList.add('ok');opts[item.ans].querySelector('.mk').textContent='✓';
  if(i!==item.ans){opts[i].classList.add('no');opts[i].querySelector('.mk').textContent='✗';wbAdd(item,i);}else{wbRemove(no);}
  card.classList.add('show');updateScore();
});

buildFilters();render();

/* 深連結 #qN:跳到指定題並高亮;若來自工具頁顯示返回鈕 */
function goHash(){
  const m=(location.hash||'').match(/^#q(\d+)$/);if(!m)return;
  let c=document.getElementById('q'+m[1]);
  if(!c){TYPE='all';document.getElementById('q').value='';buildFilters();render();c=document.getElementById('q'+m[1]);}
  if(!c)return;
  c.classList.add('show','hl');c.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>c.classList.remove('hl'),2400);
}
window.addEventListener('hashchange',goHash);
setTimeout(goHash,120);
(function(){var ref=document.referrer||'',label;
  if(/學習中心/.test(ref))label='← 回學習中心';
  else if(/錯題本/.test(ref))label='← 回錯題本';
  else if(/考前衝刺/.test(ref))label='← 回考前衝刺';
  else if(/口試練習/.test(ref))label='← 回口試練習';
  else if(/模擬測驗/.test(ref))label='← 回模擬測驗';
  else return;
  var b=document.createElement('a');b.className='backbtn';b.textContent=label;b.href='#';
  b.addEventListener('click',function(e){e.preventDefault();history.back();});
  document.body.appendChild(b);
})();
</script>
