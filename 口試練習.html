<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>口試練習</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#1c2330;--sub:#5a6b82;--line:#e2e8f2;--accent:#2563eb;--kk:#0e7c86;
    --hd1:#3730a3;--hd2:#4338ca;--tabk:#4338ca;
    --chipv:#eef2ff;--chipvk:#3b4fd6;--okbg:#e5f6ec;--ok:#15904a;--chipt:#eef1f5;--chiptk:#55647a;
    --enbg:#eef2ff;--enk:#3730a3;--enbd:#c7d0f7;--realbg:#e7f6f4;--realk:#0d7d72;--realbd:#84cdc2;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;--kk:#57cdd8;
    --hd1:#312e81;--hd2:#3730a3;--tabk:#a5b4fc;
    --chipv:#22284a;--chipvk:#9db0ff;--okbg:#173023;--ok:#5ad48a;--chipt:#242b36;--chiptk:#9fb0c6;
    --enbg:#1e2450;--enk:#a5b4fc;--enbd:#3a4487;--realbg:#123230;--realk:#6fd6c8;--realbd:#2b5a54;
  }}
  :root[data-theme="dark"]{
    --bg:#12161c;--card:#1b2029;--ink:#e8edf5;--sub:#9aa8bd;--line:#2b333f;--accent:#5b8cff;--kk:#57cdd8;
    --hd1:#312e81;--hd2:#3730a3;--tabk:#a5b4fc;
    --chipv:#22284a;--chipvk:#9db0ff;--okbg:#173023;--ok:#5ad48a;--chipt:#242b36;--chiptk:#9fb0c6;
    --enbg:#1e2450;--enk:#a5b4fc;--enbd:#3a4487;--realbg:#123230;--realk:#6fd6c8;--realbd:#2b5a54;
  }
  *{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 5px;font-size:1.3rem} header p{margin:2px 0;opacity:.92;font-size:.83rem}
  .home{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;color:#fff;text-decoration:none;font-size:.8rem;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:16px}
  .tabs{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .tabs .wrap{display:flex;gap:8px;padding:10px 16px 0}
  .tab{flex:1;border:none;background:none;color:var(--sub);padding:9px 6px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit;border-bottom:3px solid transparent}
  .tab.on{color:var(--tabk);border-bottom-color:var(--tabk)}
  .bar{background:var(--card);border-bottom:1px solid var(--line);padding:8px 0}
  .bar .wrap{display:flex;align-items:center;gap:10px}
  .bar input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem;font-family:inherit}
  .cnt{font-size:.8rem;color:var(--sub);white-space:nowrap}
  .intro{font-size:.8rem;color:var(--sub);background:var(--realbg);border-radius:10px;padding:9px 13px;margin:14px 0;border-left:4px solid var(--realbd)}
  .ocard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 5px 16px rgba(16,24,40,.05)}
  .ohead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600;background:var(--chipt);color:var(--chiptk)}
  .hit{font-size:.72rem;padding:1px 7px;border-radius:6px;text-decoration:none;font-weight:700;white-space:nowrap;margin-left:auto}
  .hit.leader{background:var(--chipv);color:var(--chipvk)} .hit.guide{background:var(--okbg);color:var(--ok)}
  .oreal{font-size:.94rem;margin-bottom:6px} .oreal b{color:var(--realk)}
  .ens{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .en{display:flex;gap:8px;align-items:flex-start;background:var(--enbg);border:1px solid var(--enbd);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.12s}
  .en:hover{filter:brightness(.98)} .en:active{transform:scale(.995)}
  .en .ic{color:var(--enk);flex-shrink:0} .en .tx{color:var(--enk);font-weight:600;font-size:.96rem}
  .en .sp{margin-left:auto;font-size:.72rem;color:var(--sub);white-space:nowrap}
  .empty{text-align:center;color:var(--sub);padding:36px 0}
  .tip{font-size:.75rem;color:var(--sub);text-align:center;margin:14px 0 0}
  .certbar{background:var(--card);border-bottom:1px solid var(--line)}
  .certbar .wrap{display:flex;align-items:center;gap:8px;padding:9px 16px}
  .certbar .clb{font-size:.8rem;color:var(--sub);font-weight:700}
  .cbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:5px 16px;border-radius:18px;cursor:pointer;font-size:.85rem;font-family:inherit;font-weight:700}
  .cbtn.on{background:var(--hd2);color:#fff;border-color:var(--hd2)}
  .certbar .wrap{flex-wrap:wrap;row-gap:8px;column-gap:18px}
  .cgrp{display:inline-flex;align-items:center;gap:8px} .cbtn,.certbar .clb{white-space:nowrap}
  .who{font-size:.72rem;font-weight:700;color:var(--sub);margin-left:auto}
  .jz{font-size:.86rem;color:var(--sub);margin:-2px 0 8px 28px}
  .kwt{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}.kwt td{border-top:1px solid var(--line);padding:5px 6px}.kwt td:first-child{font-weight:700}
  .playall{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:3px 12px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;margin-left:auto}
  .mkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
  .mkl{font-size:.8rem;font-weight:700;color:var(--sub);min-width:66px}
  .mkopt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 13px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit}
  .mkopt.on{background:var(--hd2);color:#fff;border-color:var(--hd2)}
  .mkh{font-weight:800;font-size:.92rem;margin:4px 0 8px}
  .mkq0{margin:6px 0;font-size:.92rem}
  .mkq{font-size:1.15rem;font-weight:700;color:var(--enk);margin:8px 0 2px;line-height:1.6}
  .mkzh{font-size:.86rem;color:var(--sub);margin-bottom:8px}
  .mkstage{font-size:1.25rem;font-weight:800;text-align:center;background:var(--enbg);border-radius:12px;padding:12px;margin:10px 0}
  .mkstage.ans{background:#fde8e8;color:#b91c1c}
  :root[data-theme="dark"] .mkstage.ans{background:#3a1a1a;color:#ff8080}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mkstage.ans{background:#3a1a1a;color:#ff8080}}
  #mkTime{font-variant-numeric:tabular-nums;margin-left:6px}
  .mkbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .mkbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit}
  .mkbtn.pri{background:var(--hd2);border-color:var(--hd2);color:#fff;flex:1}
  .mkhint{margin:6px 0;font-size:.85rem} .mkhint summary{cursor:pointer;color:var(--sub);font-weight:700} .mkhint .chip{display:inline-block;margin:4px 2px 0}
  .mkref{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .mksum{border-top:1px solid var(--line);padding:9px 0}
  .mkno{font-size:.8rem;color:var(--sub)} .mkerr{font-size:.82rem;color:#b45309;background:#fff4e5;border-radius:10px;padding:8px 12px;margin:8px 0}
  .ocard audio{width:100%;margin:6px 0}
</style>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<script src="pwa.js" defer></script>
<script src="oral.js"></script>
<script src="oral_jp.js"></script>
<script src="oral_mock.js"></script>

<body>
<header><div class="wrap">
  <a class="home" href="index.html">← 首頁</a>
  <h1>🎤 口試練習</h1>
  <p id="sub">帶團現場實用句 · 口試主題準備 · 點英文句跟讀</p>
</div></header>

<div class="tabs"><div class="wrap" id="tabs">
  <button class="tab on" data-k="phrases">🗣️ 帶團實用句</button>
  <button class="tab" data-k="topics">📋 口試主題準備</button>
</div></div>
<div class="certbar"><div class="wrap">
  <span class="cgrp"><span class="clb">科目</span>
  <button class="cbtn" data-l="en">英語</button>
  <button class="cbtn" data-l="jp">日語</button></span>
  <span class="cgrp"><span class="clb">範圍</span>
  <button class="cbtn" data-c="all">全部</button>
  <button class="cbtn" data-c="leader">領隊</button>
  <button class="cbtn" data-c="guide">導遊</button></span>
</div></div>
<div class="bar"><div class="wrap">
  <input id="q" placeholder="搜尋情境 / 關鍵字…">
  <span class="cnt" id="cnt"></span>
</div></div>

<main class="wrap" id="app"></main>

<script>
const CNAME={leader:'領隊',guide:'導遊'};
const TABS={en:[['phrases','🗣️ 帶團實用句'],['topics','📋 主題準備'],['mock','🎙 口試模擬']],jp:[['jphr','🗣️ 接待實用句'],['jtop','📋 主題範例'],['mock','🎙 口試模擬']]};
const SUBT={en:'帶團現場實用句 · 口試主題準備 · 口試模擬(計時 + 錄音)',jp:'日語接待實用句 · 口試主題範例 · 口試模擬(計時 + 錄音)'};
let LANG=(function(){try{return localStorage.getItem('pref_oral_lang')==='jp'?'jp':'en';}catch(e){return 'en';}})();
let cur=TABS[LANG][0][0];
const app=document.getElementById('app');
let CERT=(function(){try{return localStorage.getItem('pref_cert')||'all';}catch(e){return 'all';}})();
function scopeArr(arr){return CERT==='all'?arr:arr.filter(function(x){return x.c===CERT;});}
function speak(t,lang){try{const u=new SpeechSynthesisUtterance(t);u.lang=lang==='ja'?'ja-JP':'en-US';u.rate=lang==='ja'?(+(localStorage.getItem('pref_jp_rate'))||0.9):.88;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function srcChip(x){var g=x.c==='guide';var file='英語詳解.html?cert='+x.c+'&year='+x.y+'#q'+(x.no||x.before);return '<a class="hit '+x.c+'" href="'+file+'" title="點我看原題">'+(g?'導':'領')+x.y+'-'+(x.no||x.before)+'</a>';}
function enRows(en){return (en||[]).map(function(s){return '<div class="en" data-say="'+esc(s)+'"><span class="ic">🔊</span><span class="tx">'+esc(s)+'</span><span class="sp">點我跟讀</span></div>';}).join('');}
function card(x,head){return '<div class="ocard"><div class="ohead">'+head+srcChip(x)+'</div><div class="oreal">'+x.real+'</div>'+(x.en&&x.en.length?'<div class="ens">'+enRows(x.en)+'</div>':'')+'</div>';}
/* ===== 日語 ===== */
function jaRow(t){return '<div class="en" data-lang="ja" data-say="'+esc(t)+'"><span class="ic">🔊</span><span class="tx">'+esc(t)+'</span><span class="sp">點我跟讀</span></div>';}
const WHO={guide:'導遊接待',leader:'領隊在日本',all:'共用'};
function jpPhraseCard(x){return '<div class="ocard"><div class="ohead"><span class="chip">'+esc(x.scene)+'</span><span class="who">'+WHO[x.who]+'</span></div>'+jaRow(x.ja)+'<div class="jz">'+esc(x.zh)+(x.tip?' · '+esc(x.tip):'')+'</div></div>';}
function jpTopicCard(x,i){return '<div class="ocard"><div class="ohead"><span class="chip">'+esc(x.title)+'</span><button class="playall" data-all="'+i+'">▶ 全文朗讀</button></div>'+
  x.ja.map(function(t,k){return jaRow(t)+'<div class="jz">'+esc(x.zh[k]||'')+'</div>';}).join('')+
  (x.kw&&x.kw.length?'<table class="kwt">'+x.kw.map(function(w){return '<tr><td>'+esc(w[0])+'</td><td>'+esc(w[1]||'')+'</td><td>'+esc(w[2]||'')+'</td></tr>';}).join('')+'</table>':'')+'</div>';}
function introText(k,n){
  const scope=CERT==='all'?'':'（'+CNAME[CERT]+'）';
  if(k==='phrases')return '🗣️ <b>'+n+' 句</b>帶團現場實用句'+scope+'(過海關、入住、點餐、殺價…),導遊/領隊口試與實戰都用得到。<b>點藍色英文句可跟讀</b>。';
  if(k==='topics')return '📋 <b>'+n+' 個</b>閱讀文章主題'+scope+'的口試準備方向(常考議題 + 該準備的關鍵字),口試前掃一遍。';
  if(k==='jphr')return '🗣️ <b>'+n+' 句</b>日語接待實用句'+scope+':接機、車上、飯店、景點、用餐、夜市、緊急狀況、送機,以及領隊在日本會用到的說法。<b>點日文句可跟讀</b>。';
  return '📋 <b>'+n+' 個</b>日語口試主題範例:自我介紹與台灣代表景點、美食、節慶。先聽、再跟讀,最後換成自己的話說說看。';
}
function render(){
  const barEl=document.querySelector('.bar');
  if(cur==='mock'){barEl.style.display='none';renderMock();return;}
  barEl.style.display='';
  const kw=document.getElementById('q').value.trim().toLowerCase();
  let base, arr, html;
  if(cur==='jphr'){
    base=ORALJP.phrases.filter(x=>CERT==='all'||x.who==='all'||x.who===CERT);
    arr=base.filter(x=>!kw||(x.ja+' '+x.zh+' '+x.scene).toLowerCase().includes(kw));
    html=arr.map(jpPhraseCard).join('');
  }else if(cur==='jtop'){
    base=ORALJP.topics;
    arr=base.map((x,i)=>[x,i]).filter(p=>!kw||(p[0].title+' '+p[0].ja.join('')+' '+p[0].zh.join('')).toLowerCase().includes(kw));
    html=arr.map(p=>jpTopicCard(p[0],p[1])).join('');
  }else if(cur==='phrases'){
    base=scopeArr(ORAL.phrases);
    arr=base.filter(x=>!kw||x.real.toLowerCase().includes(kw)||(x.en||[]).join(' ').toLowerCase().includes(kw)||x.topic.toLowerCase().includes(kw));
    html=arr.map(x=>card(x,'<span class="chip">'+esc(x.topic)+'</span>')).join('');
  }else{
    base=scopeArr(ORAL.topics);
    arr=base.filter(x=>!kw||x.real.toLowerCase().includes(kw)||(x.label||'').toLowerCase().includes(kw));
    html=arr.map(x=>card(x,'<span class="chip">'+esc(x.label||'閱讀主題')+'</span>')).join('');
  }
  document.getElementById('cnt').textContent='共 '+arr.length+' 則';
  const tip=LANG==='jp'?'💡 跟讀技巧:先聽一次 → 暫停自己唸 → 再聽一次對照。語速可到「日文詳解」的設定列調整(慢 / 標準 / 快)。':'💡 跟讀技巧:先聽一次,暫停,自己唸一遍,再對照發音。口試重點是清楚 + 流暢,不用完美。';
  app.innerHTML='<div class="intro">'+introText(cur,base.length)+'</div>'+(html||'<div class="empty">找不到符合的內容</div>')+'<p class="tip">'+tip+'</p>';
}
function paintTabs(){
  if(!TABS[LANG].some(t=>t[0]===cur))cur=TABS[LANG][0][0];
  document.getElementById('tabs').innerHTML=TABS[LANG].map(t=>'<button class="tab'+(t[0]===cur?' on':'')+'" data-k="'+t[0]+'">'+t[1]+'</button>').join('');
  document.getElementById('sub').textContent=SUBT[LANG];
}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(cur==='mock'&&t.dataset.k!=='mock'){mockStop();MOCK.set=null;}cur=t.dataset.k;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.getElementById('q').value='';render();});
document.getElementById('q').addEventListener('input',render);
app.addEventListener('click',e=>{
  const mk=e.target.closest('[data-mk]');
  if(mk){const a=mk.dataset.mk;
    if(a==='start'){(async function(){await mockMic();mockStartQ();})();}
    else if(a==='newset'||a==='again'){mockStop();mockNewSet();renderMock();}
    else if(a==='go')mockAnswer();
    else if(a==='done')mockDone();
    else if(a==='next')mockNext();
    else if(a==='say'){const x=MOCK.set[MOCK.i];speak(x.q,LANG==='jp'?'ja':'en');}
    return;}
  const ms=e.target.closest('[data-mkset]');
  if(ms){const n=ms.dataset.mkset,v=+ms.dataset.v;if(n==='rec')MOCK.recOn=!!v;else MOCK[n]=v;MOCK.err='';mockSave();renderMock();return;}
  const pa=e.target.closest('.playall');if(pa){const x=ORALJP.topics[+pa.dataset.all];if(x)speak(x.ja.join(''),'ja');return;}
  const en=e.target.closest('.en');if(en)speak(en.dataset.say,en.dataset.lang);});
(function(){
  const bar=document.querySelector('.certbar');if(!bar)return;
  function paint(){bar.querySelectorAll('.cbtn[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===CERT));
    bar.querySelectorAll('.cbtn[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));}
  paint();
  bar.addEventListener('click',function(e){
    const l=e.target.closest('.cbtn[data-l]');
    if(l){if(l.dataset.l===LANG)return;mockStop();MOCK.set=null;LANG=l.dataset.l;try{localStorage.setItem('pref_oral_lang',LANG);}catch(err){}
      paint();paintTabs();document.getElementById('q').value='';render();return;}
    const b=e.target.closest('.cbtn[data-c]');if(!b||b.dataset.c===CERT)return;
    CERT=b.dataset.c;
    try{localStorage.setItem('pref_cert',CERT);}catch(err){}
    paint();render();
  });
})();
/* ===== C10 口試模擬:三大部分各抽 1 題 → 準備 → 計時作答(可錄音)→ 回放 + 參考範例 ===== */
const MOCK={set:null,i:0,phase:'intro',left:0,timer:null,stream:null,rec:null,chunks:[],audio:[],err:'',prep:30,dur:120,recOn:true};
(function(){try{const s=JSON.parse(localStorage.getItem('pref_oral_mock')||'{}');if(s.prep!=null)MOCK.prep=+s.prep;if(s.dur)MOCK.dur=+s.dur;if(s.rec!=null)MOCK.recOn=!!s.rec;}catch(e){}})();
const CAN_REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function mockSave(){try{localStorage.setItem('pref_oral_mock',JSON.stringify({prep:MOCK.prep,dur:MOCK.dur,rec:MOCK.recOn}));}catch(e){}}
function mockNewSet(){
  MOCK.audio.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});
  const P=LANG==='jp'?ORALMOCK.jp:ORALMOCK.en;
  const pick=p=>{const a=P.filter(x=>x.p===p);return a[Math.floor(Math.random()*a.length)];};
  MOCK.set=[pick(1),pick(2),pick(3)];MOCK.i=0;MOCK.audio=[];MOCK.phase='intro';MOCK.err='';
}
function mockClear(){if(MOCK.timer){clearInterval(MOCK.timer);MOCK.timer=null;}}
function recStop(){if(MOCK.rec&&MOCK.rec.state!=='inactive'){try{MOCK.rec.stop();}catch(e){}}MOCK.rec=null;}
function mockStop(){mockClear();recStop();if(MOCK.stream){MOCK.stream.getTracks().forEach(t=>t.stop());MOCK.stream=null;}}
async function mockMic(){   // 在「開始模擬」按下時就要麥克風權限(手機瀏覽器需要使用者操作才肯開)
  if(!MOCK.recOn||!CAN_REC)return false;
  if(MOCK.stream)return true;
  try{MOCK.stream=await navigator.mediaDevices.getUserMedia({audio:true});return true;}
  catch(e){MOCK.recOn=false;MOCK.err='無法使用麥克風(沒有授權或裝置不支援),這次先不錄音,其餘照常進行。';return false;}
}
function recStart(){
  if(!MOCK.stream)return;
  const idx=MOCK.i;MOCK.chunks=[];
  let r;try{r=new MediaRecorder(MOCK.stream);}catch(e){return;}
  r.ondataavailable=e=>{if(e.data&&e.data.size)MOCK.chunks.push(e.data);};
  r.onstop=()=>{if(MOCK.chunks.length)MOCK.audio[idx]=URL.createObjectURL(new Blob(MOCK.chunks,{type:r.mimeType||'audio/webm'}));if(cur==='mock')renderMock();};
  r.start();MOCK.rec=r;
}
function fmtT(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function mockTick(){
  MOCK.left--;
  const el=document.getElementById('mkTime');if(el)el.textContent=fmtT(MOCK.left);
  if(MOCK.left<=0){mockClear();if(MOCK.phase==='prep')mockAnswer();else if(MOCK.phase==='answer')mockDone();}
}
function mockStartQ(){mockClear();if(MOCK.prep>0){MOCK.phase='prep';MOCK.left=MOCK.prep;renderMock();MOCK.timer=setInterval(mockTick,1000);}else mockAnswer();}
function mockAnswer(){mockClear();MOCK.phase='answer';MOCK.left=MOCK.dur;recStart();renderMock();MOCK.timer=setInterval(mockTick,1000);}
function mockDone(){mockClear();recStop();MOCK.phase='done';renderMock();}
function mockNext(){if(MOCK.i<2){MOCK.i++;mockStartQ();}else{MOCK.phase='summary';mockClear();recStop();renderMock();setTimeout(function(){if(MOCK.phase==='summary'&&MOCK.stream){MOCK.stream.getTracks().forEach(t=>t.stop());MOCK.stream=null;}},800);}}
/* 日語模擬題的參考回答:沿用口試主題範例(ref),或直接附在題目上(ja / jz / jk)*/
function jpTopic(x){return x.ref!=null?(ORALJP.topics[x.ref]||null):(x.ja?{ja:x.ja,zh:x.jz||[],kw:x.jk||[]}:null);}
function kwList(x){return LANG==='jp'?((jpTopic(x)||{}).kw||[]).map(w=>w[0]+(w[1]?'('+w[1]+')':'')+' '+(w[2]||'')):x.kw.map(w=>w[0]+' '+w[1]);}
function kwHint(x){const k=kwList(x);return k.length?'<details class="mkhint"><summary>💡 提示關鍵字</summary>'+k.map(t=>'<span class="chip">'+esc(t)+'</span>').join(' ')+'</details>':'';}
function refHtml(x){
  if(LANG==='jp'){const t=jpTopic(x);if(!t)return '';
    return '<div class="mkref"><div class="mkh">📖 參考回答(日語範例 · 點句子跟讀)</div>'+t.ja.map((s,k)=>jaRow(s)+'<div class="jz">'+esc(t.zh[k]||'')+'</div>').join('')+
      (t.kw&&t.kw.length?'<table class="kwt">'+t.kw.map(w=>'<tr><td>'+esc(w[0])+'</td><td>'+esc(w[1]||'')+'</td><td>'+esc(w[2]||'')+'</td></tr>').join('')+'</table>':'')+'</div>';}
  return '<div class="mkref"><div class="mkh">📖 參考回答(英語範例 · 點句子跟讀)</div><div class="ens">'+enRows(x.sample)+'</div>'+
    '<table class="kwt">'+x.kw.map(w=>'<tr><td>'+esc(w[0])+'</td><td>'+esc(w[1])+'</td></tr>').join('')+'</table></div>';
}
function mkOpt(n,v,curV,label){return '<button class="mkopt'+(curV===v?' on':'')+'" data-mkset="'+n+'" data-v="'+v+'">'+label+'</button>';}
function renderMock(){
  if(!MOCK.set)mockNewSet();
  const L=LANG==='jp'?'日語':'英語';
  let h='<div class="intro">🎙 <b>外語導遊口試模擬('+L+')</b>:依官方口試三大部分——<b>自我介紹</b>、<b>本國文化與國情</b>、<b>風景、節慶與美食</b>,每部分抽 1 題。正式口試每人約 10–12 分鐘(115 年簡章)。錄音只在這台裝置播放,不會上傳,離開頁面就消失。</div>';
  if(MOCK.err)h+='<div class="mkerr">'+esc(MOCK.err)+'</div>';
  if(MOCK.phase==='intro'){
    h+='<div class="ocard"><div class="mkrow"><span class="mkl">準備時間</span>'+mkOpt('prep',0,MOCK.prep,'不準備')+mkOpt('prep',30,MOCK.prep,'30 秒')+mkOpt('prep',60,MOCK.prep,'1 分鐘')+'</div>'+
       '<div class="mkrow"><span class="mkl">每題作答</span>'+mkOpt('dur',60,MOCK.dur,'1 分鐘')+mkOpt('dur',120,MOCK.dur,'2 分鐘')+mkOpt('dur',180,MOCK.dur,'3 分鐘')+'</div>'+
       '<div class="mkrow"><span class="mkl">錄音回放</span>'+(CAN_REC?mkOpt('rec',1,MOCK.recOn?1:0,'開')+mkOpt('rec',0,MOCK.recOn?1:0,'關'):'<span class="mkno">這個瀏覽器不支援錄音,會只計時</span>')+'</div></div>';
    h+='<div class="ocard"><div class="mkh">這次抽到的題目</div>'+MOCK.set.map((x,k)=>'<div class="mkq0"><span class="chip">'+(k+1)+'. '+ORALMOCK.parts[x.p]+'</span> '+esc(x.zh)+'</div>').join('')+
       '<div class="mkbtns"><button class="mkbtn pri" data-mk="start">▶ 開始模擬</button><button class="mkbtn" data-mk="newset">🔀 換一組題目</button></div></div>';
  }else if(MOCK.phase==='summary'){
    h+='<div class="ocard"><div class="mkh">🎉 模擬完成!回放自己的回答,對照參考範例再練一次</div>'+MOCK.set.map((x,k)=>'<div class="mksum"><div><span class="chip">'+(k+1)+'. '+ORALMOCK.parts[x.p]+'</span> '+esc(x.q)+'</div>'+
       (MOCK.audio[k]?'<audio controls src="'+MOCK.audio[k]+'"></audio>':'<div class="mkno">(這題沒有錄音)</div>')+'</div>').join('')+
       '<div class="mkbtns"><button class="mkbtn pri" data-mk="again">🔀 再來一組</button></div></div>';
  }else{
    const x=MOCK.set[MOCK.i];
    h+='<div class="ocard"><div class="ohead"><span class="chip">第 '+(MOCK.i+1)+'/3 題 · '+ORALMOCK.parts[x.p]+'</span><button class="playall" data-mk="say">🔊 聽題目</button></div>'+
       '<div class="mkq">'+esc(x.q)+'</div><div class="mkzh">'+esc(x.zh)+'</div>';
    if(MOCK.phase==='prep')h+='<div class="mkstage">準備中 <span id="mkTime">'+fmtT(MOCK.left)+'</span></div>'+kwHint(x)+'<div class="mkbtns"><button class="mkbtn pri" data-mk="go">開始回答</button></div>';
    else if(MOCK.phase==='answer')h+='<div class="mkstage ans">'+(MOCK.rec?'🔴 錄音中':'⏱ 作答中')+' <span id="mkTime">'+fmtT(MOCK.left)+'</span></div>'+kwHint(x)+'<div class="mkbtns"><button class="mkbtn pri" data-mk="done">✓ 回答完畢</button></div>';
    else h+=(MOCK.audio[MOCK.i]?'<div class="mkh">🎧 你的回答</div><audio controls src="'+MOCK.audio[MOCK.i]+'"></audio>':'')+refHtml(x)+
         '<div class="mkbtns"><button class="mkbtn pri" data-mk="next">'+(MOCK.i<2?'下一題 →':'看總結')+'</button></div>';
    h+='</div>';
  }
  h+='<p class="tip">💡 回答技巧:先用一句話點題,再講 2–3 個重點(地點 / 特色 / 推薦),最後一句收尾。卡住時放慢,不必追求完美。</p>';
  app.innerHTML=h;
}
window.addEventListener('pagehide',mockStop);
document.addEventListener('visibilitychange',function(){if(document.hidden&&(MOCK.phase==='prep'||MOCK.phase==='answer'))mockDone();});
paintTabs();
render();
</script>
</body>
</html>
